<script>
/* =====================================================================
   TechPoint · sistema de ventas en un solo archivo
   Datos: Supabase "orbe-clientes", esquema techpoint, sólo por funciones tp_*.
   Todo lo que mueve plata o stock lo hace la base (todo o nada).
   Por ahora sin pantalla de login: se elige "con qué usuario entrar" arriba a la derecha.
   ===================================================================== */
const VERSION = 'v17';
// Base propia del dueño (Supabase, organización TechPoint) desde el 24/10/2026. Antes: orbe-clientes de José.
const NUBE = { url: 'https://ihmnfcmkvckhueowkzet.supabase.co', key: 'sb_publishable_fltCybLk39k92dPRant28A_FT8pGJRL' };
const MEDIOS = ['Efectivo', 'Débito', 'Crédito', 'Transferencia', 'Mercado Pago'];
// Mercado Pago se cobra con una de estas opciones (008): se guarda como "Mercado Pago QR", etc.
const OPCIONES_MP = ['QR', '3 cuotas', '6 cuotas'];
// Crédito en 1, 2, 3 o 6 pagos (014): se guarda como "Crédito 3 pagos", etc. Sin recargo.
const OPCIONES_CREDITO = ['1 pago', '2 pagos', '3 pagos', '6 pagos'];
const MEDIOS_PAGO = ['Efectivo', 'Débito', ...OPCIONES_CREDITO.map(o => 'Crédito ' + o), 'Transferencia', ...OPCIONES_MP.map(o => 'Mercado Pago ' + o)];
const CATEGORIAS = ['Funda', 'Flip cover', 'Vidrio templado', 'Cargador', 'Cable', 'Auricular', 'Parlante', 'Soporte',
                    'Adaptador', 'Power bank', 'Memoria', 'Smartwatch', 'Tablet', 'Computación', 'Gamer', 'Otro'];
// Las de la lista fija más las que creó el dueño (texto libre), con "Otro" al final
const listaCategorias = filas => {
  const extra = [...new Set(filas.map(p => p.categoria))].filter(c => !CATEGORIAS.includes(c)).sort((a, b) => a.localeCompare(b));
  return [...CATEGORIAS.slice(0, -1), ...extra, 'Otro'];
};
const opcionesCategoria = (actual, cats = ST.cats || CATEGORIAS) =>
  cats.map(c => `<option ${actual === c ? 'selected' : ''}>${esc(c)}</option>`).join('') + '<option value="__nueva">+ Nueva categoría…</option>';
// Si eligió "+ Nueva categoría…", pide el nombre; devuelve la categoría elegida o null si canceló
function elegirCategoria(sel) {

function numero(x) {

// Búsqueda: código, nombre, marca o modelo. Atajos de iPhone: ip, ip13, ip15p, ip17pm.
function filtrar(lista, q) {
  const palabras = q.trim().split(/\s+/).filter(Boolean);
  const res = lista.filter(p => palabras.every(w => {
    const m = /^ip(?:hone)?(\d+)?(pm|p|plus|\+|mini)?$/i.exec(w);
    if (m) {
      if (p.marca !== 'iPhone') return false;
      if (!m[1]) return true;
      const suf = { pm: ' Pro Max', p: ' Pro', plus: ' Plus', '+': ' Plus', mini: ' mini' }[(m[2] || '').toLowerCase()] || '';
      const t = (m[1] + suf).toLowerCase();
      return (p.modelo || '').toLowerCase().startsWith(t) || (p.descripcion || '').toLowerCase().includes(t);
    }
    return p.codigo === w || `${p.descripcion} ${p.marca} ${p.modelo}`.toLowerCase().includes(w.toLowerCase());
  }));
  return res.sort((a, b) => (a.codigo === q.trim() ? 0 : 1) - (b.codigo === q.trim() ? 0 : 1) || a.descripcion.localeCompare(b.descripcion));
}

function editando() {
  const app = $('app'), a = document.activeElement;
  if (a && app.contains(a) && a.matches('input, select, textarea')) return true;
  const sel = window.getSelection && window.getSelection();
  if (sel && !sel.isCollapsed && app.contains(sel.anchorNode)) return true;      // está marcando texto para copiar
  return [...app.querySelectorAll('input, select, textarea')].some(el => {
    if (el.tagName === 'SELECT') { const def = [...el.options].findIndex(o => o.defaultSelected); return el.selectedIndex !== (def < 0 ? 0 : def); }
    if (el.type === 'checkbox' || el.type === 'radio') return el.checked !== el.defaultChecked;
    return el.value !== el.defaultValue;
  });
}

  if (n !== ST.pintadas || location.hash !== hash || html === ST.html || editando()) return;

function buscarVenta() {
  const q = $('buscar').value.trim();
  V.resultados = q ? filtrar(V.catalogo, q).slice(0, 25) : [];
  V.sel = 0; pintarResultados(); $('no-encontrado').innerHTML = '';
}
// Enter en el buscador. La pistola lectora escribe el código y manda Enter: si coincide exacto, se agrega directo.
function enterBuscar() {
  const q = $('buscar').value.trim();
  if (!q) return;
  const exacto = V.catalogo.find(p => p.codigo && p.codigo.toLowerCase() === q.toLowerCase());
  if (exacto) { V.resultados = [exacto]; agregar(0); pitido(); return; }
  buscarVenta();
  if (V.resultados[V.sel]) { agregar(V.sel); return; }
  if (pareceCodigo(q)) {
    $('no-encontrado').innerHTML = `<div class="aviso error" style="margin-top:8px">No hay ningún producto con el código <b>${esc(q)}</b>.
      ${es('dueno') ? `<a href="#producto/nuevo" onclick="ST.codigoNuevo='${esc(q).replace(/'/g, '')}'">Cargarlo ahora</a>` : 'Avisale al encargado para que lo cargue.'}</div>`;
    $('buscar').select();
  }
}
const pareceCodigo = q => /^[0-9A-Za-z._-]{4,}$/.test(q) && /\d/.test(q);
function pitido() {
  try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
        o.frequency.value = 1400; g.gain.value = .05; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .07); } catch (e) {}
}
function pintarResultados() {
  $('resultados').innerHTML = V.resultados.map((p, i) => `
    <div class="resultado ${i === V.sel ? 'sel' : ''}" onclick="agregar(${i})">
      <span>${tilde(p.clase)}${esc(p.descripcion)} <span class="etiqueta">${esc(p.marca)}${p.modelo ? ' ' + esc(p.modelo) : ''}</span>${p.clase ? ` <span class="etiqueta ${p.clase === 'original' ? 'azul' : ''}">${CLASES[p.clase]}</span>` : ''} <span class="suave">${esc(p.codigo || '')}</span></span>
      <span style="white-space:nowrap"><b>${fmt(p.precio)}</b></span>
    </div>`).join('') || ($('buscar').value.trim() ? '<p class="suave">Sin resultados.</p>' : '');
}
function agregar(i) {
  const p = V.resultados[i];
  if (p.codigo === COD_DIFERENCIA) return agregarDiferencia(p);
  const modelo = PIDE_MODELO.includes(p.categoria);
  // Las fundas y protectores van en una línea cada uno: cada uno puede ser para otro celular
  const ya = !modelo && V.carrito.find(x => x.producto_id === p.id);
  if (ya) ya.cantidad++;
  else V.carrito.push({ producto_id: p.id, descripcion: p.descripcion, cantidad: 1, precio: +p.precio, pide_modelo: modelo, clase: p.clase,
                        marca_cel: MARCAS_CEL.includes(p.marca) ? p.marca : '', modelo_cel: p.modelo || '' });
  $('buscar').value = ''; V.resultados = []; pintarResultados(); pintarCarrito();
  // Si pide modelo, el cursor va al primer dato que falta; si no, vuelve al buscador
  const k = V.carrito.length - 1, l = V.carrito[k];
  if (modelo && !ya) (l.marca_cel ? $('mo-' + k) : $('ma-' + k)).focus(); else $('buscar').focus();
}
const faltaModelo = i => i.pide_modelo && (!i.marca_cel || !i.modelo_cel.trim());
function agregarLibre() {
  const d = $('libre-desc').value.trim(), pr = parseFloat($('libre-precio').value);
  if (!d || !(pr >= 0)) return;
  V.carrito.push({ producto_id: null, descripcion: d, cantidad: 1, precio: pr });
  $('libre-desc').value = ''; $('libre-precio').value = ''; pintarCarrito();
}
// Diferencia por devolución: una línea más de la venta con el monto que pone el vendedor
function agregarDiferencia(p) {
  V.carrito.push({ producto_id: p.id, descripcion: p.descripcion, cantidad: 1, precio: +p.precio > 0 ? +p.precio : 0, libre: true });
  $('buscar').value = ''; V.resultados = []; pintarResultados(); pintarCarrito();
  $('pr-' + (V.carrito.length - 1)).focus();
}
const faltaValor = i => i.libre && !(i.precio > 0);
const hayCredito = () => V.carrito.some(i => i.es_credito);
function pintarCarrito() {
  const puede = es('encargado');
  $('carrito').innerHTML = !V.carrito.length ? '<tr><td colspan="5" class="suave">Buscá un producto (o escaneá el código) y tocá Enter para agregarlo.</td></tr>'

      <td>${tilde(i.clase)}${esc(i.descripcion)}${i.pide_modelo ? `<div class="modelo-cel">
        <select id="ma-${k}" class="${i.marca_cel ? '' : 'falta'}" aria-label="Marca del celular" onchange="V.carrito[${k}].marca_cel=this.value;this.classList.toggle('falta',!this.value);$('mo-${k}').focus()">

        <input id="mo-${k}" class="${i.modelo_cel.trim() ? '' : 'falta'}" value="${esc(i.modelo_cel)}" placeholder="Modelo (A15, 13 Pro…)" aria-label="Modelo del celular" autocomplete="off"
          oninput="V.carrito[${k}].modelo_cel=this.value;this.classList.toggle('falta',!this.value.trim())"
          onkeydown="if(event.key==='Enter'){event.preventDefault();$('buscar').focus()}">
      </div>` : ''}</td>
      <td class="n"><input type="number" min="1" value="${i.cantidad}" onchange="V.carrito[${k}].cantidad=Math.max(1,+this.value||1);pintarCarrito()"></td>
      <td class="n"><input id="pr-${k}" class="precio ${faltaValor(i) ? 'falta' : ''}" type="number" min="0" value="${i.libre && !i.precio ? '' : i.precio}" ${i.libre ? 'placeholder="Monto" aria-label="Monto de la diferencia"' : ''} ${puede || i.libre ? '' : 'readonly title="Sólo el encargado o el dueño cambian precios"'} onchange="V.carrito[${k}].precio=Math.max(0,Math.round(+this.value||0));pintarCarrito()"></td>
      <td class="n">${fmt(i.cantidad * i.precio)}</td>

  $('obs-caja').hidden = !hayCredito();
  pintarTotal();
}
const productosCarrito = () => V.carrito.filter(i => !i.es_credito);
const creditos = () => V.carrito.filter(i => i.es_credito).reduce((s, i) => s + i.precio, 0);
const subtotal = () => productosCarrito().reduce((s, i) => s + i.cantidad * i.precio, 0) - creditos();
const medioUnico = () => {
  const m = document.querySelector('input[name=medio]:checked').value;
  if (m === 'Crédito') return 'Crédito ' + document.querySelector('input[name=cr]:checked').value;
  return m === 'Mercado Pago' ? 'Mercado Pago ' + document.querySelector('input[name=mp]:checked').value : m;
};
const conDescuento = () => !V.pagos && medioUnico() === 'Efectivo' && +ST.ini.descuento > 0;
// El 10 % en efectivo se aplica sólo a lo que se lleva, no a la diferencia por devolución (igual que la base)
const totalFinal = () => conDescuento()
  ? productosCarrito().reduce((s, i) => s + i.cantidad * (i.libre ? i.precio : Math.floor(i.precio * (1 - ST.ini.descuento / 100) + 0.5)), 0) - creditos()
  : subtotal();
function pintarTotal() {
  const t = totalFinal();
  $('total').textContent = fmt(t);
  $('desc').textContent = conDescuento() && V.carrito.length ? `Subtotal ${fmt(subtotal())} · descuento efectivo ${+ST.ini.descuento}%: −${fmt(subtotal() - t)}` : '';
  if (V.pagos) {
    const falta = t - V.pagos.reduce((s, p) => s + (+p.monto || 0), 0);
    $('falta').innerHTML = Math.abs(falta) < 1 ? '<span class="ok">Cubierto</span>' : falta > 0 ? `Falta <b>${fmt(falta)}</b>` : `<span class="mal">Sobra ${fmt(-falta)}</span>`;
  }
}
function dividir(e) {
  if (e) e.preventDefault();
  if (V.pagos) { V.pagos = null; $('mixto').hidden = true; $('medios').hidden = false; $('mp-opciones').hidden = !medioUnico().startsWith('Mercado Pago'); $('cr-opciones').hidden = !medioUnico().startsWith('Crédito'); $('dividir').textContent = 'Dividir el pago en varios medios'; pintarTotal(); return; }
  V.pagos = [{ medio: 'Efectivo', monto: '' }, { medio: 'Débito', monto: '' }];
  $('mixto').hidden = false; $('medios').hidden = true; $('mp-opciones').hidden = true; $('cr-opciones').hidden = true; $('dividir').textContent = 'Volver a un solo medio';

}
function otroPago() { V.pagos.push({ medio: MEDIOS_PAGO.find(m => !V.pagos.some(p => p.medio === m)) || MEDIOS_PAGO[0], monto: '' }); pintarPagos(); }
function pintarPagos() {
  $('pagos').innerHTML = V.pagos.map((p, k) => `<tr>
    <td><select onchange="V.pagos[${k}].medio=this.value">${MEDIOS_PAGO.map(m => `<option ${m === p.medio ? 'selected' : ''}>${m}</option>`).join('')}</select></td>
    <td class="n"><input type="number" min="0" step="1" value="${p.monto}" placeholder="$" style="width:110px" oninput="V.pagos[${k}].monto=this.value;pintarTotal()"></td>
    <td>${V.pagos.length > 2 ? `<button type="button" class="sec chico" onclick="V.pagos.splice(${k},1);pintarPagos()">✕</button>` : ''}</td></tr>`).join('');

// Cliente por teléfono: si ya compró, se muestra quién es y cuántas compras tiene

    const c = r.find(x => x.telefono.endsWith(dig.slice(-8))) || null;
    if (c && !$('cliente').value && c.nombre) $('cliente').value = c.nombre;
    $('cliente-info').innerHTML = c ? `<p class="cliente-ok">Cliente conocido: ${esc(c.nombre || 'sin nombre')} · ${c.compras} compra${c.compras === 1 ? '' : 's'} · <a href="#cliente/${c.id}" target="_blank">ver</a></p>`
      : '<p class="suave" style="font-size:13px;margin:4px 0 0">Cliente nuevo: queda guardado con esta venta.</p>';
  } catch (e) { $('cliente-info').innerHTML = ''; }
}
async function cobrar() {

  const sinModelo = V.carrito.findIndex(faltaModelo);
  if (sinModelo >= 0) {
    $('estado').innerHTML = `<span class="mal">Completá la marca y el modelo del celular en «${esc(V.carrito[sinModelo].descripcion)}».</span>`;
    (V.carrito[sinModelo].marca_cel ? $('mo-' + sinModelo) : $('ma-' + sinModelo)).focus(); return;
  }
  const sinValor = V.carrito.findIndex(faltaValor);
  if (sinValor >= 0) { $('estado').innerHTML = '<span class="mal">Escribí el monto en «Diferencia por devolución».</span>'; $('pr-' + sinValor).focus(); return; }
  if (hayCredito() && $('obs').value.trim().length < 10) {
    $('estado').innerHTML = '<span class="mal">Explicá en Observaciones por qué hay una diferencia por devolución (mínimo 10 letras).</span>'; $('obs').focus(); return;
  }
  if (totalFinal() < 0) { $('estado').innerHTML = '<span class="mal">La diferencia por devolución es mayor que lo que se lleva el cliente.</span>'; return; }
  if (esLocal() && !$('vendedor').value) { $('estado').innerHTML = '<span class="mal">Elegí quién hace la venta.</span>'; $('vendedor').focus(); return; }

function elegirVendedor(id, suc, actual) {
  const lista = vendedoresDe(suc, true);
  if (actual && !lista.some(x => x.id === actual)) lista.unshift({ id: actual, nombre: (ST.ini.usuarios.find(x => x.id === actual) || {}).nombre || '(otro)' });
  $('vend-' + id).innerHTML = `<select id="vsel-${id}" aria-label="Vendedor">${lista.map(x => `<option value="${x.id}" ${x.id === actual ? 'selected' : ''}>${esc(x.nombre)}</option>`).join('')}</select>
    <button class="chico" onclick="cambiarVendedor(${id})">Guardar</button> <button class="sec chico" onclick="render()">✕</button>`;
  $('vsel-' + id).focus();
}
async function cambiarVendedor(id) {
  try { const r = await rpc('tp_venta_vendedor', { ...U(), p_id: id, p_vendedor: +$('vsel-' + id).value }); avisar(`Venta #${id}: ahora figura ${r.vendedor || 'el mismo vendedor'}.`); }

}

// Corregir los medios de pago de una venta ya hecha (016): encargado (su local), supervisor, dueño y superadmin.
// El total no cambia: un medio, o varios que sumen el total.
const EP = {};
function editarPagos(id) {
  const v = (ST.ventasVista || []).find(x => x.id === id);
  if (!v) return;
  const pagos = v.pagos && v.pagos.length ? v.pagos : [{ medio: v.medio_pago, monto: v.total }];
  EP[id] = { total: +v.total, pagos: pagos.map(p => ({ medio: p.medio, monto: +p.monto })) };
  pintarEditorPagos(id);
}
function pintarEditorPagos(id) {
  const e = EP[id], varios = e.pagos.length > 1;
  $('pago-' + id).innerHTML = e.pagos.map((p, k) => `<div class="fila" style="gap:4px;margin-bottom:4px;flex-wrap:nowrap">
      <select aria-label="Medio de pago" onchange="EP[${id}].pagos[${k}].medio=this.value">${[...new Set([p.medio, ...MEDIOS_PAGO])].map(m => `<option ${m === p.medio ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select>
      ${varios ? `<input type="number" min="1" step="1" value="${p.monto || ''}" placeholder="$" style="width:95px" aria-label="Monto"
          oninput="EP[${id}].pagos[${k}].monto=+this.value||0;$('ep-falta-${id}').textContent=faltaPagos(${id})">
        <button class="sec chico" aria-label="Quitar este medio" onclick="EP[${id}].pagos.splice(${k},1);pintarEditorPagos(${id})">✕</button>` : ''}</div>`).join('')
    + `<div class="fila" style="gap:4px"><button class="sec chico" onclick="EP[${id}].pagos.push({medio:'Efectivo',monto:0});pintarEditorPagos(${id})">+ Medio</button>
       <button class="chico" onclick="guardarPagos(${id})">Guardar</button> <button class="sec chico" onclick="delete EP[${id}];render()">Cancelar</button></div>
       <small class="suave" id="ep-falta-${id}">${faltaPagos(id)}</small>`;
  $('pago-' + id).querySelector('select').focus();
}
function faltaPagos(id) {
  const e = EP[id];
  if (e.pagos.length < 2) return `Total ${fmt(e.total)}`;
  const r = e.total - e.pagos.reduce((s, p) => s + (+p.monto || 0), 0);
  return Math.abs(r) < 1 ? 'Cuadra con el total' : `${r > 0 ? 'Faltan' : 'Sobran'} ${fmt(Math.abs(r))} para el total de ${fmt(e.total)}`;
}
async function guardarPagos(id) {
  const e = EP[id];
  try {
    const r = await rpc('tp_venta_pagos', { ...U(), p_id: id, p_pagos: e.pagos.map(p => ({ medio: p.medio, monto: e.pagos.length > 1 ? p.monto : null })) });
    avisar(`Venta #${id}: medio de pago corregido (${r.medio_pago}).` +
           (r.caja_cerrada ? ' Ojo: la caja de esa venta ya estaba cerrada, así que su cierre ahora muestra los montos corregidos.' : ''));
    delete EP[id];
  } catch (err) { return alert(err.message); }
  render();
}

async function anular(id) {
  if (!confirm(`¿Anular la venta #${id}?`)) return;
  try { await rpc('tp_venta_anular', { ...U(), p_id: id }); avisar(`Venta #${id} anulada.`); }
  catch (e) { avisar(e.message, true); }
  render();
}

// ---------------------------------------------------------------- cambios y devoluciones
const D = { venta: null, nuevos: [], resultados: [], catalogo: [], timer: null };

async function vDevolucion(id) {
  const d = await rpc('tp_venta', { ...U(), p_id: +id });
  const v = d.venta, f = v.fecha;
  if (v.anulada || v.tipo !== 'venta') return '<div class="aviso error">Esa venta no admite cambios ni devoluciones.</div>';
  D.venta = d; D.nuevos = []; D.resultados = [];
  D.catalogo = await rpc('tp_catalogo', { p_suc: v.sucursal_id });
  despues(() => {
    $('buscar').addEventListener('input', () => { clearTimeout(D.timer); D.timer = setTimeout(buscarDev, 120); });
    $('buscar').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); buscarDev(); if (D.resultados[0]) agregarDev(0); } });
    pintarDev();
  });
  const items = d.items.filter(i => i.cantidad > 0 && !i.es_credito);
  return `<h1>Cambio o devolución <span class="suave" style="font-size:16px">venta #${v.id} · ${esc(d.sucursal)} · ${fc(f)}</span></h1>
  <p class="suave">1) Marcá qué devuelve el cliente. 2) Si es un cambio, agregá lo que se lleva. 3) El sistema calcula la diferencia: si da positivo cobrás, si da negativo le devolvés.</p>
  <div class="venta">
    <div>
      <div class="panel tabla-scroll">
        <h2>Lo que devuelve</h2>
        <table><tr><th>Producto</th><th class="n">Vendido</th><th class="n">Ya devuelto</th><th class="n">Precio pagado</th><th class="n">Devuelve</th></tr>
          ${items.map(i => `<tr><td>${esc(i.descripcion)}</td><td class="n">${i.cantidad}</td><td class="n">${i.devuelto || '—'}</td><td class="n">${fmt(i.precio_unit)}</td>
            <td class="n">${i.cantidad - i.devuelto > 0 ? `<input type="number" min="0" max="${i.cantidad - i.devuelto}" value="0" style="width:70px" data-item="${i.id}" data-precio="${i.precio_unit}" oninput="pintarDev()">` : '<span class="suave">nada</span>'}</td></tr>`).join('')}
        </table>
        ${+v.descuento ? '<p class="suave">Esta venta tuvo descuento por pago en efectivo: se devuelve lo que pagó el cliente.</p>' : ''}
      </div>
      <div class="panel">
        <h2>Lo que se lleva <span class="suave" style="font-size:13px">(sólo si es un cambio)</span></h2>
        <input id="buscar" placeholder="Buscar producto para el cambio…" autocomplete="off" style="width:100%">
        <div class="resultados" id="resultados"></div>
        <table class="carrito" style="margin-top:8px"><tbody id="nuevos"></tbody></table>
      </div>
    </div>
    <div class="panel">
      <h2>Diferencia</h2>
      <table><tr><td>Devuelve</td><td class="n" id="t-devuelve">$ 0</td></tr><tr><td>Se lleva</td><td class="n" id="t-lleva">$ 0</td></tr></table>
      <div class="total-grande" id="total">$ 0</div>
      <p id="sentido" class="suave" style="text-align:right;margin-top:-8px"></p>
      <label class="suave" for="medio">Medio de pago de la diferencia</label>
      <select id="medio" style="width:100%">${MEDIOS_PAGO.map(m => `<option>${m}</option>`).join('')}</select>
      <p><button id="confirmar" style="width:100%;padding:13px" onclick="confirmarDev()">Registrar</button></p>
      <p id="estado" class="suave"></p>
      <p><a href="#ventas">Volver a ventas</a></p>
    </div>
  </div>`;
}
function buscarDev() {
  const q = $('buscar').value.trim();
  D.resultados = q ? filtrar(D.catalogo, q).slice(0, 25) : [];
  $('resultados').innerHTML = D.resultados.map((p, i) => `<div class="resultado" onclick="agregarDev(${i})"><span>${esc(p.descripcion)} <span class="etiqueta">${esc(p.marca)} ${esc(p.modelo || '')}</span></span><span><b>${fmt(p.precio)}</b></span></div>`).join('');
}
function agregarDev(i) {
  const p = D.resultados[i];
  const ya = D.nuevos.find(x => x.producto_id === p.id);
  if (ya) ya.cantidad++; else D.nuevos.push({ producto_id: p.id, descripcion: p.descripcion, cantidad: 1, precio: +p.precio });
  $('buscar').value = ''; D.resultados = []; $('resultados').innerHTML = ''; pintarDev();
}
function pintarDev() {
  $('nuevos').innerHTML = D.nuevos.map((i, k) => `<tr><td>${esc(i.descripcion)}</td>
    <td class="n"><input type="number" min="1" value="${i.cantidad}" onchange="D.nuevos[${k}].cantidad=Math.max(1,+this.value||1);pintarDev()"></td>
    <td class="n">${fmt(i.cantidad * i.precio)}</td><td><button class="sec chico" onclick="D.nuevos.splice(${k},1);pintarDev()">✕</button></td></tr>`).join('');
  const devuelve = [...document.querySelectorAll('[data-item]')].reduce((s, el) => s + (+el.value || 0) * +el.dataset.precio, 0);
  const lleva = D.nuevos.reduce((s, i) => s + i.cantidad * i.precio, 0), dif = lleva - devuelve;
  $('t-devuelve').textContent = '−' + fmt(devuelve); $('t-lleva').textContent = fmt(lleva); $('total').textContent = fmt(dif);
  $('sentido').textContent = dif > 0 ? 'El cliente paga la diferencia' : dif < 0 ? 'Se le devuelve al cliente' : 'Sin diferencia';
}
async function confirmarDev() {
  const devolver = [...document.querySelectorAll('[data-item]')].map(el => ({ item_id: +el.dataset.item, cantidad: +el.value || 0 })).filter(d => d.cantidad > 0);
  $('confirmar').disabled = true;
  try {
    const d = await rpc('tp_devolucion', { ...U(), p_id: D.venta.venta.id, p_devolver: devolver, p_nuevos: D.nuevos, p_medio: $('medio').value });
    $('estado').innerHTML = `<span class="ok">Registrado como #${d.venta_id} (${fmt(d.total)}).</span><br><a href="#ticket/${d.venta_id}">Ver comprobante</a> · <a href="#ventas">Volver a ventas</a>`;
    document.querySelectorAll('[data-item]').forEach(el => el.disabled = true); $('confirmar').hidden = true;
  } catch (e) {
    $('estado').innerHTML = `<span class="mal">${esc(e.message)}</span>`; $('confirmar').disabled = false;
  }
}

// Cuadro de la caja (016): ventas e importe por vendedor y cuántos hydrogel vendió cada uno en el turno
function tablaVendedoresCaja(lista) {
  if (!lista) return '<p class="suave">Falta actualizar la base (SQL 016).</p>';
  if (!lista.length) return '<p class="suave">Sin ventas todavía.</p>';
  const t = lista.reduce((a, v) => ({ ventas: a.ventas + +v.ventas, total: a.total + +v.total, hydros: a.hydros + +v.hydros }), { ventas: 0, total: 0, hydros: 0 });
  return `<table><tr><th>Vendedor</th><th class="n">Ventas</th><th class="n">Importe</th><th class="n">Hydrogel</th></tr>
    ${lista.map(v => `<tr><td>${esc(v.vendedor)}</td><td class="n">${v.ventas}</td><td class="n">${fmt(v.total)}</td><td class="n"><b>${v.hydros}</b></td></tr>`).join('')}
    ${lista.length > 1 ? `<tr class="total"><td>Total</td><td class="n">${t.ventas}</td><td class="n">${fmt(t.total)}</td><td class="n">${t.hydros}</td></tr>` : ''}
  </table>`;
}

async function cerrarCaja(contado, obs) {

    avisar('Caja cerrada. ' + (ST.ini.respaldo ? await enviarRespaldo(r.caja_id) : 'El respaldo por mail no está configurado (Config).'));

async function enviarRespaldo(cajaId) {
  try {
    const r = await rpc('tp_respaldo_caja', { ...U(), p_caja: cajaId });
    if (!r.url) return 'El respaldo por mail no está configurado (Config).';
    const c = r.caja, x = r.detalle, k = x.clases;
    const resumen = [`TechPoint · ${r.sucursal} · cierre de caja del ${c.fecha}`,
      `Abrió ${c.abierta_por || '—'} (${c.abierta_en}) · cerró ${c.cerrada_por || '—'} (${c.cerrada_en || '—'})`, '',
      `Ventas del turno: ${fmt(x.total_ventas)}`, ...x.medios.map(m => `  ${m.medio}: ${fmt(m.total)} (${m.n})`), '',
      ...(x.vendedores && x.vendedores.length ? ['Por vendedor:', ...x.vendedores.map(v => `  ${v.vendedor}: ${v.ventas} ventas · ${fmt(v.total)} · ${v.hydros} hydrogel`), ''] : []),
      `Apertura ${fmt(c.apertura)} + efectivo ${fmt(x.efectivo)} + ingresos ${fmt(x.ingresos)} − egresos ${fmt(x.egresos)}`,
      `Esperado ${fmt(x.esperado)} · contado ${fmt(c.cierre_contado)} · diferencia ${fmt(x.diferencia)}`,
      `Originales: ${k.original.unidades} u. (${fmt(k.original.importe)}) · Genéricos: ${k.generico.unidades} u. (${fmt(k.generico.importe)})` +
        (k.sin_definir.unidades ? ` · Sin definir: ${k.sin_definir.unidades} u.` : ''),
      ...(c.observaciones ? ['', 'Observaciones: ' + c.observaciones] : [])].join('\n');
    const enc = ['Venta', 'Fecha', 'Vendedor', 'Tipo', 'Medio de pago', 'Producto', 'Cantidad', 'Precio unitario', 'Subtotal', 'Estado', 'Teléfono', 'Observaciones'];
    const csv = '﻿' + [enc, ...r.ventas].map(f => f.map(celdaCsv).join(';')).join('\r\n');
    await fetch(r.url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ clave: r.clave, asunto: `TechPoint · ${r.sucursal} · cierre ${c.fecha}`, resumen, csv,
                             archivo: `caja_${r.sucursal.replace(/\W+/g, '-')}_${c.fecha}.csv` }) });
    return 'Respaldo enviado por mail.';
  } catch (e) { return 'No se pudo enviar el respaldo por mail: ' + e.message + '. Probá con "Reenviar respaldo".'; }
}
// Tabla de originales / genéricos (unidades, importe y % sobre lo clasificado)
function tablaClases(k) {
  if (!k) return '';
  const tu = k.original.unidades + k.generico.unidades, ti = +k.original.importe + +k.generico.importe;
  const fila = (t, c) => `<tr><td>${t}</td><td class="n">${c.unidades} u.</td><td class="n">${tu ? pct(c.unidades / tu * 100) : '—'}</td><td class="n">${fmt(c.importe)}</td><td class="n">${ti ? pct(c.importe / ti * 100) : '—'}</td></tr>`;
  return `<table class="clases"><tr><th></th><th class="n">Unid.</th><th class="n">%</th><th class="n">Importe</th><th class="n">%</th></tr>
    ${fila('Originales', k.original)}${fila('Genéricos', k.generico)}
    ${k.sin_definir.unidades ? `<tr><td class="alerta">Sin definir</td><td class="n">${k.sin_definir.unidades} u.</td><td></td><td class="n">${fmt(k.sin_definir.importe)}</td><td></td></tr>` : ''}</table>`;
}

async function cambiarPrecios(f) {
  if (!P.marcados.size) return alert('Marcá al menos un producto.');
  const modo = f.modo.value, paso = +f.redondeo.value, valor = +f.sentido.value * Math.abs(numero(f.valor.value));
  if (!valor) return alert('Poné cuánto querés subir o bajar.');
  if (modo === 'porcentaje' && valor <= -100) return alert('No se puede bajar 100 % o más.');
  const nuevo = p => Math.max(0, Math.round((modo === 'porcentaje' ? +p.precio * (1 + valor / 100) : +p.precio + valor) / paso) * paso);
  const elegidos = P.filas.filter(p => P.marcados.has(p.id) && p.codigo !== COD_DIFERENCIA);
  if (!elegidos.length) return alert('«Diferencia por devolución» no tiene precio fijo: marcá otros productos.');
  const cuanto = modo === 'porcentaje' ? `${Math.abs(valor)} %` : fmt(Math.abs(valor));
  const ej = elegidos.slice(0, 3).map(p => `• ${p.descripcion}: ${fmt(p.precio)} → ${fmt(nuevo(p))}`).join('\n');
  if (!confirm(`Vas a ${valor > 0 ? 'SUBIR' : 'BAJAR'} ${cuanto} el precio de ${elegidos.length} productos.\n\nPor ejemplo:\n${ej}\n\n¿Seguir?`)) return;
  try {
    const r = await rpc('tp_productos_precio', { ...U(), p_ids: elegidos.map(p => p.id), p_modo: modo, p_valor: valor, p_redondeo: paso });
    avisar(`Precio actualizado en ${r.n} productos (${valor > 0 ? '+' : '−'}${cuanto}).`);
  } catch (e) { avisar(e.message, true); }
  render();
}

function leerCsv(texto) {
  const delim = (texto.match(/;/g) || []).length >= (texto.match(/,/g) || []).length ? ';' : ',';
  const filas = []; let fila = [], celda = '', comillas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (comillas) { if (c === '"' && texto[i + 1] === '"') { celda += '"'; i++; } else if (c === '"') comillas = false; else celda += c; }
    else if (c === '"') comillas = true;
    else if (c === delim) { fila.push(celda); celda = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && texto[i + 1] === '\n') i++; fila.push(celda); filas.push(fila); fila = []; celda = ''; }
    else celda += c;
  }
  if (celda || fila.length) { fila.push(celda); filas.push(fila); }
  const enc = (filas.shift() || []).map(h => h.trim().toLowerCase());
  return filas.map(f => Object.fromEntries(enc.map((h, i) => [h, (f[i] || '').trim()])));
}
async function importarCsv(archivo) {
  if (!archivo) return;
  const texto = (await archivo.text()).replace(/^﻿/, '');
  const claseDe = f => {
    const c = (f.clase || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    if (c.startsWith('orig')) return 'original';
    if (c.startsWith('gen')) return 'generico';
    const o = (f.original || '').toLowerCase();
    return ['1', 'si', 'sí', 'x'].includes(o) ? 'original' : ['0', 'no'].includes(o) ? 'generico' : null;
  };
  const filas = leerCsv(texto).filter(f => f.descripcion).map(f => ({
    codigo: f.codigo || null, descripcion: f.descripcion, categoria: f.categoria || 'Otro', marca: f.marca || 'Universal',
    modelo: f.modelo || '', precio: numero(f.precio), costo: numero(f.costo), clase: claseDe(f) }));
  try { const r = await rpc('tp_productos_importar', { ...U(), p_filas: filas }); avisar(`${r.n} productos importados.`); }
  catch (e) { avisar(e.message, true); }
  render();
}

// Medios de pago: total con %, Mercado Pago abierto en QR / cuotas y, con todos los locales, cada medio por local
const ORDEN_MEDIOS = ['Efectivo', 'Débito', ...OPCIONES_CREDITO.map(o => 'Crédito ' + o), 'Crédito', 'Transferencia', ...OPCIONES_MP.map(o => 'Mercado Pago ' + o), 'Mercado Pago'];
const ordenMedio = m => (ORDEN_MEDIOS.indexOf(m) + 1) || 99;
function panelMedios(r, sid) {
  const medios = [...r.medios].sort((a, b) => ordenMedio(a.medio) - ordenMedio(b.medio));
  const total = medios.reduce((s, m) => s + +m.total, 0);
  const pctDe = x => total ? `${Math.round(x / total * 100)} %` : '—';
  // Crédito (1, 2, 3, 6 pagos) y Mercado Pago (QR, 3, 6 cuotas): un renglón con el total y abajo cada opción
  const grupoDe = m => ['Crédito', 'Mercado Pago'].find(g => m === g || m.startsWith(g + ' '));
  const fila = (m, sub) => `<tr><td>${sub ? `<span class="suave">↳</span> ${esc(m.medio.replace(sub, '').trim() || 'sin detalle (ventas anteriores)')}` : esc(m.medio)}</td>
    <td class="n">${m.ventas}</td><td class="n">${fmt(m.total)}</td><td class="n">${pctDe(+m.total)}</td></tr>`;
  const filas = [];
  medios.forEach(m => {
    const g = grupoDe(m.medio);
    if (!g) return filas.push(fila(m));
    const del = medios.filter(x => grupoDe(x.medio) === g);
    if (m === del[0]) {
      const t = del.reduce((s, x) => s + +x.total, 0), n = del.reduce((s, x) => s + +x.ventas, 0);
      filas.push(`<tr><td><b>${g}</b></td><td class="n">${n}</td><td class="n"><b>${fmt(t)}</b></td><td class="n"><b>${pctDe(t)}</b></td></tr>`);
    }
    filas.push(fila(m, g));
  });
  // Por local: una columna por medio que tuvo movimiento
  const porSuc = !sid && r.medios_suc ? r.medios_suc : [];
  const cols = medios.map(m => m.medio);
  const locales = [...new Set(porSuc.map(x => x.sucursal))];
  const celda = (s, m) => porSuc.find(x => x.sucursal === s && x.medio === m);
  return `<div class="panel tabla-scroll"><h2>Medios de pago <span class="suave">· ${fmt(total)}</span></h2>
    <p class="suave">Lo cobrado por cada medio (en un pago dividido, cada parte cuenta en su medio).</p>
    <table><tr><th>Medio</th><th class="n">Ventas</th><th class="n">Importe</th><th class="n">% del total</th></tr>
      ${filas.join('') || '<tr><td colspan="4" class="suave">Sin ventas en el período.</td></tr>'}
      ${medios.length ? `<tr><td><b>Total</b></td><td></td><td class="n"><b>${fmt(total)}</b></td><td class="n">100 %</td></tr>` : ''}
    </table>
    ${locales.length > 1 ? `<h3 style="margin-top:18px">Por local</h3>
    <table><tr><th>Local</th>${cols.map(c => `<th class="n">${esc(c)}</th>`).join('')}<th class="n">Total</th></tr>
      ${locales.map(s => `<tr><td>${esc(s)}</td>${cols.map(c => `<td class="n">${celda(s, c) ? fmt(celda(s, c).total) : '—'}</td>`).join('')}
        <td class="n"><b>${fmt(porSuc.filter(x => x.sucursal === s).reduce((t, x) => t + +x.total, 0))}</b></td></tr>`).join('')}
    </table>` : ''}
  </div>`;
}
// Atajos de período y secciones que se pueden ocultar (se recuerda en este navegador)
const DIAS_SEM = ['', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const iso = d => d.toISOString().slice(0, 10);
const sumarDias = (s, n) => { const d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const ddmm = s => `${s.slice(8, 10)}/${s.slice(5, 7)}`;
function rangoAtajo(k) {
  const h = hoy(), d = new Date(h + 'T12:00:00Z'), m1 = h.slice(0, 8) + '01';
  const dow = (d.getUTCDay() + 6) % 7;                                    // 0 = lunes
  const finMesPasado = sumarDias(m1, -1);
  return { hoy: [h, h], ayer: [sumarDias(h, -1), sumarDias(h, -1)], semana: [sumarDias(h, -dow), h], '7': [sumarDias(h, -6), h],
           mes: [m1, h], pasado: [finMesPasado.slice(0, 8) + '01', finMesPasado], '30': [sumarDias(h, -29), h], anio: [h.slice(0, 5) + '01-01', h] }[k];
}
const ATAJOS = [['hoy', 'Hoy'], ['ayer', 'Ayer'], ['semana', 'Esta semana'], ['7', 'Últimos 7 días'], ['mes', 'Este mes'], ['pasado', 'Mes pasado'], ['30', 'Últimos 30 días'], ['anio', 'Este año']];
function atajo(k) { [F.desde, F.hasta] = rangoAtajo(k); F.elegido = true; render(); }
const SECCIONES = [['objetivos', 'Objetivos'], ['dias', 'Día por día'], ['horarios', 'Días y horarios'], ['vendedores', 'Tickets por vendedor'],
  ['categorias', 'Categorías'], ['productos', 'Productos'], ['fundas', 'Fundas y protectores'], ['clases', 'Originales y genéricos'],
  ['medios', 'Medios de pago'], ['caja', 'Caja: ingresos y egresos'], ['clientes', 'Clientes'], ['control', 'Cambios, anulaciones y descuentos']];
const R = { ocultas: leer('rep-ocultas', []), cajaTipo: '', cajaQuien: '', cajaSuc: '', movs: [] };
// Cambio contra el período anterior, corto (para tablas)
const varCorta = (ahora, antes) => { ahora = +ahora; antes = +antes; if (!antes) return '<span class="suave">—</span>';
  const p = (ahora - antes) / Math.abs(antes) * 100;
  return Math.abs(p) < 0.5 ? '<span class="suave">=</span>' : `<span class="${p > 0 ? 'ok' : 'mal'}">${p > 0 ? '▲' : '▼'} ${Math.round(Math.abs(p))} %</span>`; };

const sec = (k, html) => html.replace(/^(\s*<div)/, `$1 data-sec="${k}"${R.ocultas.includes(k) ? ' hidden' : ''}`);
// Barra de un valor (sólo positivos), con el número a la vista en la tabla y en el tooltip
const barra = (v, max, titulo) => `<div class="barra-dato" title="${esc(titulo)}"><i style="width:${max > 0 && v > 0 ? Math.max(2, v / max * 100) : 0}%"></i></div>`;
// Cambio contra el período anterior: flecha + % (nunca sólo color)
function variacion(ahora, antes) {
  ahora = +ahora; antes = +antes;
  if (!antes) return '<span class="var suave">sin datos del período anterior</span>';
  const p = (ahora - antes) / Math.abs(antes) * 100;
  if (Math.abs(p) < 0.5) return '<span class="var suave">= igual que el período anterior</span>';
  return `<span class="var ${p > 0 ? 'ok' : 'mal'}">${p > 0 ? '▲' : '▼'} ${Math.round(Math.abs(p))} % vs período anterior</span>`;
}

        <div class="kpi"><small>Días con ventas</small><b>${conVenta.length}</b> <span class="suave">de ${x.largo}</span></div>
      </div>
      <table class="con-barras"><tr><th>${porMes ? 'Mes' : 'Día'}</th><th class="n">Ventas</th><th class="n">Unid.</th><th class="n">Total</th><th></th></tr>
        ${filas.map(f => `<tr><td style="white-space:nowrap">${f.et}</td><td class="n">${f.ventas}</td><td class="n">${f.unidades}</td><td class="n">${fmt(f.total)}</td>
          <td>${barra(+f.total, max, `${f.et}: ${fmt(f.total)}`)}</td></tr>`).join('')}
      </table>`;
  }
  // Días de la semana y horarios
  let horarios = '';
  if (hayExtra) {
    const maxS = Math.max(0, ...x.semana.map(s => +s.promedio));
    const horas = x.horas.filter(h => +h.ventas > 0), maxH = Math.max(0, ...horas.map(h => +h.ventas));
    horarios = `<div class="grilla" style="margin-bottom:0">
      <div class="tabla-scroll"><h3>Por día de la semana</h3>
        <table class="con-barras"><tr><th>Día</th><th class="n">Ventas</th><th class="n">Total</th><th class="n">Promedio por día</th><th></th></tr>
          ${x.semana.map(s => `<tr><td style="white-space:nowrap">${DIAS_SEM[s.dow]} <span class="suave">(${s.dias})</span></td><td class="n">${s.ventas}</td><td class="n">${fmt(s.total)}</td>
            <td class="n"><b>${fmt(s.promedio)}</b></td><td>${barra(+s.promedio, maxS, `${DIAS_SEM[s.dow]}: ${fmt(s.promedio)} por día`)}</td></tr>`).join('')}
        </table>
        <p class="suave">Entre paréntesis, cuántos de esos días entran en el período.</p></div>
      <div class="tabla-scroll"><h3>Por horario</h3>
        <table class="con-barras"><tr><th>Horario</th><th class="n">Ventas</th><th class="n">Total</th><th></th></tr>
          ${horas.map(h => `<tr><td>${h.hora} a ${h.hora + 1} h</td><td class="n"><b>${h.ventas}</b></td><td class="n">${fmt(h.total)}</td>
            <td>${barra(+h.ventas, maxH, `${h.hora} a ${h.hora + 1} h: ${h.ventas} ventas`)}</td></tr>`).join('') || '<tr><td colspan="4" class="suave">Sin ventas en el período.</td></tr>'}
        </table></div>
    </div>`;
  }
  // Categorías
  let categorias = '';
  if (hayExtra) {
    const maxC = Math.max(0, ...x.categorias.map(c => +c.importe));
    categorias = `<table class="con-barras"><tr><th>Categoría</th><th class="n">Unid.</th><th class="n">Importe</th><th class="n">% del total</th><th></th></tr>
      ${x.categorias.map(c => `<tr><td>${esc(c.categoria)}</td><td class="n">${c.unidades}</td><td class="n">${fmt(c.importe)}</td><td class="n">${pctTotal(+c.importe)}</td>
        <td>${barra(+c.importe, maxC, `${c.categoria}: ${fmt(c.importe)}`)}</td></tr>`).join('') || '<tr><td colspan="5" class="suave">Sin ventas en el período.</td></tr>'}
    </table>`;
  }
  // Clientes
  let clientes = '';
  if (hayExtra) {
    const c = x.clientes, volvieron = +c.distintos - +c.nuevos;
    clientes = `<div class="kpis">
        <div class="kpi"><small>Ventas con cliente</small><b>${c.ventas ? pct(c.con_cliente / c.ventas * 100) : '—'}</b> <span class="suave">· ${c.con_cliente} de ${c.ventas}</span></div>
        <div class="kpi"><small>Clientes distintos</small><b>${c.distintos}</b></div>
        <div class="kpi"><small>Clientes nuevos</small><b>${c.nuevos}</b></div>
        <div class="kpi"><small>Volvieron a comprar</small><b>${volvieron}</b></div>
      </div>
      <h3>Los 10 que más compraron</h3>
      <table><tr><th>#</th><th>Cliente</th><th>Teléfono</th><th class="n">Compras</th><th class="n">Total</th><th>Última</th></tr>
        ${c.top.map((t, i) => `<tr><td>${i + 1}</td><td><a href="#cliente/${t.id}">${esc(t.nombre || 'Sin nombre')}</a></td><td>${esc(telVisible(t.telefono))}</td>
          <td class="n">${t.compras}</td><td class="n"><b>${fmt(t.total)}</b></td><td>${fc(t.ultima)}</td></tr>`).join('') || '<tr><td colspan="6" class="suave">Ninguna venta con teléfono en el período.</td></tr>'}
      </table>
      <p class="suave">"Nuevos": su primera compra es de este período. "Volvieron": ya habían comprado antes. Sólo cuentan las ventas donde se cargó el teléfono.</p>`;
  }
  // Tickets por vendedor (tickets = ventas, sin cambios ni devoluciones)
  let tickets = '';
  if (hayExtra) {
    const dec = n => n.toLocaleString('es-AR', { maximumFractionDigits: 1 });
    tickets = `<p class="suave">Ticket = una venta (los cambios y devoluciones no cuentan). Ticket promedio = lo que se vendió en esos tickets dividido la cantidad.
        La flecha compara con el período anterior (${ddmm(ant.desde)} al ${ddmm(ant.hasta)}).</p>
      <table><tr><th>Vendedor</th>${!sid ? '<th>Local</th>' : ''}<th class="n">Tickets</th><th class="n"></th><th class="n">Días con ventas</th><th class="n">Tickets por día</th>
        <th class="n">Ticket promedio</th><th class="n"></th><th class="n">Mayor ticket</th><th class="n">Unid. por ticket</th><th class="n">Vendido</th><th class="n">% del total</th></tr>
        ${x.tickets.map(t => `<tr><td style="white-space:nowrap">${esc(t.vendedor)}</td>${!sid ? `<td style="white-space:nowrap">${esc(t.sucursal)}</td>` : ''}<td class="n"><b>${t.tickets}</b></td><td class="n">${varCorta(t.tickets, t.tickets_ant)}</td>
          <td class="n">${t.dias}</td><td class="n">${t.dias ? dec(t.tickets / t.dias) : '—'}</td>
          <td class="n"><b>${t.promedio == null ? '—' : fmt(t.promedio)}</b></td><td class="n">${t.promedio_ant == null ? '<span class="suave">—</span>' : varCorta(t.promedio, t.promedio_ant)}</td>
          <td class="n">${t.mayor == null ? '—' : fmt(t.mayor)}</td><td class="n">${+t.tickets ? dec(t.unidades / t.tickets) : '—'}</td>
          <td class="n">${fmt(t.vendido)}</td><td class="n">${pctTotal(+t.vendido)}</td></tr>`).join('') || '<tr><td colspan="12" class="suave">Sin ventas en el período.</td></tr>'}
      </table>`;
  }
  // Caja: ingresos y egresos de efectivo, y cada caja del período
  let caja = '';
  if (hayExtra) {
    const todos = x.caja.movs, cierres = x.caja.cierres;
    const quienes = [...new Set(todos.map(m => m.usuario || '(sin dato)'))].sort();
    const locales = [...new Set(todos.map(m => m.sucursal))].sort();
    if (R.cajaQuien && !quienes.includes(R.cajaQuien)) R.cajaQuien = '';
    if (R.cajaSuc && !locales.includes(R.cajaSuc)) R.cajaSuc = '';
    const movs = R.movs = todos.filter(m => (!R.cajaTipo || m.tipo === R.cajaTipo) && (!R.cajaQuien || (m.usuario || '(sin dato)') === R.cajaQuien) && (!R.cajaSuc || m.sucursal === R.cajaSuc));
    const sumar = (l, t) => l.filter(m => m.tipo === t).reduce((a, m) => a + +m.monto, 0);
    const ing = sumar(movs, 'ingreso'), egr = sumar(movs, 'egreso');
    const cerradas = cierres.filter(c => c.estado === 'cerrada'), conDif = cerradas.filter(c => Math.abs(+c.diferencia) >= 1);
    const agrupar = clave => { const g = {}; movs.forEach(m => { const k = clave(m); const o = g[k] = g[k] || { k, ni: 0, i: 0, ne: 0, e: 0 };
      if (m.tipo === 'ingreso') { o.ni++; o.i += +m.monto; } else { o.ne++; o.e += +m.monto; } }); return Object.values(g).sort((a, b) => (b.i + b.e) - (a.i + a.e)); };
    const tablaGrupo = (titulo, filas) => `<table><tr><th>${titulo}</th><th class="n">Ingresos</th><th class="n">$ ingresado</th><th class="n">Egresos</th><th class="n">$ egresado</th><th class="n">Neto</th></tr>
      ${filas.map(o => `<tr><td>${esc(o.k)}</td><td class="n">${o.ni}</td><td class="n ok">${fmt(o.i)}</td><td class="n">${o.ne}</td><td class="n mal">${fmt(-o.e)}</td><td class="n"><b>${fmt(o.i - o.e)}</b></td></tr>`).join('')
        || '<tr><td colspan="6" class="suave">Ningún movimiento.</td></tr>'}</table>`;
    const opcion = (v, t, actual) => `<option value="${esc(v)}" ${actual === v ? 'selected' : ''}>${esc(t)}</option>`;
    caja = `<p class="suave">Lo que se agrega (ingresos) o se saca (egresos) de la caja a mano, aparte de las ventas: retiros, gastos, cambio, etc. "Quién" sale del historial.</p>
      <div class="fila no-imprimir" style="margin-bottom:14px">
        <label>Tipo<select onchange="filtroCaja('cajaTipo',this.value)">${opcion('', 'Ingresos y egresos', R.cajaTipo)}${opcion('ingreso', 'Sólo ingresos', R.cajaTipo)}${opcion('egreso', 'Sólo egresos', R.cajaTipo)}</select></label>
        <label>Quién<select onchange="filtroCaja('cajaQuien',this.value)">${opcion('', 'Todos', R.cajaQuien)}${quienes.map(q => opcion(q, q, R.cajaQuien)).join('')}</select></label>
        ${!sid ? `<label>Local<select onchange="filtroCaja('cajaSuc',this.value)">${opcion('', 'Todos', R.cajaSuc)}${locales.map(q => opcion(q, q, R.cajaSuc)).join('')}</select></label>` : ''}
        <button type="button" class="sec" onclick="descargarMovs()">Descargar movimientos (CSV)</button>
      </div>
      <div class="kpis">
        <div class="kpi"><small>Ingresado</small><b class="ok">${fmt(ing)}</b> <span class="suave">· ${movs.filter(m => m.tipo === 'ingreso').length}</span></div>
        <div class="kpi"><small>Egresado</small><b class="mal">${fmt(-egr)}</b> <span class="suave">· ${movs.filter(m => m.tipo === 'egreso').length}</span></div>
        <div class="kpi"><small>Neto</small><b>${fmt(ing - egr)}</b></div>
        <div class="kpi"><small>Cierres con diferencia</small><b class="${conDif.length ? 'alerta' : ''}">${conDif.length}</b> <span class="suave">de ${cerradas.length} · ${fmt(conDif.reduce((a, c) => a + +c.diferencia, 0))}</span></div>
      </div>
      ${!sid && !R.cajaSuc ? `<h3>Por local</h3>${tablaGrupo('Local', agrupar(m => m.sucursal))}` : ''}
      <h3 style="margin-top:18px">Por persona</h3>${tablaGrupo('Quién', agrupar(m => m.usuario || '(sin dato)'))}
      <h3 style="margin-top:18px">Detalle <span class="suave">· ${movs.length}${todos.length === 3000 ? ' (los últimos 3000: achicá las fechas)' : ''}</span></h3>
      <table><tr><th>Fecha</th>${!sid ? '<th>Local</th>' : ''}<th>Tipo</th><th>Concepto</th><th>Quién</th><th class="n">Monto</th></tr>
        ${movs.map(m => `<tr><td style="white-space:nowrap">${fc(m.fecha)}</td>${!sid ? `<td>${esc(m.sucursal)}</td>` : ''}
          <td><span class="etiqueta ${m.tipo === 'ingreso' ? 'azul' : 'rosa'}">${m.tipo === 'ingreso' ? 'Ingreso' : 'Egreso'}</span></td>
          <td>${esc(m.concepto)}</td><td>${esc(m.usuario || '—')}</td><td class="n ${m.tipo === 'ingreso' ? 'ok' : 'mal'}">${fmt(m.tipo === 'egreso' ? -m.monto : m.monto)}</td></tr>`).join('')
          || `<tr><td colspan="6" class="suave">Ningún ingreso ni egreso${R.cajaTipo || R.cajaQuien || R.cajaSuc ? ' con ese filtro' : ' en el período'}.</td></tr>`}
      </table>
      <h3 style="margin-top:22px">Cajas del período <span class="suave">· ${cierres.length}</span></h3>
      <table><tr><th>Fecha</th>${!sid ? '<th>Local</th>' : ''}<th>Abrió</th><th>Cerró</th><th class="n">Apertura</th><th class="n">+ Efectivo ventas</th><th class="n">+ Ingresos</th><th class="n">− Egresos</th>
          <th class="n">Esperado</th><th class="n">Contado</th><th class="n">Diferencia</th><th>Obs.</th></tr>
        ${cierres.map(c => `<tr><td style="white-space:nowrap">${ddmm(c.fecha)}</td>${!sid ? `<td>${esc(c.sucursal)}</td>` : ''}
          <td>${esc(c.abierta_por || '—')} <span class="suave">${(c.abierta_en || '').slice(11, 16)}</span></td>
          <td>${c.estado === 'abierta' ? '<span class="etiqueta azul">Abierta</span>' : `${esc(c.cerrada_por || '—')} <span class="suave">${(c.cerrada_en || '').slice(11, 16)}</span>`}</td>
          <td class="n">${fmt(c.apertura)}</td><td class="n">${fmt(c.efectivo)}</td><td class="n">${fmt(c.ingresos)}</td><td class="n">${fmt(-c.egresos)}</td>
          <td class="n">${fmt(c.esperado)}</td><td class="n">${c.contado == null ? '—' : fmt(c.contado)}</td>
          <td class="n ${c.diferencia == null ? '' : Math.abs(c.diferencia) < 1 ? 'ok' : 'mal'}">${c.diferencia == null ? '—' : fmt(c.diferencia)}</td><td>${esc(c.observaciones || '')}</td></tr>`).join('')
          || '<tr><td colspan="12" class="suave">No hubo cajas en el período.</td></tr>'}
      </table>`;
  }
  // Cambios, anulaciones y descuentos
  let control = '';
  if (hayExtra) {
    control = `<div>
      <div class="tabla-scroll"><h3>Cambios y devoluciones</h3>
        <table><tr><th>Local</th><th class="n">Cambios</th><th class="n">Devoluciones</th><th class="n">Unid. devueltas</th><th class="n">Neto</th></tr>
          ${x.cambios.map(c => `<tr><td>${esc(c.sucursal)}</td><td class="n">${c.cambios}</td><td class="n">${c.devoluciones}</td><td class="n">${c.unidades}</td><td class="n">${fmt(c.neto)}</td></tr>`).join('')
            || '<tr><td colspan="5" class="suave">Ninguno en el período.</td></tr>'}
        </table>
        <p class="suave">"Neto" es la plata que se movió: negativo = se le devolvió al cliente.</p></div>
      <div class="tabla-scroll" style="margin-top:18px"><h3>Ventas anuladas <span class="suave">· ${anuladas}</span></h3>
        <table><tr><th>Vendedor</th>${!sid ? '<th>Local</th>' : ''}<th class="n">Anuladas</th><th class="n">Importe</th></tr>
          ${x.anuladas.map(a => `<tr><td>${esc(a.vendedor)}</td>${!sid ? `<td>${esc(a.sucursal)}</td>` : ''}<td class="n"><b>${a.cantidad}</b></td><td class="n">${fmt(a.total)}</td></tr>`).join('')
            || '<tr><td colspan="4" class="suave">Ninguna en el período.</td></tr>'}
        </table>
        <p class="suave">El detalle de cada una (quién la anuló y cuándo) está en Historial.</p></div>
      <div class="tabla-scroll" style="margin-top:18px"><h3>Descuento por pago en efectivo</h3>
        <table><tr><td>Ventas con descuento</td><td class="n">${x.descuentos.ventas}</td></tr>
          <tr><td>Total descontado</td><td class="n"><b>${fmt(x.descuentos.total)}</b></td></tr>
          <tr><td>Sobre lo vendido</td><td class="n">${pctTotal(+x.descuentos.total)}</td></tr></table></div>
    </div>`;
  }

  return `<h1>Reportes <a class="boton no-imprimir" href="#ia" style="margin-left:auto;font-size:14px">✦ Consultar con IA</a></h1>
  <div class="panel no-imprimir">
    <div class="cats">${ATAJOS.map(([k, t]) => { const [a, b] = rangoAtajo(k); return `<button type="button" class="${F.desde === a && F.hasta === b ? 'activa' : ''}" onclick="atajo('${k}')">${t}</button>`; }).join('')}</div>
  </div>
  ${filtroPeriodo(true, `<button type="button" class="sec" onclick="print()">Imprimir</button> <button type="button" class="sec" onclick="exportarVentas(F.desde,F.hasta,sucFiltro())">Descargar detalle (CSV)</button>`)}
  <div class="panel no-imprimir"><p class="suave" style="margin:0 0 8px">Qué mostrar (tocá para ocultar o mostrar; se recuerda en esta compu) ·
      <a href="javascript:verTodas(true)">todo</a> · <a href="javascript:verTodas(false)">nada</a></p>
    <div class="cats">${SECCIONES.map(([k, t]) => `<button type="button" data-chip="${k}" class="${R.ocultas.includes(k) ? '' : 'activa'}" onclick="verSeccion('${k}')">${t}</button>`).join('')}</div>
  </div>
  <p class="suave">Del ${ddmm(F.desde)}/${F.desde.slice(0, 4)} al ${ddmm(F.hasta)}/${F.hasta.slice(0, 4)} · ${sid ? esc(sucNombre(sid)) : 'todas las sucursales'}${ant ? ` · se compara con el ${ddmm(ant.desde)} al ${ddmm(ant.hasta)}` : ''}</p>
  ${hayExtra ? '' : falta}
  <div class="kpis">
    <div class="kpi"><small>Total vendido</small><b>${fmt(r.res.total)}</b>${ant ? variacion(r.res.total, ant.total) : ''}</div>
    <div class="kpi"><small>Ventas (tickets)</small><b>${r.res.ventas}</b>${ant ? variacion(r.res.ventas, ant.ventas) : ''}</div>
    <div class="kpi"><small>Unidades</small><b>${r.res.unidades}</b>${ant ? variacion(r.res.unidades, ant.unidades) : ''}</div>
    <div class="kpi"><small>Ticket promedio</small><b>${fmt(r.res.ticket)}</b>${ant ? variacion(r.res.ticket, ant.ticket) : ''}</div>
  </div>
  <div class="kpis">
    <div class="kpi"><small>% originales (unid.)</small><b>${pctOriginales(total)}</b></div>
    ${hayExtra ? `<div class="kpi"><small>Promedio por día</small><b>${fmt(totalPeriodo / x.largo)}</b></div>
    <div class="kpi"><small>Descuento en efectivo</small><b>${fmt(x.descuentos.total)}</b></div>
    <div class="kpi"><small>Ventas anuladas</small><b class="${anuladas ? 'alerta' : ''}">${anuladas}</b></div>` : ''}
  </div>
  ${sec('objetivos', `<div class="panel"><h2>Objetivos de ${mes}</h2>${tablaObjetivos(r.avance, false)}</div>`)}
  ${sec('dias', `<div class="panel tabla-scroll"><h2>Día por día</h2>${hayExtra ? dias : falta}</div>`)}
  ${sec('horarios', `<div class="panel tabla-scroll"><h2>Días y horarios</h2><p class="suave">Para ver qué días y en qué horas se vende más (por ejemplo, para armar los turnos).</p>${hayExtra ? horarios : falta}</div>`)}
  ${sec('vendedores', `<div class="panel tabla-scroll"><h2>Tickets por vendedor</h2>
    ${hayExtra ? tickets : `<table><tr><th>Vendedor</th>${!sid ? '<th>Sucursal</th>' : ''}<th class="n">Tickets</th><th class="n">Unid.</th><th class="n">Total</th><th class="n">Ticket prom.</th><th class="n">% del total</th></tr>
      ${r.vendedores.map(v => `<tr><td>${esc(v.vendedor)}</td>${!sid ? `<td>${esc(v.sucursal)}</td>` : ''}<td class="n">${v.ventas}</td><td class="n">${v.unidades}</td><td class="n">${fmt(v.total)}</td>
        <td class="n">${ticket(+v.total, +v.ventas)}</td><td class="n">${pctTotal(+v.total)}</td></tr>`).join('') || '<tr><td class="suave">Sin datos.</td></tr>'}
    </table>`}
    <div class="tabla-scroll" style="margin-top:18px">${r.sucursales.length ? `<h3>Tickets por local</h3><table><tr><th>Local</th><th class="n">Tickets</th><th class="n">Total</th><th class="n">Ticket prom.</th><th class="n">% del total</th></tr>
        ${r.sucursales.map(s => `<tr><td>${esc(s.sucursal)}</td><td class="n">${s.ventas}</td><td class="n">${fmt(s.total)}</td><td class="n">${ticket(+s.total, +s.ventas)}</td><td class="n">${pctTotal(+s.total)}</td></tr>`).join('')}</table>`
      : '<h3>Tickets por local</h3><p class="suave">Elegí "Todas las sucursales" para comparar los locales.</p>'}</div>
    <h3 style="margin-top:18px">Proyección de ${MESES[r.mes.mes]} por vendedor</h3>
    <p class="suave">Lo vendido en el mes (${r.mes.pasados} de ${r.mes.dias} días) y a cuánto llegaría cada uno al ritmo actual.${sid ? '' : ' "% del local" es su parte en la proyección de su local.'}</p>
    <table><tr><th>Vendedor</th>${!sid ? '<th>Local</th>' : ''}<th class="n">Vendido en el mes</th><th class="n">Proyección a fin de mes</th><th class="n">% del local</th></tr>
      ${r.proy_vendedores.map(v => `<tr><td>${esc(v.vendedor)}</td>${!sid ? `<td>${esc(v.sucursal)}</td>` : ''}<td class="n">${fmt(v.vendido)}</td><td class="n"><b>${fmt(v.proyeccion)}</b></td><td class="n">${pct(v.pct_local)}</td></tr>`).join('')
        || '<tr><td colspan="5" class="suave">Sin ventas en el mes.</td></tr>'}
    </table></div>`)}
  ${sec('categorias', `<div class="panel tabla-scroll"><h2>Categorías</h2>${hayExtra ? categorias : falta}</div>`)}
  ${sec('productos', `<div class="panel tabla-scroll"><h2>Top 10 productos (unidades)</h2>
    <table><tr><th>#</th><th>Producto</th><th class="n">Unidades</th><th class="n">Importe</th><th>Vendedores (unidades)</th></tr>
      ${r.top.map((t, i) => `<tr><td>${i + 1}</td><td>${esc(t.descripcion)}</td><td class="n"><b>${t.unidades}</b></td><td class="n">${fmt(t.importe)}</td>
        <td>${t.vendedores.map(v => `${esc(v.vendedor)}: ${v.unidades}`).join(' · ')}</td></tr>`).join('') || '<tr><td colspan="5" class="suave">Sin datos.</td></tr>'}
    </table>

// ---------------------------------------------------------------- consultar con IA (015 + función techpoint-ia)
// La pregunta va a la función del servidor con la sesión del usuario; Claude consulta las funciones de solo lectura
// de la base y ve lo mismo que la persona en Reportes. La charla vive mientras la página está abierta (no se repinta sola).
const IA = { charla: [], cargando: false, info: null };
const IA_EJEMPLOS = ['¿Cuánto vendimos hoy y cómo venimos contra ayer?', '¿Qué modelos de celular piden más fundas este mes?',
  '¿Qué local va mejor contra su objetivo del mes?', '¿En qué horarios se vende más esta semana?',
  '¿Qué productos activos no se vendieron en los últimos 30 días?', '¿Quién vendió más este mes y con qué ticket promedio?'];
const iaSuc = () => global() ? ST.suc : sucActual();
// Texto de la IA → HTML seguro: **negrita**, listas con "- " y saltos de línea
function iaTexto(t) {
  const lineas = esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split('\n');
  let html = '', lista = false;
  for (const l of lineas) {
    const item = /^\s*[-•]\s+(.*)/.exec(l);
    if (item && !lista) { html += '<ul>'; lista = true; }
    if (!item && lista) { html += '</ul>'; lista = false; }
    html += item ? `<li>${item[1]}</li>` : (l.trim() ? `<p>${l}</p>` : '');
  }
  return html + (lista ? '</ul>' : '');
}
const iaValor = (v, f) => f === 'pesos' ? fmt(v) : f === 'porcentaje' ? pct(v) : Math.round(+v || 0).toLocaleString('es-AR');
// Barras (1 o 2 series) o línea, en SVG, con los colores de la marca
function iaGrafico(g) {
  const et = g.etiquetas || [], series = (g.series || []).slice(0, 2).filter(s => s.valores && s.valores.length);
  if (!et.length || !series.length) return '';
  const W = 640, H = 220, izq = 8, abajo = 30, arriba = 18, alto = H - abajo - arriba;
  const max = Math.max(1, ...series.flatMap(s => s.valores.map(v => +v || 0)));
  const ancho = (W - izq * 2) / et.length, y = v => arriba + alto - Math.max(0, +v || 0) / max * alto;
  const colores = ['var(--rosa)', 'var(--azul-claro)'];
  const cada = Math.ceil(et.length / 12);
  let marcas = '';
  if (g.tipo === 'linea') {
    series.forEach((s, k) => {
      const pts = s.valores.map((v, i) => `${(izq + ancho * (i + .5)).toFixed(1)},${y(v).toFixed(1)}`);
      marcas += `<polyline points="${pts.join(' ')}" fill="none" stroke="${colores[k]}" stroke-width="2.5" stroke-linejoin="round"/>` +
        s.valores.map((v, i) => `<circle cx="${(izq + ancho * (i + .5)).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" fill="${colores[k]}"><title>${esc(et[i])} · ${esc(s.nombre)}: ${iaValor(v, g.formato)}</title></circle>`).join('');
    });
  } else {
    const b = Math.min(42, ancho * .7 / series.length);
    series.forEach((s, k) => s.valores.forEach((v, i) => {
      const x = izq + ancho * (i + .5) - b * series.length / 2 + b * k;
      marcas += `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${Math.max(1, b - 2).toFixed(1)}" height="${(arriba + alto - y(v)).toFixed(1)}" fill="${colores[k]}" rx="2"><title>${esc(et[i])} · ${esc(s.nombre)}: ${iaValor(v, g.formato)}</title></rect>`;
    }));
  }
  const textos = et.map((e, i) => i % cada ? '' : `<text x="${(izq + ancho * (i + .5)).toFixed(1)}" y="${H - 10}" text-anchor="middle">${esc(String(e).slice(0, 12))}</text>`).join('');
  return `<figure class="ia-grafico"><figcaption>${esc(g.titulo)}${series.length > 1 ? series.map((s, k) => ` <span class="ia-serie" style="--c:${colores[k]}">${esc(s.nombre)}</span>`).join('') : ''}</figcaption>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(g.titulo)}">
      <text x="${izq}" y="12" class="ia-max">máx. ${iaValor(max, g.formato)}</text>
      <line x1="${izq}" x2="${W - izq}" y1="${arriba + alto}" y2="${arriba + alto}" stroke="var(--borde-2)"/>${marcas}${textos}</svg></figure>`;
}
function iaRespuesta(x, i) {
  if (x.error) return `<div class="aviso error" style="margin:0">${esc(x.error)}</div>`;
  const r = x.respuesta;
  const t = r.tabla && r.tabla.columnas && r.tabla.columnas.length ? r.tabla : null;
  return `<div class="ia-texto">${iaTexto(r.texto || '')}</div>
    ${(r.kpis || []).length ? `<div class="kpis">${r.kpis.slice(0, 4).map(k => `<div class="kpi"><small>${esc(k.etiqueta)}</small><b>${esc(k.valor)}</b>${k.detalle ? `<span class="var suave">${esc(k.detalle)}</span>` : ''}</div>`).join('')}</div>` : ''}
    ${r.grafico ? iaGrafico(r.grafico) : ''}
    ${t ? `<div class="tabla-scroll">${t.titulo ? `<h3>${esc(t.titulo)}</h3>` : ''}<table><tr>${t.columnas.map(c => `<th>${esc(c)}</th>`).join('')}</tr>
      ${(t.filas || []).map(f => `<tr>${f.map(c => `<td class="${/^[-$\s\d.,%]+$/.test(String(c).trim()) ? 'n' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>` : ''}
    <div class="ia-acciones no-imprimir">
      ${(r.sugerencias || []).slice(0, 3).map(s => `<button type="button" class="sec" onclick="iaPreguntar(${esc(JSON.stringify(s))})">${esc(s)}</button>`).join('')}
      <span class="ia-sep"></span>
      <a href="#" onclick="iaCopiar(${i}, this); return false">Copiar</a>${t ? ` · <a href="#" onclick="iaCsv(${i}); return false">Descargar tabla (CSV)</a>` : ''}
    </div>`;
}
function iaPintar() {
  const c = $('ia-charla'); if (!c) return;
  c.innerHTML = IA.charla.map((x, i) => `<div class="ia-turno">
      <div class="ia-pregunta"><span>${esc(x.pregunta)}</span></div>
      <div class="panel ia-resp">${x.cargando ? '<p class="suave ia-pensando">Consultando los datos… puede tardar hasta un minuto.</p>' : iaRespuesta(x, i)}</div>
    </div>`).join('') || `<div class="panel no-imprimir"><p class="suave" style="margin-top:0">Preguntá en castellano, como se lo preguntarías a una persona. Por ejemplo:</p>
      <div class="cats">${IA_EJEMPLOS.map(e => `<button type="button" onclick="iaPreguntar(${esc(JSON.stringify(e))})">${esc(e)}</button>`).join('')}</div></div>`;
  const b = $('ia-enviar'); if (b) b.disabled = IA.cargando;
  const n = $('ia-uso'); if (n && IA.info) n.textContent = iaUso();
}
const iaUso = () => `${IA.info.usadas_hoy} de ${IA.info.limite} preguntas hoy` +
  (IA.info.mes_usd != null ? ` · gasto del mes: US$ ${(+IA.info.mes_usd).toFixed(2)} de ${(+IA.info.tope_usd).toFixed(0)}` : '');
async function iaPreguntar(texto) {
  const campo = $('ia-pregunta');
  const pregunta = String(texto ?? (campo ? campo.value : '')).trim();
  if (!pregunta || IA.cargando) return;
  if (campo) campo.value = '';
  const historial = IA.charla.filter(x => x.respuesta).slice(-4).map(x => ({ pregunta: x.pregunta, respuesta: x.respuesta.texto || '' }));
  const turno = { pregunta, cargando: true };
  IA.charla.push(turno); IA.cargando = true; iaPintar();
  $('ia-charla').lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'start' });
  try {
    const { data, error } = await sb.functions.invoke('techpoint-ia', { body: { usuario: ST.uid, pregunta, sucursal_id: iaSuc(), historial } });
    if (error) throw new Error(navigator.onLine ? 'La consulta a la IA no está disponible todavía. Avisale al administrador.' : 'Sin conexión: revisá internet e intentá de nuevo.');
    if (!data.ok) {
      const m = String(data.error || 'No se pudo consultar.').trim();
      if (m.startsWith('SESION:')) { ST.ini = { ...ST.ini, yo: null }; ST.uid = null; IA.cargando = false; IA.charla = []; return render(); }
      throw new Error(m);
    }
    turno.respuesta = data.respuesta;
    if (IA.info) IA.info.usadas_hoy = data.usadas_hoy;
  } catch (e) { turno.error = e.message; }
  turno.cargando = false; IA.cargando = false;
  iaPintar();
}
function iaCopiar(i, a) {
  const r = IA.charla[i] && IA.charla[i].respuesta; if (!r) return;
  const t = r.tabla ? '\n\n' + [r.tabla.columnas, ...r.tabla.filas].map(f => f.join('\t')).join('\n') : '';
  const k = (r.kpis || []).map(k => `${k.etiqueta}: ${k.valor}`).join('\n');
  navigator.clipboard.writeText(`${IA.charla[i].pregunta}\n\n${r.texto}${k ? '\n\n' + k : ''}${t}`)
    .then(() => { a.textContent = 'Copiado ✓'; setTimeout(() => { a.textContent = 'Copiar'; }, 2000); }, () => alert('No se pudo copiar.'));
}
function iaCsv(i) {
  const t = IA.charla[i] && IA.charla[i].respuesta && IA.charla[i].respuesta.tabla; if (!t) return;

  </div>
  ${d.sin_clase ? `<div class="aviso">Hay <b>${d.sin_clase}</b> productos sin definir como original o genérico. <a href="#productos" onclick="P.clase='sin'">Clasificarlos</a></div>` : ''}
  <div class="grilla">
    <div class="panel">
      <h2>Objetivos mensuales</h2>
      <form class="fila" style="margin-bottom:10px" onsubmit="event.preventDefault();C.mes=+this.mes.value;C.anio=+this.anio.value;render()">
        <label>Mes<select name="mes">${MESES.slice(1).map((m, i) => `<option value="${i + 1}" ${i + 1 === C.mes ? 'selected' : ''}>${m}</option>`).join('')}</select></label>
        <label>Año<input type="number" name="anio" value="${C.anio}" style="width:90px"></label>
        <button class="sec">Cambiar</button>
      </form>
      <form id="form-objetivos" onsubmit="event.preventDefault();guardarConfig('objetivo',{anio:C.anio,mes:C.mes,montos:[...this.querySelectorAll('input[data-suc]')].map(i=>({sucursal_id:+i.dataset.suc,monto:i.value.trim()?numero(i.value):''}))})">
        <table>${d.objetivos.map(o => `<tr><td>${esc(o.nombre)}</td><td class="n"><input data-suc="${o.id}" value="${o.monto ? Math.round(o.monto) : ''}" placeholder="$" style="width:150px"></td></tr>`).join('')}</table>
        <p><button>Guardar objetivos de ${MESES[C.mes]}</button></p>
      </form>
    </div>
    <div class="panel">
      <h2>Respaldo por mail al cerrar la caja</h2>
      <p class="suave">Cada cierre de caja manda un mail con el resumen y el detalle en Excel. Se hace con un script de Google en tu cuenta de Gmail:
        las instrucciones están en la carpeta <code>respaldo/</code> del proyecto. Pegá acá el link que te da Google y la misma clave que pusiste en el script.</p>
      <form onsubmit="event.preventDefault();guardarConfig('respaldo',{url:this.url.value,clave:this.clave.value})">
        <label class="suave" style="display:flex;flex-direction:column;gap:4px">Link del script (termina en /exec)<input name="url" value="${esc(d.respaldo_url)}" placeholder="https://script.google.com/macros/s/…/exec"></label>
        <label class="suave" style="display:flex;flex-direction:column;gap:4px;margin-top:8px">Clave<input name="clave" value="${esc(d.respaldo_clave)}" autocomplete="off"></label>
        <p><button>Guardar</button> ${d.respaldo_url ? '<span class="ok">Activo</span>' : '<span class="alerta">Sin configurar</span>'}</p>
      </form>
    </div>
    <div class="panel">
      <h2>Descuento por pago en efectivo</h2>
      <p class="suave">Se aplica solo cuando la venta se paga <b>toda</b> en efectivo (no en pagos divididos), y no sobre la diferencia por devolución. 0 = sin descuento.</p>
      <form class="fila" onsubmit="event.preventDefault();guardarConfig('descuento',{descuento:numero(this.descuento.value)})">
        <label>Descuento (%)<input type="number" name="descuento" min="0" max="50" step="0.5" value="${+ST.ini.descuento}" style="width:100px"></label>
        <button>Guardar</button>
      </form>
    </div>
    <div class="panel">
      <h2>Sucursales</h2>
      <form onsubmit="event.preventDefault();guardarConfig('sucursal',{sucursales:[...this.querySelectorAll('input[data-suc]')].map(i=>({id:+i.dataset.suc,nombre:i.value})),nueva:this.nueva.value})">
        <table>${ST.ini.sucursales.map(s => `<tr><td><input data-suc="${s.id}" value="${esc(s.nombre)}"></td></tr>`).join('')}
          <tr><td><input name="nueva" placeholder="Nueva sucursal"></td></tr></table>
        <p><button>Guardar</button></p>
      </form>
    </div>
    ${res ? `<div class="panel">
      <h2>Borrar datos de prueba</h2>
      <p class="suave">Elegí qué borrar. <b>Nunca se borran</b> los productos activos (${res.productos_activos}), los locales, los usuarios ni la configuración. No se puede deshacer.</p>
      <form onsubmit="event.preventDefault();borrarDatos(this)">
        <div class="locales" style="flex-direction:column;align-items:flex-start">
          <label><input type="checkbox" name="borrar" value="ventas" checked> Ventas, cambios y devoluciones (${res.ventas}${res.primera ? `, del ${fd(res.primera)} al ${fd(res.ultima)}` : ''})</label>
          <label><input type="checkbox" name="borrar" value="cajas" checked> Cajas con sus ingresos y egresos (${res.cajas})</label>
          <label><input type="checkbox" name="borrar" value="clientes" checked> Clientes (${res.clientes})</label>
          <label><input type="checkbox" name="borrar" value="objetivos"> Objetivos de venta (${res.objetivos})</label>
          <label><input type="checkbox" name="borrar" value="productos_baja"> Productos dados de baja: los viejos que ya no están en la lista (${res.productos_baja})</label>
        </div>
        <label style="margin-top:10px">Hasta el día (inclusive; vacío = todo)<input type="date" name="hasta" style="width:180px"></label>
        <p class="suave" style="margin:6px 0 0">Las cajas y los clientes se borran sólo si no les quedan ventas.</p>
        <p><button class="peligro">Borrar lo elegido</button></p>
      </form>
    </div>` : ''}
  </div>`;
}
const fd = d => d.split('-').reverse().join('/');
// Borrar datos de prueba (009): pide escribir BORRAR para confirmar
async function borrarDatos(f) {
  const que = [...f.querySelectorAll('[name=borrar]:checked')].map(c => c.value);
  if (!que.length) return alert('Marcá qué querés borrar.');
  const nombres = [...f.querySelectorAll('[name=borrar]:checked')].map(c => '• ' + c.parentElement.textContent.trim()).join('\n');
  const hasta = f.hasta.value;
  if ((prompt(`Vas a borrar${hasta ? ` (hasta el ${fd(hasta)})` : ''}:\n${nombres}\n\nNo se puede deshacer. Para seguir escribí BORRAR`) || '').trim().toUpperCase() !== 'BORRAR') return;
  try {
    const r = await rpc('tp_borrar_datos', { ...U(), p_que: { borrar: que, hasta: hasta || null } });
    avisar(`Borrado: ${r.ventas} ventas, ${r.cajas} cajas, ${r.clientes} clientes, ${r.objetivos} objetivos, ${r.productos} productos dados de baja.`);
    await cargarInicial();
  } catch (e) { avisar(e.message, true); }
  render();
}
const datosUsuario = (f, id) => ({ id, nombre: f.nombre.value, usuario: f.usuario.value, clave: f.clave ? f.clave.value : null,
                                   rol: f.rol.value, sucursal_id: f.suc.value,
                                   locales: [...f.querySelectorAll('[data-local]:checked')].map(c => +c.dataset.local) });
// Al dueño y a los superadministradores sólo los maneja un superadministrador
const puedeManejar = x => usuario().rol === 'superadmin' || !['dueno', 'superadmin'].includes(x.rol) || x.id === ST.uid;
async function guardarConfig(accion, datos) {
  try {
    await rpc('tp_config_guardar', { ...U(), p_accion: accion, p_datos: datos });
    C.editar = null; await cargarInicial(); avisar('Guardado.');
  } catch (e) { avisar(e.message, true); }
  render();
}

iniciar();
</script>
</body>
</html>
