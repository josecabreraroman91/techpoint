        <th class="n">Ticket promedio</th><th class="n"></th><th class="n">Mayor ticket</th><th class="n">Unid. por ticket</th><th class="n">Vendido</th><th class="n">% del total</th></tr>
        ${x.tickets.map(t => `<tr><td style="white-space:nowrap">${esc(t.vendedor)}</td>${!sid ? `<td style="white-space:nowrap">${esc(t.sucursal)}</td>` : ''}<td class="n"><b>${t.tickets}</b></td><td class="n">${varCorta(t.tickets, t.tickets_ant)}</td>
          <td class="n">${t.dias}</td><td class="n">${t.dias ? dec(t.tickets / t.dias) : '—'}</td>
          <td class="n"><b>${t.promedio == null ? '—' : fmt(t.promedio)}</b></td><td class="n">${t.promedio_ant == null ? '<span class="suave">—</span>' : varCorta(t.promedio, t.promedio_ant)}</td>
          <td class="n">${t.mayor == null ? '—' : fmt(t.mayor)}</td><td class="n">${+t.tickets ? dec(t.unidades / t.tickets) : '—'}</td>
          <td class="n">${fmt(t.vendido)}</td><td class="n">${pctTotal(+t.vendido)}</td></tr>`).join('') || '<tr><td colspan="12" class="suave">Sin ventas en el período.</td></tr>'}
      </table>`;
  }
  // Caja: ingresos y egresos de efectivo, y cada caja del período
  let caja = '';
  if (hayExtra) {
    const todos = x.caja.movs, cierres = x.caja.cierres;
    const quienes = [...new Set(todos.map(m => m.usuario || '(sin dato)'))].sort();
    const locales = [...new Set(todos.map(m => m.sucursal))].sort();
    if (R.cajaQuien && !quienes.includes(R.cajaQuien)) R.cajaQuien = '';
    if (R.cajaSuc && !locales.includes(R.cajaSuc)) R.cajaSuc = '';
    const movs = R.movs = todos.filter(m => (!R.cajaTipo || m.tipo === R.cajaTipo) && (!R.cajaQuien || (m.usuario || '(sin dato)') === R.cajaQuien) && (!R.cajaSuc || m.sucursal === R.cajaSuc));
    const sumar = (l, t) => l.filter(m => m.tipo === t).reduce((a, m) => a + +m.monto, 0);
    const ing = sumar(movs, 'ingreso'), egr = sumar(movs, 'egreso');
    const cerradas = cierres.filter(c => c.estado === 'cerrada'), conDif = cerradas.filter(c => Math.abs(+c.diferencia) >= 1);
    const agrupar = clave => { const g = {}; movs.forEach(m => { const k = clave(m); const o = g[k] = g[k] || { k, ni: 0, i: 0, ne: 0, e: 0 };
      if (m.tipo === 'ingreso') { o.ni++; o.i += +m.monto; } else { o.ne++; o.e += +m.monto; } }); return Object.values(g).sort((a, b) => (b.i + b.e) - (a.i + a.e)); };
    const tablaGrupo = (titulo, filas) => `<table><tr><th>${titulo}</th><th class="n">Ingresos</th><th class="n">$ ingresado</th><th class="n">Egresos</th><th class="n">$ egresado</th><th class="n">Neto</th></tr>
      ${filas.map(o => `<tr><td>${esc(o.k)}</td><td class="n">${o.ni}</td><td class="n ok">${fmt(o.i)}</td><td class="n">${o.ne}</td><td class="n mal">${fmt(-o.e)}</td><td class="n"><b>${fmt(o.i - o.e)}</b></td></tr>`).join('')
        || '<tr><td colspan="6" class="suave">Ningún movimiento.</td></tr>'}</table>`;
    const opcion = (v, t, actual) => `<option value="${esc(v)}" ${actual === v ? 'selected' : ''}>${esc(t)}</option>`;
    caja = `<p class="suave">Lo que se agrega (ingresos) o se saca (egresos) de la caja a mano, aparte de las ventas: retiros, gastos, cambio, etc. "Quién" sale del historial.</p>
      <div class="fila no-imprimir" style="margin-bottom:14px">
        <label>Tipo<select onchange="filtroCaja('cajaTipo',this.value)">${opcion('', 'Ingresos y egresos', R.cajaTipo)}${opcion('ingreso', 'Sólo ingresos', R.cajaTipo)}${opcion('egreso', 'Sólo egresos', R.cajaTipo)}</select></label>
        <label>Quién<select onchange="filtroCaja('cajaQuien',this.value)">${opcion('', 'Todos', R.cajaQuien)}${quienes.map(q => opcion(q, q, R.cajaQuien)).join('')}</select></label>
        ${!sid ? `<label>Local<select onchange="filtroCaja('cajaSuc',this.value)">${opcion('', 'Todos', R.cajaSuc)}${locales.map(q => opcion(q, q, R.cajaSuc)).join('')}</select></label>` : ''}
        <button type="button" class="sec" onclick="descargarMovs()">Descargar movimientos (CSV)</button>
      </div>
      <div class="kpis">
        <div class="kpi"><small>Ingresado</small><b class="ok">${fmt(ing)}</b> <span class="suave">· ${movs.filter(m => m.tipo === 'ingreso').length}</span></div>
        <div class="kpi"><small>Egresado</small><b class="mal">${fmt(-egr)}</b> <span class="suave">· ${movs.filter(m => m.tipo === 'egreso').length}</span></div>
        <div class="kpi"><small>Neto</small><b>${fmt(ing - egr)}</b></div>
        <div class="kpi"><small>Cierres con diferencia</small><b class="${conDif.length ? 'alerta' : ''}">${conDif.length}</b> <span class="suave">de ${cerradas.length} · ${fmt(conDif.reduce((a, c) => a + +c.diferencia, 0))}</span></div>
      </div>
      ${!sid && !R.cajaSuc ? `<h3>Por local</h3>${tablaGrupo('Local', agrupar(m => m.sucursal))}` : ''}
      <h3 style="margin-top:18px">Por persona</h3>${tablaGrupo('Quién', agrupar(m => m.usuario || '(sin dato)'))}
      <h3 style="margin-top:18px">Detalle <span class="suave">· ${movs.length}${todos.length === 3000 ? ' (los últimos 3000: achicá las fechas)' : ''}</span></h3>
      <table><tr><th>Fecha</th>${!sid ? '<th>Local</th>' : ''}<th>Tipo</th><th>Concepto</th><th>Quién</th><th class="n">Monto</th></tr>
        ${movs.map(m => `<tr><td style="white-space:nowrap">${fc(m.fecha)}</td>${!sid ? `<td>${esc(m.sucursal)}</td>` : ''}
          <td><span class="etiqueta ${m.tipo === 'ingreso' ? 'azul' : 'rosa'}">${m.tipo === 'ingreso' ? 'Ingreso' : 'Egreso'}</span></td>
          <td>${esc(m.concepto)}</td><td>${esc(m.usuario || '—')}</td><td class="n ${m.tipo === 'ingreso' ? 'ok' : 'mal'}">${fmt(m.tipo === 'egreso' ? -m.monto : m.monto)}</td></tr>`).join('')
          || `<tr><td colspan="6" class="suave">Ningún ingreso ni egreso${R.cajaTipo || R.cajaQuien || R.cajaSuc ? ' con ese filtro' : ' en el período'}.</td></tr>`}
      </table>
      <h3 style="margin-top:22px">Cajas del período <span class="suave">· ${cierres.length}</span></h3>
      <table><tr><th>Fecha</th>${!sid ? '<th>Local</th>' : ''}<th>Abrió</th><th>Cerró</th><th class="n">Apertura</th><th class="n">+ Efectivo ventas</th><th class="n">+ Ingresos</th><th class="n">− Egresos</th>
          <th class="n">Esperado</th><th class="n">Contado</th><th class="n">Diferencia</th><th>Obs.</th></tr>
        ${cierres.map(c => `<tr><td style="white-space:nowrap">${ddmm(c.fecha)}</td>${!sid ? `<td>${esc(c.sucursal)}</td>` : ''}
          <td>${esc(c.abierta_por || '—')} <span class="suave">${(c.abierta_en || '').slice(11, 16)}</span></td>
          <td>${c.estado === 'abierta' ? '<span class="etiqueta azul">Abierta</span>' : `${esc(c.cerrada_por || '—')} <span class="suave">${(c.cerrada_en || '').slice(11, 16)}</span>`}</td>
          <td class="n">${fmt(c.apertura)}</td><td class="n">${fmt(c.efectivo)}</td><td class="n">${fmt(c.ingresos)}</td><td class="n">${fmt(-c.egresos)}</td>
          <td class="n">${fmt(c.esperado)}</td><td class="n">${c.contado == null ? '—' : fmt(c.contado)}</td>
          <td class="n ${c.diferencia == null ? '' : Math.abs(c.diferencia) < 1 ? 'ok' : 'mal'}">${c.diferencia == null ? '—' : fmt(c.diferencia)}</td><td>${esc(c.observaciones || '')}</td></tr>`).join('')
          || '<tr><td colspan="12" class="suave">No hubo cajas en el período.</td></tr>'}
      </table>`;
  }
  // Cambios, anulaciones y descuentos
  let control = '';
  if (hayExtra) {
    control = `<div>
      <div class="tabla-scroll"><h3>Cambios y devoluciones</h3>
        <table><tr><th>Local</th><th class="n">Cambios</th><th class="n">Devoluciones</th><th class="n">Unid. devueltas</th><th class="n">Neto</th></tr>
          ${x.cambios.map(c => `<tr><td>${esc(c.sucursal)}</td><td class="n">${c.cambios}</td><td class="n">${c.devoluciones}</td><td class="n">${c.unidades}</td><td class="n">${fmt(c.neto)}</td></tr>`).join('')
            || '<tr><td colspan="5" class="suave">Ninguno en el período.</td></tr>'}
        </table>
        <p class="suave">"Neto" es la plata que se movió: negativo = se le devolvió al cliente.</p></div>
      <div class="tabla-scroll" style="margin-top:18px"><h3>Ventas anuladas <span class="suave">· ${anuladas}</span></h3>
        <table><tr><th>Vendedor</th>${!sid ? '<th>Local</th>' : ''}<th class="n">Anuladas</th><th class="n">Importe</th></tr>
          ${x.anuladas.map(a => `<tr><td>${esc(a.vendedor)}</td>${!sid ? `<td>${esc(a.sucursal)}</td>` : ''}<td class="n"><b>${a.cantidad}</b></td><td class="n">${fmt(a.total)}</td></tr>`).join('')
            || '<tr><td colspan="4" class="suave">Ninguna en el período.</td></tr>'}
        </table>
        <p class="suave">El detalle de cada una (quién la anuló y cuándo) está en Historial.</p></div>
      <div class="tabla-scroll" style="margin-top:18px"><h3>Descuento por pago en efectivo</h3>
        <table><tr><td>Ventas con descuento</td><td class="n">${x.descuentos.ventas}</td></tr>
          <tr><td>Total descontado</td><td class="n"><b>${fmt(x.descuentos.total)}</b></td></tr>
          <tr><td>Sobre lo vendido</td><td class="n">${pctTotal(+x.descuentos.total)}</td></tr></table></div>
    </div>`;
  }

  return `<h1>Reportes <a class="boton no-imprimir" href="#ia" style="margin-left:auto;font-size:14px">✦ Consultar con IA</a></h1>
  <div class="panel no-imprimir">
    <div class="cats">${ATAJOS.map(([k, t]) => { const [a, b] = rangoAtajo(k); return `<button type="button" class="${F.desde === a && F.hasta === b ? 'activa' : ''}" onclick="atajo('${k}')">${t}</button>`; }).join('')}</div>
  </div>
  ${filtroPeriodo(true, `<button type="button" class="sec" onclick="print()">Imprimir</button> <button type="button" class="sec" onclick="exportarVentas(F.desde,F.hasta,sucFiltro())">Descargar detalle (CSV)</button>`)}
  <div class="panel no-imprimir"><p class="suave" style="margin:0 0 8px">Qué mostrar (tocá para ocultar o mostrar; se recuerda en esta compu) ·
      <a href="javascript:verTodas(true)">todo</a> · <a href="javascript:verTodas(false)">nada</a></p>
    <div class="cats">${SECCIONES.map(([k, t]) => `<button type="button" data-chip="${k}" class="${R.ocultas.includes(k) ? '' : 'activa'}" onclick="verSeccion('${k}')">${t}</button>`).join('')}</div>
  </div>
  <p class="suave">Del ${ddmm(F.desde)}/${F.desde.slice(0, 4)} al ${ddmm(F.hasta)}/${F.hasta.slice(0, 4)} · ${sid ? esc(sucNombre(sid)) : 'todas las sucursales'}${ant ? ` · se compara con el ${ddmm(ant.desde)} al ${ddmm(ant.hasta)}` : ''}</p>
  ${hayExtra ? '' : falta}
  <div class="kpis">
    <div class="kpi"><small>Total vendido</small><b>${fmt(r.res.total)}</b>${ant ? variacion(r.res.total, ant.total) : ''}</div>
    <div class="kpi"><small>Ventas (tickets)</small><b>${r.res.ventas}</b>${ant ? variacion(r.res.ventas, ant.ventas) : ''}</div>
    <div class="kpi"><small>Unidades</small><b>${r.res.unidades}</b>${ant ? variacion(r.res.unidades, ant.unidades) : ''}</div>
    <div class="kpi"><small>Ticket promedio</small><b>${fmt(r.res.ticket)}</b>${ant ? variacion(r.res.ticket, ant.ticket) : ''}</div>
  </div>
  <div class="kpis">
    <div class="kpi"><small>% originales (unid.)</small><b>${pctOriginales(total)}</b></div>
    ${hayExtra ? `<div class="kpi"><small>Promedio por día</small><b>${fmt(totalPeriodo / x.largo)}</b></div>
    <div class="kpi"><small>Descuento en efectivo</small><b>${fmt(x.descuentos.total)}</b></div>
    <div class="kpi"><small>Ventas anuladas</small><b class="${anuladas ? 'alerta' : ''}">${anuladas}</b></div>` : ''}
  </div>
  ${sec('objetivos', `<div class="panel"><h2>Objetivos de ${mes}</h2>${tablaObjetivos(r.avance, false)}</div>`)}
  ${sec('dias', `<div class="panel tabla-scroll"><h2>Día por día</h2>${hayExtra ? dias : falta}</div>`)}
  ${sec('horarios', `<div class="panel tabla-scroll"><h2>Días y horarios</h2><p class="suave">Para ver qué días y en qué horas se vende más (por ejemplo, para armar los turnos).</p>${hayExtra ? horarios : falta}</div>`)}
  ${sec('vendedores', `<div class="panel tabla-scroll"><h2>Tickets por vendedor</h2>
    ${hayExtra ? tickets : `<table><tr><th>Vendedor</th>${!sid ? '<th>Sucursal</th>' : ''}<th class="n">Tickets</th><th class="n">Unid.</th><th class="n">Total</th><th class="n">Ticket prom.</th><th class="n">% del total</th></tr>
      ${r.vendedores.map(v => `<tr><td>${esc(v.vendedor)}</td>${!sid ? `<td>${esc(v.sucursal)}</td>` : ''}<td class="n">${v.ventas}</td><td class="n">${v.unidades}</td><td class="n">${fmt(v.total)}</td>
        <td class="n">${ticket(+v.total, +v.ventas)}</td><td class="n">${pctTotal(+v.total)}</td></tr>`).join('') || '<tr><td class="suave">Sin datos.</td></tr>'}
    </table>`}
    <div class="tabla-scroll" style="margin-top:18px">${r.sucursales.length ? `<h3>Tickets por local</h3><table><tr><th>Local</th><th class="n">Tickets</th><th class="n">Total</th><th class="n">Ticket prom.</th><th class="n">% del total</th></tr>
        ${r.sucursales.map(s => `<tr><td>${esc(s.sucursal)}</td><td class="n">${s.ventas}</td><td class="n">${fmt(s.total)}</td><td class="n">${ticket(+s.total, +s.ventas)}</td><td class="n">${pctTotal(+s.total)}</td></tr>`).join('')}</table>`
      : '<h3>Tickets por local</h3><p class="suave">Elegí "Todas las sucursales" para comparar los locales.</p>'}</div>
    <h3 style="margin-top:18px">Proyección de ${MESES[r.mes.mes]} por vendedor</h3>
    <p class="suave">Lo vendido en el mes (${r.mes.pasados} de ${r.mes.dias} días) y a cuánto llegaría cada uno al ritmo actual.${sid ? '' : ' "% del local" es su parte en la proyección de su local.'}</p>
    <table><tr><th>Vendedor</th>${!sid ? '<th>Local</th>' : ''}<th class="n">Vendido en el mes</th><th class="n">Proyección a fin de mes</th><th class="n">% del local</th></tr>
      ${r.proy_vendedores.map(v => `<tr><td>${esc(v.vendedor)}</td>${!sid ? `<td>${esc(v.sucursal)}</td>` : ''}<td class="n">${fmt(v.vendido)}</td><td class="n"><b>${fmt(v.proyeccion)}</b></td><td class="n">${pct(v.pct_local)}</td></tr>`).join('')
        || '<tr><td colspan="5" class="suave">Sin ventas en el mes.</td></tr>'}
    </table></div>`)}
  ${sec('categorias', `<div class="panel tabla-scroll"><h2>Categorías</h2>${hayExtra ? categorias : falta}</div>`)}
  ${sec('productos', `<div class="panel tabla-scroll"><h2>Top 10 productos (unidades)</h2>
    <table><tr><th>#</th><th>Producto</th><th class="n">Unidades</th><th class="n">Importe</th><th>Vendedores (unidades)</th></tr>
      ${r.top.map((t, i) => `<tr><td>${i + 1}</td><td>${esc(t.descripcion)}</td><td class="n"><b>${t.unidades}</b></td><td class="n">${fmt(t.importe)}</td>
        <td>${t.vendedores.map(v => `${esc(v.vendedor)}: ${v.unidades}`).join(' · ')}</td></tr>`).join('') || '<tr><td colspan="5" class="suave">Sin datos.</td></tr>'}
    </table>
    <h3 style="margin-top:18px">Productos originales vendidos</h3>
    <table>${r.originales.map(o => `<tr><td>${esc(o.descripcion)}</td><td class="n">${o.unidades} u.</td><td class="n">${fmt(o.importe)}</td></tr>`).join('') || '<tr><td class="suave">Ninguno (marcá los productos como "Original" en Productos).</td></tr>'}</table>
  </div>`)}
  ${sec('fundas', `<div class="panel tabla-scroll"><h2>Fundas por marca y modelo del celular <span class="suave">(incluye flip covers) · total ${totalFundas}</span></h2>
    <p class="suave">Según la marca y el modelo que carga el vendedor en cada venta.</p>
    ${fundas.map(g => `<h3>${g.marca} · ${g.total} unidades</h3>
      <table><tr><th>Modelo</th>${g.marca === 'Otras marcas' ? '<th>Marca</th>' : ''}<th class="n">Fundas</th><th class="n">Flip cover</th><th class="n">Total</th></tr>
        ${g.modelos.map(m => `<tr><td>${esc(m.modelo || '(sin modelo)')}</td>${g.marca === 'Otras marcas' ? `<td>${esc(m.marca)}</td>` : ''}<td class="n">${m.fundas}</td><td class="n">${m.flip}</td><td class="n"><b>${m.total}</b></td></tr>`).join('')}
      </table>`).join('') || '<p class="suave">No se vendieron fundas en el período.</p>'}
    ${r.vidrios ? `<h2 style="margin-top:22px">Protectores de pantalla por marca y modelo <span class="suave">(vidrio templado e hydrogel) · total ${r.vidrios.reduce((s, v) => s + +v.total, 0)}</span></h2>
    <table><tr><th>Marca</th><th>Modelo</th><th class="n">Unidades</th></tr>
      ${r.vidrios.map(v => `<tr><td>${esc(v.marca)}</td><td>${esc(v.modelo || '(sin modelo)')}</td><td class="n"><b>${v.total}</b></td></tr>`).join('') || '<tr><td colspan="3" class="suave">No se vendieron protectores en el período.</td></tr>'}
    </table>` : ''}
  </div>`)}
  ${sec('clases', `<div class="panel tabla-scroll"><h2>Originales y genéricos por local</h2>
    <p class="suave">Del período elegido. El % es sobre lo clasificado; "sin definir" son productos que todavía no se marcaron como original o genérico (se arreglan en Productos). Por caja: pantalla Caja.</p>
    <table class="clases"><tr><th>Local</th><th class="n">Originales (u.)</th><th class="n">Importe</th><th class="n">Genéricos (u.)</th><th class="n">Importe</th><th class="n">% unid. orig. / gen.</th><th class="n">% importe orig. / gen.</th><th class="n">Sin definir</th></tr>
      ${r.clases.map(s => filaClase(esc(s.sucursal), s.clases)).join('')}
      ${r.clases.length > 1 ? filaClase('Total', total, true) : ''}
    </table></div>`)}
  ${sec('medios', panelMedios(r, sid))}
  ${sec('caja', `<div class="panel tabla-scroll"><h2>Caja: ingresos y egresos de efectivo</h2>${hayExtra ? caja : falta}</div>`)}
  ${sec('clientes', `<div class="panel tabla-scroll"><h2>Clientes</h2>${hayExtra ? clientes : falta}</div>`)}
  ${sec('control', `<div class="panel tabla-scroll"><h2>Cambios, anulaciones y descuentos</h2>${hayExtra ? control : falta}
    <h3 style="margin-top:18px">Diferencias por devolución <span class="suave">· ${r.creditos.length}</span></h3>
    <p class="suave">Ventas donde se descontó algo que trajo el cliente sin venta previa en el sistema, con el motivo que escribió el vendedor.</p>
    <table><tr><th>Venta</th><th>Fecha</th>${!sid ? '<th>Local</th>' : ''}<th>Vendedor</th><th class="n">Descontado</th><th>Motivo</th></tr>
      ${r.creditos.map(c => `<tr><td><a href="#ticket/${c.venta}">#${c.venta}</a></td><td>${fc(c.fecha)}</td>${!sid ? `<td>${esc(c.sucursal)}</td>` : ''}<td>${esc(c.vendedor)}</td><td class="n">${fmt(c.monto)}</td><td>${esc(c.observaciones)}</td></tr>`).join('')
        || '<tr><td colspan="6" class="suave">Ninguna en el período.</td></tr>'}
    </table></div>`)}`;
}

// ---------------------------------------------------------------- consultar con IA (015 + función techpoint-ia)
// La pregunta va a la función del servidor con la sesión del usuario; Claude consulta las funciones de solo lectura
// de la base y ve lo mismo que la persona en Reportes. La charla vive mientras la página está abierta (no se repinta sola).
const IA = { charla: [], cargando: false, info: null };
const IA_EJEMPLOS = ['¿Cuánto vendimos hoy y cómo venimos contra ayer?', '¿Qué modelos de celular piden más fundas este mes?',
  '¿Qué local va mejor contra su objetivo del mes?', '¿En qué horarios se vende más esta semana?',
  '¿Qué productos activos no se vendieron en los últimos 30 días?', '¿Quién vendió más este mes y con qué ticket promedio?'];
const IA_EJEMPLOS_COMPRAS = ['¿Qué local superó su presupuesto de compras este mes?', '¿Cuánto presupuesto de compras queda disponible en cada local?'];
const iaSuc = () => global() ? ST.suc : sucActual();
// Texto de la IA → HTML seguro: **negrita**, listas con "- " y saltos de línea
function iaTexto(t) {
  const lineas = esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split('\n');
  let html = '', lista = false;
  for (const l of lineas) {
    const item = /^\s*[-•]\s+(.*)/.exec(l);
    if (item && !lista) { html += '<ul>'; lista = true; }
    if (!item && lista) { html += '</ul>'; lista = false; }
    html += item ? `<li>${item[1]}</li>` : (l.trim() ? `<p>${l}</p>` : '');
  }
  return html + (lista ? '</ul>' : '');
}
const iaValor = (v, f) => f === 'pesos' ? fmt(v) : f === 'porcentaje' ? pct(v) : Math.round(+v || 0).toLocaleString('es-AR');
// Barras (1 o 2 series) o línea, en SVG, con los colores de la marca
function iaGrafico(g) {
  const et = g.etiquetas || [], series = (g.series || []).slice(0, 2).filter(s => s.valores && s.valores.length);
  if (!et.length || !series.length) return '';
  const W = 640, H = 220, izq = 8, abajo = 30, arriba = 18, alto = H - abajo - arriba;
  const max = Math.max(1, ...series.flatMap(s => s.valores.map(v => +v || 0)));
  const ancho = (W - izq * 2) / et.length, y = v => arriba + alto - Math.max(0, +v || 0) / max * alto;
  const colores = ['var(--rosa)', 'var(--azul-claro)'];
  const cada = Math.ceil(et.length / 12);
  let marcas = '';
  if (g.tipo === 'linea') {
    series.forEach((s, k) => {
      const pts = s.valores.map((v, i) => `${(izq + ancho * (i + .5)).toFixed(1)},${y(v).toFixed(1)}`);
      marcas += `<polyline points="${pts.join(' ')}" fill="none" stroke="${colores[k]}" stroke-width="2.5" stroke-linejoin="round"/>` +
        s.valores.map((v, i) => `<circle cx="${(izq + ancho * (i + .5)).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" fill="${colores[k]}"><title>${esc(et[i])} · ${esc(s.nombre)}: ${iaValor(v, g.formato)}</title></circle>`).join('');
    });
  } else {
    const b = Math.min(42, ancho * .7 / series.length);
    series.forEach((s, k) => s.valores.forEach((v, i) => {
      const x = izq + ancho * (i + .5) - b * series.length / 2 + b * k;
      marcas += `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${Math.max(1, b - 2).toFixed(1)}" height="${(arriba + alto - y(v)).toFixed(1)}" fill="${colores[k]}" rx="2"><title>${esc(et[i])} · ${esc(s.nombre)}: ${iaValor(v, g.formato)}</title></rect>`;
    }));
  }
  const textos = et.map((e, i) => i % cada ? '' : `<text x="${(izq + ancho * (i + .5)).toFixed(1)}" y="${H - 10}" text-anchor="middle">${esc(String(e).slice(0, 12))}</text>`).join('');
  return `<figure class="ia-grafico"><figcaption>${esc(g.titulo)}${series.length > 1 ? series.map((s, k) => ` <span class="ia-serie" style="--c:${colores[k]}">${esc(s.nombre)}</span>`).join('') : ''}</figcaption>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(g.titulo)}">
      <text x="${izq}" y="12" class="ia-max">máx. ${iaValor(max, g.formato)}</text>
      <line x1="${izq}" x2="${W - izq}" y1="${arriba + alto}" y2="${arriba + alto}" stroke="var(--borde-2)"/>${marcas}${textos}</svg></figure>`;
}
function iaRespuesta(x, i) {
  if (x.error) return `<div class="aviso error" style="margin:0">${esc(x.error)}</div>`;
  const r = x.respuesta;
  const t = r.tabla && r.tabla.columnas && r.tabla.columnas.length ? r.tabla : null;
  return `<div class="ia-texto">${iaTexto(r.texto || '')}</div>
    ${(r.kpis || []).length ? `<div class="kpis">${r.kpis.slice(0, 4).map(k => `<div class="kpi"><small>${esc(k.etiqueta)}</small><b>${esc(k.valor)}</b>${k.detalle ? `<span class="var suave">${esc(k.detalle)}</span>` : ''}</div>`).join('')}</div>` : ''}
    ${r.grafico ? iaGrafico(r.grafico) : ''}
    ${t ? `<div class="tabla-scroll">${t.titulo ? `<h3>${esc(t.titulo)}</h3>` : ''}<table><tr>${t.columnas.map(c => `<th>${esc(c)}</th>`).join('')}</tr>
      ${(t.filas || []).map(f => `<tr>${f.map(c => `<td class="${/^[-$\s\d.,%]+$/.test(String(c).trim()) ? 'n' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>` : ''}
    <div class="ia-acciones no-imprimir">
      ${(r.sugerencias || []).slice(0, 3).map(s => `<button type="button" class="sec" onclick="iaPreguntar(${esc(JSON.stringify(s))})">${esc(s)}</button>`).join('')}
      <span class="ia-sep"></span>
      <a href="#" onclick="iaCopiar(${i}, this); return false">Copiar</a>${t ? ` · <a href="#" onclick="iaCsv(${i}); return false">Descargar tabla (CSV)</a>` : ''}
    </div>`;
}
function iaPintar() {
  const c = $('ia-charla'); if (!c) return;
  c.innerHTML = IA.charla.map((x, i) => `<div class="ia-turno">
      <div class="ia-pregunta"><span>${esc(x.pregunta)}</span></div>
      <div class="panel ia-resp">${x.cargando ? '<p class="suave ia-pensando">Consultando los datos… puede tardar hasta un minuto.</p>' : iaRespuesta(x, i)}</div>
    </div>`).join('') || `<div class="panel no-imprimir"><p class="suave" style="margin-top:0">Preguntá en castellano, como se lo preguntarías a una persona. Por ejemplo:</p>
      <div class="cats">${[...IA_EJEMPLOS, ...(es('supervisor') ? IA_EJEMPLOS_COMPRAS : [])].map(e => `<button type="button" onclick="iaPreguntar(${esc(JSON.stringify(e))})">${esc(e)}</button>`).join('')}</div></div>`;
  const b = $('ia-enviar'); if (b) b.disabled = IA.cargando;
  const n = $('ia-uso'); if (n && IA.info) n.textContent = iaUso();
}
const iaUso = () => `${IA.info.usadas_hoy} de ${IA.info.limite} preguntas hoy` +
  (IA.info.mes_usd != null ? ` · gasto del mes: US$ ${(+IA.info.mes_usd).toFixed(2)} de ${(+IA.info.tope_usd).toFixed(0)}` : '');
async function iaPreguntar(texto) {
  const campo = $('ia-pregunta');
  const pregunta = String(texto ?? (campo ? campo.value : '')).trim();
  if (!pregunta || IA.cargando) return;
  if (campo) campo.value = '';
  const historial = IA.charla.filter(x => x.respuesta).slice(-4).map(x => ({ pregunta: x.pregunta, respuesta: x.respuesta.texto || '' }));
  const turno = { pregunta, cargando: true };
  IA.charla.push(turno); IA.cargando = true; iaPintar();
  $('ia-charla').lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'start' });
  try {
    const { data, error } = await sb.functions.invoke('techpoint-ia', { body: { usuario: ST.uid, pregunta, sucursal_id: iaSuc(), historial } });
    if (error) throw new Error(navigator.onLine ? 'La consulta a la IA no está disponible todavía. Avisale al administrador.' : 'Sin conexión: revisá internet e intentá de nuevo.');
    if (!data.ok) {
      const m = String(data.error || 'No se pudo consultar.').trim();
      if (m.startsWith('SESION:')) { ST.ini = { ...ST.ini, yo: null }; ST.uid = null; IA.cargando = false; IA.charla = []; return render(); }
      throw new Error(m);
    }
    turno.respuesta = data.respuesta;
    if (IA.info) IA.info.usadas_hoy = data.usadas_hoy;
  } catch (e) { turno.error = e.message; }
  turno.cargando = false; IA.cargando = false;
  iaPintar();
}
function iaCopiar(i, a) {
  const r = IA.charla[i] && IA.charla[i].respuesta; if (!r) return;
  const t = r.tabla ? '\n\n' + [r.tabla.columnas, ...r.tabla.filas].map(f => f.join('\t')).join('\n') : '';
  const k = (r.kpis || []).map(k => `${k.etiqueta}: ${k.valor}`).join('\n');
  navigator.clipboard.writeText(`${IA.charla[i].pregunta}\n\n${r.texto}${k ? '\n\n' + k : ''}${t}`)
    .then(() => { a.textContent = 'Copiado ✓'; setTimeout(() => { a.textContent = 'Copiar'; }, 2000); }, () => alert('No se pudo copiar.'));
}
function iaCsv(i) {
  const t = IA.charla[i] && IA.charla[i].respuesta && IA.charla[i].respuesta.tabla; if (!t) return;
  descargar(`consulta_ia_${hoy()}.csv`, '﻿' + [t.columnas, ...t.filas].map(f => f.map(celdaCsv).join(';')).join('\r\n'), 'text/csv');
}

  const p = ((IA.info && IA.info.preguntas) || []).find(x => x.id === id); if (!p || !p.respuesta || !p.respuesta.texto || IA.cargando) return;

  $('ia-charla').lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function borrarDatos(f) {
  const que = [...f.querySelectorAll('[name=borrar]:checked')].map(c => c.value);
  if (!que.length) return alert('Marcá qué querés borrar.');
  const nombres = [...f.querySelectorAll('[name=borrar]:checked')].map(c => '• ' + c.parentElement.textContent.trim()).join('\n');
  const hasta = f.hasta.value;
  if ((prompt(`Vas a borrar${hasta ? ` (hasta el ${fd(hasta)})` : ''}:\n${nombres}\n\nNo se puede deshacer. Para seguir escribí BORRAR`) || '').trim().toUpperCase() !== 'BORRAR') return;
  try {
    const r = await rpc('tp_borrar_datos', { ...U(), p_que: { borrar: que, hasta: hasta || null } });
    avisar(`Borrado: ${r.ventas} ventas, ${r.cajas} cajas, ${r.clientes} clientes, ${r.objetivos} objetivos, ${r.productos} productos dados de baja.`);
    await cargarInicial();
  } catch (e) { avisar(e.message, true); }
  render();
}

// ---------------------------------------------------------------- compras y presupuestos (v28 + SQL 024)
// Facturas de proveedores imputadas por local, categoría (originales / genéricos) y mes, contra un presupuesto que sale del objetivo de
// venta de cada local (Config → Objetivos) repartido según lo que vendió de cada clase × 50 % / 23 %, más el saldo del mes anterior.
// Supervisor, dueño y superadmin. Porcentajes, grupos, cierres y reaperturas: dueño y superadmin. Todos los cálculos los hace la base.
const CP = { mes: null, grupo: '', vista: leer('cp-vista', 'h'), orden: { col: -1, dir: 1 }, f: {}, ev: {}, rep: {}, pf: {}, carga: null, editImp: null, editFac: false };
const CAT = { original: 'Originales', generico: 'Genéricos' };
const COLOR_CAT = { original: 'var(--c-orig)', generico: 'var(--c-gen)' };
// Estado con forma + texto (nunca sólo color): verde < 80 %, amarillo de 80 % a menos de 100 %, rojo desde 100 %
const ESTADO = { disponible: ['●', 'Disponible'], atencion: ['◆', 'Atención'], excedido: ['▲', 'Excedido'],
                 sin_presupuesto: ['○', 'Sin presupuesto disponible'], insuficiente: ['▼', 'Presupuesto insuficiente'] };
const estadoHtml = e => ESTADO[e] ? `<span class="estado ${e}">${ESTADO[e][0]} ${ESTADO[e][1]}</span>` : '';
const pct1 = n => n == null ? '—' : (+n).toLocaleString('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %';
const fmtSigno = n => (+n > 0 ? '+' : '') + fmt(n);
// Con centavos sólo si los tiene (importes de facturas)
const fmtC = n => { const v = Math.abs(+n || 0), c = Math.round(v * 100) % 100 !== 0;
  return ((+n || 0) < 0 ? '-$ ' : '$ ') + v.toLocaleString('es-AR', { minimumFractionDigits: c ? 2 : 0, maximumFractionDigits: 2 }); };
// Corto para gráficos: $ 7,5 M · $ 850 mil
const fmtM = n => { const a = Math.abs(+n || 0), s = (+n || 0) < 0 ? '-$ ' : '$ ';
  return a >= 1e6 ? s + (a / 1e6).toLocaleString('es-AR', { maximumFractionDigits: a >= 1e8 ? 0 : 1 }) + ' M'
       : a >= 1e3 ? s + Math.round(a / 1e3).toLocaleString('es-AR') + ' mil' : s + Math.round(a); };
const mesTxt = k => k ? `${MESES[+k.slice(5, 7)]} ${k.slice(0, 4)}` : '';
const mesCorto = k => `${MESES[+k.slice(5, 7)].slice(0, 3)} ${k.slice(2, 4)}`;
const mesSumar = (k, n) => { const t = +k.slice(0, 4) * 12 + +k.slice(5, 7) - 1 + n; return `${Math.floor(t / 12)}-${String(t % 12 + 1).padStart(2, '0')}`; };
const mesesEntre = (d, h) => { const r = []; for (let k = d; k <= h && r.length < 60; k = mesSumar(k, 1)) r.push(k); return r; };
const opcionesMes = (lista, actual) => lista.map(k => `<option value="${k}" ${k === actual ? 'selected' : ''}>${mesTxt(k)}</option>`).join('');
const mesDeImp = i => `${i.anio}-${String(i.mes).padStart(2, '0')}`;
const numCsv = n => n == null || n === '' ? '' : String(Math.round(+n * 100) / 100).replace('.', ',');
// Igual que techpoint.clave_texto: sin mayúsculas, acentos, espacios ni signos
const claveTexto = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const cpTope = info => info.hoy > info.inicio ? info.hoy : info.inicio;
const cpMesesAbiertos = info => mesesEntre(info.inicio, mesSumar(cpTope(info), 2)).filter(k => !info.cerrados.includes(k));
// Filtro de alcance: '' = toda la empresa, 'g2' = un grupo, 's5' = un local
const ambitoArgs = a => ({ p_suc: /^s\d+$/.test(a || '') ? +a.slice(1) : null, p_grupo: /^g\d+$/.test(a || '') ? +a.slice(1) : null });
const opcionesAmbito = (info, a) => `<option value="">Toda la empresa</option>
  <optgroup label="Grupos">${info.grupos.map(g => `<option value="g${g.id}" ${a === 'g' + g.id ? 'selected' : ''}>${esc(g.nombre)}</option>`).join('')}</optgroup>
  <optgroup label="Locales">${info.sucursales.map(s => `<option value="s${s.id}" ${a === 's' + s.id ? 'selected' : ''}>${esc(s.nombre)}</option>`).join('')}</optgroup>`;
const opcionesCat = c => `<option value="">Las dos</option>${Object.entries(CAT).map(([v, t]) => `<option value="${v}" ${c === v ? 'selected' : ''}>${t}</option>`).join('')}`;
// Las dos categorías juntas (o una sola) de un {original, generico}
function cpSumaCat(x, cat) {
  if (cat) return x[cat];
  const o = x.original, g = x.generico, pr = +o.presupuesto + +g.presupuesto, co = +o.compras + +g.compras;
  return { presupuesto: pr, compras: co, saldo: pr - co, base: +o.base + +g.base, saldo_inicial: +o.saldo_inicial + +g.saldo_inicial,
           pct: pr > 0 ? co / pr * 100 : null,
           estado: pr < 0 ? 'insuficiente' : pr === 0 ? 'sin_presupuesto' : co >= pr ? 'excedido' : co >= pr * .8 ? 'atencion' : 'disponible' };
}
const cpLeyenda = items => `<div class="leyenda">${items.map(([t, c, tipo]) => `<span class="${tipo || ''}" style="--c:${c}">${t}</span>`).join('')}</div>`;
const cpMiniBarra = (o, g, max, tip) => `<div class="mini-barra" data-tip="${esc(tip)}"><i style="width:${max > 0 ? Math.max(0, o) / max * 100 : 0}%;background:var(--c-orig)"></i><i style="width:${max > 0 ? Math.max(0, g) / max * 100 : 0}%;background:var(--c-gen)"></i></div>`;
function cpFiltrarFilas(id, q) {
  const k = claveTexto(q);
  document.querySelectorAll(`#${id} tr[data-buscar]`).forEach(tr => { tr.hidden = !!k && !tr.dataset.buscar.includes(k); });
}

// Globo con el detalle al pasar el mouse o tocar una barra (elementos con data-tip)
function tipIniciar() {
  const tip = document.createElement('div'); tip.id = 'tip'; tip.hidden = true; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip);
  const mostrar = (el, x, y) => {
    tip.textContent = el.getAttribute('data-tip'); tip.hidden = false;
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, x + 14)) + 'px';
    tip.style.top = (y - r.height - 12 < 8 ? y + 18 : y - r.height - 12) + 'px';
  };
  const de = e => e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
  document.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const el = de(e); if (el) mostrar(el, e.clientX, e.clientY); else tip.hidden = true; });
  document.addEventListener('pointerdown', e => { const el = de(e); if (el && e.pointerType !== 'mouse') mostrar(el, e.clientX, e.clientY); else if (!el) tip.hidden = true; });
  document.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true, capture: true });
}

const cpTip = (suc, c, x) => `${suc} · ${CAT[c]}\nPresupuesto: ${fmt(x.presupuesto)}\nCompras: ${fmt(x.compras)}\nUtilizado: ${pct1(x.pct)}\nSaldo: ${fmtSigno(x.saldo)}\n${ESTADO[x.estado][1]}`;
// Barras horizontales: el presupuesto es la pista tenue, lo comprado la barra llena; la rayita marca dónde termina el presupuesto
function cpGraficoH(locales) {
  const max = Math.max(1, ...locales.flatMap(l => ['original', 'generico'].flatMap(c => [+l[c].presupuesto, +l[c].compras])));
  const w = v => Math.max(0, +v) / max * 100;
  return `<div class="bullet">${locales.map(l => `<div class="bullet-grupo"><a href="#compras/local-${l.sucursal_id}">${esc(l.sucursal)}</a>
    ${['original', 'generico'].map(c => { const x = l[c], p = +x.presupuesto > 0;
      return `<div class="bullet-fila" style="--c:${COLOR_CAT[c]}" data-tip="${esc(cpTip(l.sucursal, c, x))}">
        <span class="bullet-cat">${c === 'original' ? 'Orig.' : 'Gen.'}</span>
        <div class="bullet-pista">${p ? `<i class="pres" style="width:${w(x.presupuesto)}%"></i>` : ''}<i class="comp" style="width:${w(x.compras)}%"></i>${p ? `<b class="tope" style="left:${w(x.presupuesto)}%"></b>` : ''}</div>
        <span class="bullet-dato">${fmtM(x.compras)} <span class="suave">de ${fmtM(x.presupuesto)}</span> · <b>${pct1(x.pct)}</b></span></div>`; }).join('')}</div>`).join('')}</div>`;
}
// Barra con la punta de los datos redondeada (4 px) y la base recta. h > 0 sube desde la base, h < 0 baja.
function rectV(x, base, w, h, color, extra = '') {
  if (Math.abs(h) < .5 || w <= 0) return '';
  const r = Math.min(4, w / 2, Math.abs(h)), f = v => +v.toFixed(1);
  if (h > 0) return `<path d="M${f(x)},${f(base)}v${f(-(h - r))}a${r},${r} 0 0 1 ${r},${-r}h${f(w - 2 * r)}a${r},${r} 0 0 1 ${r},${r}v${f(h - r)}z" fill="${color}" ${extra}/>`;
  const a = -h;
  return `<path d="M${f(x)},${f(base)}v${f(a - r)}a${r},${r} 0 0 0 ${r},${r}h${f(w - 2 * r)}a${r},${r} 0 0 0 ${r},${-r}v${f(-(a - r))}z" fill="${color}" ${extra}/>`;
}
// Escala con números redondos: de min a max en unos 4 pasos
function cpEje(min, max) {
  const bruto = Math.max(1e-9, max - min) / 4, p = Math.pow(10, Math.floor(Math.log10(bruto)));
  const paso = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= bruto);
  const a = Math.floor(min / paso) * paso, b = Math.max(a + paso, Math.ceil(max / paso) * paso), marcas = [];
  for (let v = a; v <= b + paso / 2; v += paso) marcas.push(Math.round(v * 1e6) / 1e6);
  return { min: a, max: b, marcas };
}
// Ancho del panel donde va el gráfico (todo el ancho o media grilla): se dibuja a ese tamaño para que la letra quede siempre de 12 px.
// Si no entra (muchos meses en el celular), se desplaza de costado.
function cpAncho(mitad) {
  const m = document.querySelector('main'), cs = m && getComputedStyle(m);
  // si la página todavía no tiene barra de desplazamiento, va a aparecer al dibujar: se descuenta
  const barra = innerWidth === document.documentElement.clientWidth && matchMedia('(pointer: fine)').matches ? 17 : 0;
  const w = m ? m.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - barra : 900;
  return Math.max(280, Math.floor((mitad && w >= 660 ? (w - 20) / 2 : w) - 46));
}
const cpSvg = (W, H, titulo, cuerpo) => `<div class="tabla-scroll"><svg class="graf" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titulo)}">${cuerpo}</svg></div>`;
const cpGrilla = (eje, y, x0, x1, f) => eje.marcas.map(v => `<line x1="${x0}" x2="${x1}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="${v === 0 ? 'var(--borde-2)' : 'var(--borde)'}"/>` +
  `<text x="${x0 - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${f(v)}</text>`).join('');
// Barras verticales: por local, presupuesto (tenue) y compras de originales, y lo mismo de genéricos; el % arriba de cada compra
function cpGraficoV(locales) {
  const n = Math.max(1, locales.length), W = Math.max(cpAncho(), 90 + n * 96), H = 300, x0 = 76, x1 = W - 10, top = 24, base = H - 40;
  const eje = cpEje(0, Math.max(1, ...locales.flatMap(l => ['original', 'generico'].flatMap(c => [+l[c].presupuesto, +l[c].compras]))));
  const y = v => base - (Math.max(0, v) - eje.min) / (eje.max - eje.min) * (base - top);
  const paso = (x1 - x0) / n, b = Math.max(6, Math.min(22, (paso * .8 - 12) / 4));
  let s = cpGrilla(eje, y, x0, x1, fmtM);
  locales.forEach((l, i) => {
    const cx = x0 + paso * (i + .5), izq = cx - (4 * b + 2 + 8 + 2) / 2;
    ['original', 'generico'].forEach((c, k) => {
      const x = izq + k * (2 * b + 2 + 8), v = l[c];
      s += rectV(x, base, b, base - y(+v.presupuesto), COLOR_CAT[c], 'fill-opacity=".3"') + rectV(x + b + 2, base, b, base - y(+v.compras), COLOR_CAT[c]);
      if (v.pct != null) s += `<text class="valor" x="${(x + b * 1.5 + 2).toFixed(1)}" y="${(y(+v.compras) - 6).toFixed(1)}" text-anchor="middle">${Math.round(v.pct)}%</text>`;
      s += `<rect x="${(x - 1).toFixed(1)}" y="${top}" width="${(2 * b + 4).toFixed(1)}" height="${base - top}" fill="transparent" data-tip="${esc(cpTip(l.sucursal, c, v))}"/>`;
    });
    s += `<text x="${cx.toFixed(1)}" y="${H - 16}" text-anchor="middle">${esc(l.sucursal)}</text>`;
  });
  return cpSvg(W, H, 'Presupuesto y compras por local', s);
}

    <div class="avance" role="img" aria-label="${CAT[c]}: ${pct1(x.pct)} del presupuesto"><i class="${x.estado}" style="width:${Math.min(100, Math.max(0, +x.pct || 0))}%"></i></div>

// ---- cargar una factura: simple y rápido

    <select aria-label="Categoría" onchange="CP.carga.lineas[${i}].cat=this.value">${Object.entries(CAT).map(([v, t]) => `<option value="${v}" ${l.cat === v ? 'selected' : ''}>${t}</option>`).join('')}</select>

const cpTotalCarga = () => CP.carga.lineas.reduce((s, l) => s + numero(l.monto), 0);
function cpTotal() { const t = $('cp-total'); if (t) t.textContent = fmtC(cpTotalCarga()); }
function cpLinea() {
  const u = CP.carga.lineas[CP.carga.lineas.length - 1];
  CP.carga.lineas.push({ suc: '', cat: u ? u.cat : 'original', monto: '' });
  $('cp-lineas').innerHTML = cpLineasHtml(); $('cp-lineas').lastElementChild.querySelector('select').focus();

function cpQuitar(i) { CP.carga.lineas.splice(i, 1); $('cp-lineas').innerHTML = cpLineasHtml(); cpTotal(); }
function cpRepartirMarcar(g) { document.querySelectorAll('[data-rep]').forEach(c => { c.checked = !g || c.dataset.grupo === g; }); }
function cpRepartir() {
  const total = Math.round(numero($('cp-rep-total').value) * 100), cat = $('cp-rep-cat').value;
  const ids = [...document.querySelectorAll('[data-rep]:checked')].map(c => c.dataset.rep);
  if (!(total > 0)) return alert('Escribí el total a repartir.');
  if (!ids.length) return alert('Marcá entre qué locales se reparte.');
  const parte = Math.floor(total / ids.length), resto = total - parte * ids.length;      // en centavos: la suma da justo el total
  const nuevas = ids.map((id, i) => ({ suc: id, cat, monto: String((parte + (i < resto ? 1 : 0)) / 100).replace('.', ',') }));
  CP.carga.lineas = [...CP.carga.lineas.filter(l => l.suc || numero(l.monto) > 0), ...nuevas];
  $('cp-lineas').innerHTML = cpLineasHtml(); $('cp-repartir').hidden = true; cpTotal();

function cpElegirProv(n) { CP.carga.proveedor = n; $('cp-prov').value = n; cpVerProveedor(); cpBuscarFactura(); $('cp-num').focus(); }
async function cpBuscarFactura() {

async function cpConfirmar() {

  const p = cpProvDe(c.proveedor), b = $('cp-ok'); b.disabled = true;
  try {
    const r = await rpc('tp_compras_cargar', { ...U(), p_datos: { proveedor_id: p ? p.id : null, proveedor: p ? null : c.proveedor, numero: c.numero, fecha: c.fecha,

// Días → semanas del mes (1 a 7, 8 a 14…) o días, con lo acumulado. Las facturas con fecha fuera del mes van aparte.
function cpRitmoPeriodos(dias, mes, por, cat) {
  const fin = new Date(Date.UTC(+mes.slice(0, 4), +mes.slice(5, 7), 0)).getUTCDate(), g = new Map();
  const valor = d => cat === 'original' ? [+d.original, 0] : cat === 'generico' ? [0, +d.generico] : [+d.original, +d.generico];
  if (por === 'semana') for (let s = 1; s <= Math.ceil(fin / 7); s++) g.set('1' + s, { et: `Semana ${s} · del ${(s - 1) * 7 + 1} al ${Math.min(s * 7, fin)}`, o: 0, g: 0 });
  dias.forEach(d => {
    const m = d.dia.slice(0, 7);
    const [k, et] = m < mes ? ['0', 'Antes del mes'] : m > mes ? ['9', 'Después del mes'] : por === 'dia' ? ['1' + d.dia, ddmm(d.dia)]
      : ['1' + Math.ceil(+d.dia.slice(8, 10) / 7), null];
    const x = g.get(k) || { et, o: 0, g: 0 }, [o, gg] = valor(d);
    x.o += o; x.g += gg; g.set(k, x);
  });
  let ao = 0, ag = 0;
  return [...g.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([, x]) => { ao += x.o; ag += x.g; return { et: x.et, v: x.o + x.g, ao, ag, ac: ao + ag }; });
}

      ${r.proveedores.length > 12 ? `<p class="suave" style="font-size:13px">Se muestran los 12 primeros; la tabla tiene los ${r.proveedores.length}.</p>` : ''}
    </div>
    <div class="panel tabla-scroll"><table><tr><th>Proveedor</th><th class="n">Total</th><th class="n">Originales</th><th class="n">Genéricos</th><th class="n">Participación</th><th class="n">Facturas</th></tr>
      ${r.proveedores.map(p => `<tr><td><a href="#compras/proveedor-${p.id}">${esc(p.nombre)}</a></td><td class="n">${fmt(p.total)}</td><td class="n">${fmt(p.original)}</td>
        <td class="n">${fmt(p.generico)}</td><td class="n">${part(p.total)}</td><td class="n">${p.facturas}</td></tr>`).join('')}
      ${r.proveedores.length ? `<tr class="total"><td>Total</td><td class="n">${fmt(r.total)}</td><td class="n">${fmt(r.original)}</td><td class="n">${fmt(r.generico)}</td><td class="n">${tot > 0 ? '100,0 %' : '—'}</td><td class="n">${r.facturas}</td></tr>` : ''}
    </table></div>
    <div>
      <div class="panel tabla-scroll"><h2>Por local</h2><table><tr><th>Local</th><th class="n">Originales</th><th class="n">Genéricos</th><th class="n">Total</th><th></th></tr>
        ${r.sucursales.map(s => `<tr><td>${esc(s.sucursal)} <span class="suave">${esc(s.grupo || '')}</span></td><td class="n">${fmt(s.original)}</td><td class="n">${fmt(s.generico)}</td>
          <td class="n">${fmt(+s.original + +s.generico)}</td><td>${cpMiniBarra(+s.original, +s.generico, maxS, `${s.sucursal}\nOriginales: ${fmt(s.original)}\nGenéricos: ${fmt(s.generico)}\nFacturas: ${s.facturas}`)}</td></tr>`).join('')
          || '<tr><td colspan="5" class="suave">Sin compras.</td></tr>'}</table></div>
      <div class="panel tabla-scroll"><h2>Por grupo</h2><table><tr><th>Grupo</th><th class="n">Originales</th><th class="n">Genéricos</th><th class="n">Total</th></tr>
        ${r.grupos.map(g => `<tr><td>${esc(g.grupo)}</td><td class="n">${fmt(g.original)}</td><td class="n">${fmt(g.generico)}</td><td class="n">${fmt(+g.original + +g.generico)}</td></tr>`).join('')
          || '<tr><td colspan="4" class="suave">Sin compras.</td></tr>'}</table></div>
    </div>
    ${mesesR.length ? `<div class="panel tabla-scroll"><h2>Evolución mensual por proveedor</h2><table><tr><th>Proveedor</th>${mesesR.map(k => `<th class="n">${mesCorto(k)}</th>`).join('')}</tr>
      ${top6.map(p => `<tr><td>${esc(p.nombre)}</td>${mesesR.map(k => `<td class="n">${fmt(celda(p.id, k))}</td>`).join('')}</tr>`).join('')}
      ${r.proveedores.length > 6 ? `<tr><td class="suave">Los demás</td>${mesesR.map(k => `<td class="n">${fmt(celda(null, k))}</td>`).join('')}</tr>` : ''}
      <tr class="total"><td>Total</td>${mesesR.map(k => `<td class="n">${fmt(r.meses.filter(m => m.mes === k).reduce((s, m) => s + +m.total, 0))}</td>`).join('')}</tr></table></div>` : ''}`;
}
function cpFiltroRep(fm) {
  let d = fm.desde.value, h = fm.hasta.value; if (d > h) [d, h] = [h, d];
  CP.rep = { desde: d, hasta: h, ambito: fm.ambito.value, cat: fm.cat.value }; render();
}
function cpExcelReporte() {
  const r = CP.reporte; if (!r) return;
  const tot = +r.total, enc = ['Proveedor', 'Total', 'Originales', 'Genéricos', 'Participación (%)', 'Facturas'];
  const csv = [enc, ...r.proveedores.map(p => [p.nombre, numCsv(p.total), numCsv(p.original), numCsv(p.generico), tot > 0 ? numCsv(p.total / tot * 100) : '', p.facturas])]
    .map(f => f.map(celdaCsv).join(';')).join('\r\n');
  descargar(`compras_proveedores_${r.desde}_${r.hasta}.csv`, '﻿' + csv, 'text/csv');
}

// ---- configuración (dueño y superadmin): porcentajes, mes de inicio, grupos y cierres
async function cpConfig() {
  const info = await rpc('tp_compras_info', U()); CP.info = info;
  const opInicio = mesesEntre(mesSumar(info.hoy, -12), mesSumar(info.hoy, 12));
  return `<div class="grilla">
    <form class="panel" onsubmit="event.preventDefault();cpGuardarCfg({pct_original:this.po.value,pct_generico:this.pg.value},'Porcentajes guardados.')">
      <h2>Porcentajes del presupuesto</h2>
      <div class="fila"><label>Originales (%)<input name="po" type="number" min="0.01" max="100" step="0.01" value="${info.pct_original}" required></label>
        <label>Genéricos (%)<input name="pg" type="number" min="0.01" max="100" step="0.01" value="${info.pct_generico}" required></label><button>Guardar</button></div>
      <p class="suave" style="margin-bottom:0;font-size:13px">Presupuesto base = ventas proyectadas de la categoría × este porcentaje. Cambiarlo recalcula los meses abiertos (y lo que arrastran); los meses cerrados conservan el porcentaje con que se cerraron.</p></form>
    <form class="panel" onsubmit="event.preventDefault();cpGuardarCfg({inicio:this.inicio.value},'Mes de inicio guardado.')">
      <h2>Mes de inicio</h2>
      <div class="fila"><label>Primer mes del módulo<select name="inicio" ${info.cerrados.length ? 'disabled' : ''}>${opcionesMes(opInicio.includes(info.inicio) ? opInicio : [info.inicio, ...opInicio], info.inicio)}</select></label>
        ${info.cerrados.length ? '' : '<button>Guardar</button>'}</div>
      <p class="suave" style="margin-bottom:0;font-size:13px">El primer mes arranca sin saldo anterior y no se pueden cargar compras de meses anteriores. ${info.cerrados.length ? 'Ya hay meses cerrados: no se puede cambiar.' : ''}</p></form>
  </div>
  <div class="panel"><h2>Grupos de locales</h2>
    <div class="grilla" style="margin-bottom:0">
      <div class="tabla-scroll"><table><tr><th>Local</th><th>Grupo</th></tr>
        ${info.sucursales.map(s => `<tr><td>${esc(s.nombre)}</td><td><select onchange="cpGuardarCfg({asignar:[{sucursal_id:${s.id},grupo_id:this.value}]},'Grupo cambiado.')">
          <option value="">Sin grupo</option>${info.grupos.map(g => `<option value="${g.id}" ${s.grupo_id === g.id ? 'selected' : ''}>${esc(g.nombre)}</option>`).join('')}</select></td></tr>`).join('')}</table></div>
      <div>
        ${info.grupos.map(g => `<div class="fila" style="margin-bottom:8px;align-items:center"><input value="${esc(g.nombre)}" maxlength="40" aria-label="Nombre del grupo"
          onchange="cpGuardarCfg({grupos:[{id:${g.id},nombre:this.value}]},'Grupo renombrado.')"><span class="suave">${g.sucursales.length} local${g.sucursales.length === 1 ? '' : 'es'}</span>
          ${g.sucursales.length ? '' : `<button class="peligro chico" onclick="cpGuardarCfg({borrar_grupo:${g.id}},'Grupo borrado.')">Borrar</button>`}</div>`).join('')}
        <form class="fila" onsubmit="event.preventDefault();cpGuardarCfg({nuevo_grupo:this.n.value},'Grupo creado.')"><label>Grupo nuevo<input name="n" maxlength="40" required></label><button class="sec">Crear</button></form>
      </div>
    </div>
    <p class="suave" style="margin-bottom:0;font-size:13px">Los grupos sirven para ver juntos varios locales (Resumen, Evolución, Reportes y la IA). Un local está en un solo grupo, así que nada se suma dos veces.</p></div>
  <div class="panel tabla-scroll"><h2>Cierres</h2><table><tr><th>Mes</th><th>Estado</th><th></th></tr>
    ${mesesEntre(info.inicio, info.hoy > info.inicio ? info.hoy : info.inicio).reverse().map(k => `<tr><td>${mesTxt(k)}</td>
      <td>${info.cerrados.includes(k) ? '<span class="etiqueta rosa">Cerrado</span>' : k < info.hoy ? '<span class="alerta">Terminó y está abierto</span>' : 'En curso'}</td>
      <td><a href="#compras" onclick="CP.mes='${k}'">Ver${k < info.hoy && !info.cerrados.includes(k) ? ' y cerrar' : ''}</a></td></tr>`).join('')}</table>
    <p class="suave" style="margin-bottom:0;font-size:13px">Se cierra en orden (primero el mes más viejo) y se reabre empezando por el último cerrado, con motivo.</p></div>`;
}
async function cpGuardarCfg(datos, ok) {
  try { await rpc('tp_compras_config', { ...U(), p_datos: datos }); avisar(ok); }
  catch (e) { avisar(e.message, true); }
  render();
}

tipIniciar();
iniciar();
</script>
</body>
</html>
