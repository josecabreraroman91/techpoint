<style>
/* TechPoint — estética basada en el logo: fondo negro, guion rosa, punto azul cuadrado. (Mismo estilo que el sistema Flask.) */
:root {
  --negro: #000; --fondo: #050507; --panel: #0e0e13; --panel-2: #16161d; --borde: #23232c; --borde-2: #33333f;
  --texto: #f3f3f6; --suave: #8c8c9a;
  --rosa: #ff1a8c; --rosa-2: rgba(255, 26, 140, .14);
  --azul: #2b3fe0; --azul-claro: #7c8aff; --azul-2: rgba(43, 63, 224, .18);
  --ok: #2bd88f; --mal: #ff5a63; --alerta: #ffb84d;
  --radio: 6px; --radio-chico: 3px;
  --display: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cuerpo: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--fondo); }
body { margin: 0; font: 15px/1.5 var(--cuerpo); background: var(--fondo); color: var(--texto); -webkit-font-smoothing: antialiased; }
a { color: var(--azul-claro); text-decoration: none; }
a:hover { color: #fff; }
::selection { background: var(--rosa); color: #fff; }

h1, h2, h3 { font-family: var(--display); font-weight: 500; letter-spacing: -.01em; }
h1 { font-size: 26px; margin: 0 0 20px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h1::before { content: ""; width: 18px; height: 4px; background: var(--rosa); flex: none; align-self: flex-end; margin-bottom: 7px; }
h2 { font-size: 16px; margin: 0 0 14px; }
h3 { font-size: 12px; margin: 18px 0 8px; color: var(--suave); text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }
h3::before { content: "_"; color: var(--rosa); margin-right: 4px; }

.marca, .marca-acceso { font-family: var(--display); font-weight: 400; color: #fff; letter-spacing: -.01em; white-space: nowrap; line-height: 1.2; }
.marca { font-size: 21px; display: inline-block; }
.marca:hover { color: #fff; }
.marca i, .marca-acceso i { display: inline-block; font-style: normal; vertical-align: baseline; }
.marca .guion, .marca-acceso .guion { width: .78em; height: .14em; background: var(--rosa); margin-right: .12em; vertical-align: -.16em; }
.marca .punto, .marca-acceso .punto { width: .2em; height: .2em; background: var(--azul); margin-left: .12em; }
.marca span, .marca-acceso span { font-family: var(--cuerpo); font-size: 11px; font-weight: 600; color: var(--suave); text-transform: uppercase; letter-spacing: .14em; display: inline-block; vertical-align: .35em; margin-left: 10px; border-left: 1px solid var(--borde-2); padding-left: 10px; line-height: 1.3; }

.barra { display: flex; align-items: center; gap: 22px; padding: 12px 24px; background: rgba(0, 0, 0, .88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--borde); }
.barra nav { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; }
.barra nav a { color: #a9a9b6; padding: 7px 11px; border-radius: var(--radio-chico); font-size: 14px; font-weight: 500; position: relative; }
.barra nav a:hover { background: var(--panel-2); color: #fff; }
.barra nav a.activo { color: #fff; background: transparent; }
.barra nav a.activo::after { content: ""; position: absolute; left: 11px; right: 11px; bottom: 1px; height: 3px; background: var(--rosa); }
.sesion { display: flex; gap: 8px; align-items: center; }
.sesion select { background: var(--panel-2); color: #fff; border: 1px solid var(--borde-2); font-size: 14px; }

main { max-width: 1250px; margin: 0 auto; padding: 30px 24px 70px; }
.aviso { background: var(--azul-2); border: 1px solid rgba(124, 138, 255, .35); border-left: 3px solid var(--azul); padding: 11px 15px; border-radius: var(--radio); margin-bottom: 16px; }
.aviso.error { background: rgba(255, 90, 99, .1); border-color: rgba(255, 90, 99, .4); border-left-color: var(--mal); }
.panel { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio); padding: 20px; margin-bottom: 20px; }
.grilla { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); margin-bottom: 20px; }
.grilla > .panel { margin-bottom: 0; }

.kpis { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 20px; }
.kpi { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio); padding: 16px 18px 18px; position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; left: 18px; top: 0; width: 22px; height: 3px; background: var(--rosa); }
.kpi:nth-child(even)::before { width: 6px; height: 6px; background: var(--azul); }
.kpi small { color: var(--suave); display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; margin: 6px 0 6px; }
.kpi b { font-family: var(--display); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--borde); vertical-align: top; }
th { font-size: 11px; color: var(--suave); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
table tr:hover td { background: rgba(255, 255, 255, .02); }
td.n, th.n { text-align: right; white-space: nowrap; }
tr.anulada td { color: #5d5d69; text-decoration: line-through; }
tr.total td { font-weight: 700; border-top: 2px solid var(--rosa); }
.tabla-scroll { overflow-x: auto; }

input, select, textarea, button { font: inherit; padding: 8px 11px; border: 1px solid var(--borde-2); border-radius: var(--radio); background: var(--fondo); color: var(--texto); }
input::placeholder, textarea::placeholder { color: #5f5f6c; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--azul); outline-offset: -1px; border-color: var(--azul); }
input[type=checkbox], input[type=radio] { accent-color: var(--rosa); }
button, .boton { background: var(--rosa); color: #fff; border: 1px solid var(--rosa); cursor: pointer; padding: 8px 16px; border-radius: var(--radio); display: inline-block; font-weight: 600; transition: background .15s, border-color .15s, transform .05s; }
button:hover, .boton:hover { background: #ff3d9e; color: #fff; }
button:active, .boton:active { transform: translateY(1px); }
button:focus-visible, .boton:focus-visible { outline: 2px solid var(--azul-claro); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }
button.sec, .boton.sec { background: transparent; color: var(--texto); border-color: var(--borde-2); }
button.sec:hover, .boton.sec:hover { background: var(--panel-2); border-color: #4a4a58; }
button.peligro { background: transparent; color: var(--mal); border-color: rgba(255, 90, 99, .5); }
button.peligro:hover { background: var(--mal); color: #fff; }
button.chico, .boton.chico { padding: 3px 9px; font-size: 13px; }
.fila { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
.fila label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--suave); font-weight: 500; }
.suave { color: var(--suave); }
.ok { color: var(--ok); } .mal { color: var(--mal); } .alerta { color: var(--alerta); }
.etiqueta { font-size: 11px; padding: 2px 7px; border-radius: var(--radio-chico); background: var(--panel-2); border: 1px solid var(--borde-2); color: #b9b9c6; white-space: nowrap; font-weight: 500; }
.etiqueta.rosa { background: var(--rosa-2); border-color: rgba(255, 26, 140, .4); color: #ff7ab9; }
.etiqueta.sin-stock { background: rgba(255, 184, 77, .12); border-color: rgba(255, 184, 77, .45); color: var(--alerta); }
.etiqueta.azul { background: var(--azul-2); border-color: rgba(124, 138, 255, .45); color: var(--azul-claro); }
.tilde { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 50%; background: var(--azul); color: #fff; font-size: 11px; font-weight: 700; margin-right: 6px; vertical-align: 1px; flex: none; }
.clase-btn { cursor: pointer; font: inherit; }
.clase-btn:hover { border-color: var(--azul-claro); }
.credito td { color: var(--alerta); }
.cliente-ok { font-size: 13px; color: var(--ok); margin: 4px 0 0; }
.locales { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.locales label { flex-direction: row !important; align-items: center; gap: 5px !important; color: var(--texto) !important; }
.clases td.n b { font-family: var(--display); }
.modelo-cel { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.modelo-cel select, .modelo-cel input { padding: 4px 6px; font-size: 13px; }
.modelo-cel input { flex: 1; min-width: 110px; }
.modelo-cel .falta, .precio.falta, select.falta { border-color: var(--mal); }
td.acciones { white-space: nowrap; }
input[readonly] { opacity: .65; cursor: not-allowed; }
details summary { cursor: pointer; }
details.panel summary b { font-weight: 500; }

.barra-prog { height: 6px; background: var(--panel-2); overflow: hidden; min-width: 100px; }
.barra-prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--rosa), var(--azul)); }
.barra-prog i.ok { background: var(--ok); }
[hidden] { display: none !important; }
.barra-dato { height: 8px; min-width: 120px; }
.barra-dato i { display: block; height: 100%; background: var(--azul-claro); border-radius: 0 4px 4px 0; }
table.con-barras td:last-child { width: 30%; }
.kpi .var { display: block; font-size: 12px; margin-top: 6px; }

.venta { display: grid; grid-template-columns: 1fr 380px; gap: 20px; align-items: start; }
.venta > .panel { position: sticky; top: 76px; border-top: 3px solid var(--rosa); }
.apagado { opacity: .35; pointer-events: none; }
label.rapida { display: flex; flex-direction: row; gap: 8px; align-items: center; padding: 10px 12px; margin-bottom: 12px; cursor: pointer;
               border: 1px dashed rgba(255, 184, 77, .55); border-radius: var(--radio-chico); background: rgba(255, 184, 77, .06); }
.aviso.pendientes { background: rgba(255, 184, 77, .08); border-color: rgba(255, 184, 77, .45); border-left-color: var(--alerta); }
@media (max-width: 900px) { .venta { grid-template-columns: 1fr; } .venta > .panel { position: static; } #izq.apagado { display: none; } }
#buscar { width: 100%; font-size: 17px; padding: 14px 16px; background: var(--fondo); }
.resultados { margin-top: 8px; max-height: 420px; overflow: auto; }
.resultado { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: var(--radio); cursor: pointer; border-left: 3px solid transparent; }
.resultado:hover { background: var(--panel-2); }
.resultado.sel { background: var(--rosa-2); border-left-color: var(--rosa); }
.carrito td input { width: 70px; padding: 4px 6px; }
.carrito td input.precio { width: 100px; }
.total-grande { font-family: var(--display); font-size: 40px; font-weight: 500; text-align: right; margin: 16px 0; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.total-grande::after { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--azul); margin-left: 5px; }
.medios { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0; }
.medios label { border: 1px solid var(--borde-2); border-radius: var(--radio); padding: 9px 6px; text-align: center; cursor: pointer; font-size: 14px; color: #c4c4cf; }
.medios label:hover { border-color: #4a4a58; color: #fff; }
.medios input { display: none; }
.medios.mp { grid-template-columns: repeat(3, 1fr); margin-top: -4px; }
.medios.mp label { padding: 6px; font-size: 13px; }
.medios label:has(input:checked) { background: var(--azul); color: #fff; border-color: var(--azul); }
#cobrar { width: 100%; font-size: 18px; padding: 14px; font-family: var(--display); font-weight: 500; }

.chip { background: var(--panel-2); border: 1px solid var(--borde-2); padding: 6px 11px; border-radius: var(--radio); font-size: 14px; }
.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.cats button { background: var(--panel-2); border: 1px solid var(--borde-2); color: var(--texto); padding: 6px 11px; font-size: 13px; font-weight: 500; }
.cats button.activa { background: var(--azul); border-color: var(--azul); color: #fff; }
/* Consultar con IA */
.ia-turno { margin-bottom: 18px; }
.ia-pregunta { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.ia-pregunta span { background: var(--rosa-2); border: 1px solid rgba(255, 26, 140, .35); padding: 9px 14px; border-radius: var(--radio); max-width: 80%; white-space: pre-wrap; }
.ia-resp { margin-bottom: 0; }
.ia-resp .kpis { margin: 14px 0; }
.ia-texto p { margin: 0 0 8px; } .ia-texto ul { margin: 0 0 8px; padding-left: 20px; } .ia-texto > :last-child { margin-bottom: 0; }
.ia-resp h3 { font-size: 14px; margin: 16px 0 6px; }
.ia-pensando { margin: 0; animation: ia-pulso 1.4s ease-in-out infinite; }
@keyframes ia-pulso { 50% { opacity: .45; } }
.ia-grafico { margin: 14px 0 0; } .ia-grafico figcaption { font-size: 13px; color: var(--suave); margin-bottom: 4px; }
.ia-grafico svg { width: 100%; height: auto; display: block; } .ia-grafico text { fill: var(--suave); font-size: 11px; font-family: var(--cuerpo); }
.ia-serie::before { content: ""; display: inline-block; width: 9px; height: 9px; background: var(--c); margin: 0 4px 0 8px; }
.ia-acciones { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; font-size: 13px; }
.ia-acciones button { font-size: 13px; padding: 5px 10px; font-weight: 500; } .ia-sep { flex: 1; }
.ia-caja textarea { width: 100%; resize: vertical; margin-bottom: 10px; }
.ia-anteriores { margin: 0; padding-left: 18px; } .ia-anteriores li { margin-bottom: 4px; }
@media (prefers-reduced-motion: reduce) { .ia-pensando { animation: none; } }
.cats button span { opacity: .65; margin-left: 4px; }
tr.grupo td { background: var(--panel-2); font-family: var(--display); font-weight: 600; padding-top: 10px; }
select.cat-fila { padding: 3px 6px; font-size: 13px; max-width: 150px; }
/* Compras y presupuestos (v28). Originales azul y genéricos rosa en todos los gráficos (validados para daltonismo sobre el fondo);
   el presupuesto va en el mismo color, tenue, o como línea de referencia gris. Verde / amarillo / rojo sólo para el estado, siempre con texto. */
:root { --c-orig: #7482ff; --c-gen: #ff1a8c; --c-ref: #c9c9d3; }
.pestanas { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 20px; }
.pestanas a { padding: 6px 12px; border: 1px solid var(--borde-2); border-radius: var(--radio); color: #c4c4cf; font-size: 14px; font-weight: 500; }
.pestanas a:hover { border-color: #4a4a58; color: #fff; }
.pestanas a.activa { background: var(--azul); border-color: var(--azul); color: #fff; }
.estado { font-size: 12px; font-weight: 600; white-space: nowrap; }
.estado.disponible { color: var(--ok); } .estado.atencion { color: var(--alerta); } .estado.excedido, .estado.insuficiente { color: var(--mal); } .estado.sin_presupuesto { color: var(--suave); }
.avance { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.avance i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.avance i.disponible { background: var(--ok); } .avance i.atencion { background: var(--alerta); } .avance i.excedido { background: var(--mal); }
.locales-avance { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); margin-bottom: 20px; }
.locales-avance > .panel { margin: 0; }
.tarjeta-titulo { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.tarjeta-titulo h2 { margin: 0; }
.cat-avance { padding: 12px 0; border-bottom: 1px solid var(--borde); }
.cat-titulo { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.cat-titulo .estado { margin-left: auto; }
.muestra { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); flex: none; margin-right: 6px; }
.cifras { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-top: 10px; font-size: 11px; color: var(--suave); text-transform: uppercase; letter-spacing: .06em; }
.cifras b { display: block; font-size: 15px; color: var(--texto); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; text-transform: none; letter-spacing: 0; }
.cifras b.mal { color: var(--mal); }
.total-local { padding-top: 12px; margin-top: 0; }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--suave); margin: 0 0 12px; }
.leyenda span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: -1px; }
.leyenda span.tenue::before { opacity: .3; }
.leyenda span.linea::before { width: 16px; height: 0; border-radius: 0; background: none; border-top: 2px dashed var(--c); vertical-align: 3px; }
.leyenda span.tope::before { width: 2px; height: 14px; border-radius: 0; background: var(--texto); vertical-align: -3px; }
.bullet-grupo { display: grid; grid-template-columns: 120px 1fr; gap: 4px 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--borde); }
.bullet-grupo:first-child { border-top: 0; }
.bullet-grupo > a { grid-row: 1 / 3; font-weight: 600; color: var(--texto); }
.bullet-grupo > a:hover { color: var(--azul-claro); }
.bullet-fila { display: grid; grid-template-columns: 36px minmax(80px, 1fr) 250px; gap: 10px; align-items: center; min-height: 22px; }
.bullet-cat { font-size: 12px; color: var(--suave); }
.bullet-pista { position: relative; height: 16px; }
.bullet-pista i { position: absolute; left: 0; top: 0; height: 100%; border-radius: 0 4px 4px 0; background: var(--c); }
.bullet-pista i.pres { opacity: .3; }
.bullet-pista i.comp { top: 4px; height: 8px; max-width: 100%; }
.bullet-pista b.tope { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--texto); }
.bullet-dato { font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.graf { display: block; max-width: none; }
a[href^="#compras/factura-"] { white-space: nowrap; }
.graf text { fill: var(--suave); font-size: 12px; font-family: var(--cuerpo); }
.graf text.valor { fill: var(--texto); font-weight: 600; }
.mini-barra { display: flex; gap: 2px; height: 10px; min-width: 110px; }
.mini-barra i { display: block; height: 100%; flex: none; }
.mini-barra i:last-of-type { border-radius: 0 4px 4px 0; }
.mini-barra i[style^="width:0%"] { display: none; }
.ranking-fila { display: grid; grid-template-columns: minmax(110px, 200px) 1fr 170px; gap: 12px; align-items: center; padding: 6px 0; color: var(--texto); border-bottom: 1px solid var(--borde); }
.ranking-fila:hover { background: rgba(255, 255, 255, .02); color: #fff; }
.ranking-fila .mini-barra { height: 14px; }
.ranking-dato { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
th.ordenable { cursor: pointer; user-select: none; }
th.ordenable:hover { color: #fff; }
.renglon { display: grid; grid-template-columns: minmax(130px, 1.2fr) minmax(120px, 1fr) minmax(120px, 1fr) auto; gap: 8px; margin-bottom: 8px; }
.carga .fila label { flex: 1; min-width: 150px; }
.carga .fila label.ancho { flex: 2; min-width: 220px; }
.frecuentes { margin-top: 10px; align-items: center; }
.frecuentes button { padding: 4px 10px; }
.repartir { border: 1px dashed var(--borde-2); border-radius: var(--radio); padding: 14px; margin: 10px 0; }
.pie-carga { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--borde); }
.pie-carga b { font-family: var(--display); font-size: 26px; font-weight: 500; margin-left: 6px; font-variant-numeric: tabular-nums; }
.pie-carga button { font-size: 16px; padding: 11px 22px; }
table.mini th, table.mini td { padding: 5px 8px; font-size: 13px; }
tr.anulada td.nota { text-decoration: none; }

/* =====================================================================

const VERSION = 'v31';
// Base propia del dueño (Supabase, organización TechPoint) desde el 24/10/2026. Antes: orbe-clientes de José.
const NUBE = { url: 'https://ihmnfcmkvckhueowkzet.supabase.co', key: 'sb_publishable_fltCybLk39k92dPRant28A_FT8pGJRL' };
const MEDIOS = ['Efectivo', 'Débito', 'Crédito', 'Transferencia', 'Mercado Pago'];
// Mercado Pago se cobra con una de estas opciones (008): se guarda como "Mercado Pago QR", etc.
const OPCIONES_MP = ['QR', '3 cuotas', '6 cuotas'];

const MEDIOS_PAGO = ['Efectivo', 'Débito', ...OPCIONES_CREDITO.map(o => 'Crédito ' + o), 'Transferencia', ...OPCIONES_MP.map(o => 'Mercado Pago ' + o)];
const CATEGORIAS = ['Funda', 'Flip cover', 'Vidrio templado', 'Cargador', 'Cable', 'Auricular', 'Parlante', 'Soporte',
                    'Adaptador', 'Power bank', 'Memoria', 'Smartwatch', 'Tablet', 'Computación', 'Gamer', 'Otro'];

const listaCategorias = filas => {
  const extra = [...new Set(filas.map(p => p.categoria))].filter(c => !CATEGORIAS.includes(c)).sort((a, b) => a.localeCompare(b));
  return [...CATEGORIAS.slice(0, -1), ...extra, 'Otro'];
};
const opcionesCategoria = (actual, cats = ST.cats || CATEGORIAS) =>
  cats.map(c => `<option ${actual === c ? 'selected' : ''}>${esc(c)}</option>`).join('') + '<option value="__nueva">+ Nueva categoría…</option>';
// Si eligió "+ Nueva categoría…", pide el nombre; devuelve la categoría elegida o null si canceló
function elegirCategoria(sel) {
  if (sel.value !== '__nueva') return sel.value;
  const nueva = (prompt('Nombre de la categoría nueva (por ejemplo: Accesorios auto)') || '').trim().slice(0, 40);
  if (!nueva) { sel.value = sel.dataset.antes || ''; return null; }
  if (![...sel.options].some(o => o.value === nueva)) sel.add(new Option(nueva, nueva), sel.options.length - 1);
  sel.value = nueva; return nueva;
}
const MARCAS = ['Samsung', 'iPhone', 'Motorola', 'Xiaomi', 'Otra', 'Universal'];
const MARCAS_PRINCIPALES = ['Samsung', 'iPhone', 'Motorola'];
const NOMBRE_ROL = { vendedor: 'Vendedor', encargado: 'Encargado', supervisor: 'Supervisor', dueno: 'Dueño', superadmin: 'Superadministrador' };
// Escalera: superadmin (5) > dueño (4) > supervisor (3, encargado en todos los locales) > encargado (2) > vendedor (1).
// Dueño y superadmin manejan usuarios y permisos; al dueño y a los superadmin sólo los maneja un superadmin.
const NIVEL = { vendedor: 1, encargado: 2, supervisor: 3, dueno: 4, superadmin: 5 };
const CLASES = { original: 'Original', generico: 'Genérico' };
// Tilde azul delante de los productos originales
const tilde = clase => clase === 'original' ? '<span class="tilde" title="Original" aria-label="Original">✓</span>' : '';
// Producto «Diferencia por devolución» (006): el vendedor escribe el monto y se suma a la venta (sin descuento en efectivo)
const COD_DIFERENCIA = 'DIF-DEV';
const COD_DIF_CAJA = 'DIF-CAJA';        // «Diferencia de caja» (019): el encargado o más le pone un monto, también negativo
const COD_CHIP = 'CHIP';                // el chip Personal / Movistar / Claro (025): va sin descuento en efectivo
// Fundas, flip covers y protectores (vidrio / hydrogel): al vender se carga la marca y el modelo del celular
const PIDE_MODELO = ['Funda', 'Flip cover', 'Vidrio templado'];
const MARCAS_CEL = ['Samsung', 'iPhone', 'Motorola', 'Xiaomi', 'Otra'];
const MESES = ['', 'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

let sb = null;
const ST = { ini: null, uid: null, suc: null, aviso: null, pintadas: 0, html: null, avisoHtml: '' };

// ---------------------------------------------------------------- utilidades
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => ((+n || 0) < 0 ? '-$ ' : '$ ') + Math.round(Math.abs(+n || 0)).toLocaleString('es-AR');
const pct = n => n == null ? '—' : Math.round(n) + '%';
const fc = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)} ${s.slice(11, 16)}` : '';
const guardar = (k, v) => { try { localStorage.setItem('tp-' + k, JSON.stringify(v)); } catch (e) {} };
const leer = (k, def) => { try { const v = localStorage.getItem('tp-' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } };

async function rpc(nombre, args) {
  const { data, error } = await sb.rpc(nombre, args || {});
  if (error) {
    const m = error.message || '';
    if (m.startsWith('SESION:')) {                       // la base no reconoce la sesión: volver a la pantalla de entrada
      ST.ini = { ...ST.ini, yo: null }; ST.uid = null;
      setTimeout(render, 0);
      throw new Error(m.slice(7).trim());
    }
    throw new Error(navigator.onLine ? (m || 'No se pudo guardar.') : 'Sin conexión: revisá internet e intentá de nuevo.');
  }
  return data;
}

// Cuenta del local (014): la usan varios vendedores; al vender hay que elegir quién vende
const esLocal = () => !!(ST.ini.yo && ST.ini.yo.es_local);
// Quiénes pueden figurar como vendedor de una venta del local: asignados a ese local (rotación incluida), sin cuentas de local.
// Con «tambienGlobales» suma a los supervisores (los elige el encargado o el dueño).
const vendedoresDe = (suc, tambienGlobales) => ST.ini.usuarios.filter(x => !x.es_local && NIVEL[x.rol] < 4
  && ((tambienGlobales && NIVEL[x.rol] >= 3) || (x.locales || [x.sucursal_id]).includes(suc)));
function usuario() { return ST.ini && ST.ini.yo ? (ST.ini.usuarios || []).find(u => u.id === ST.uid) || null : null; }
function es(rol) { const u = usuario(); return !!u && NIVEL[u.rol] >= NIVEL[rol]; }
const global = (u = usuario()) => !!u && NIVEL[u.rol] >= 3;          // trabaja en todos los locales
const localesDe = u => u ? (global(u) ? ST.ini.sucursales.map(s => s.id) : (u.locales || [u.sucursal_id]).filter(Boolean)) : [];
// Roles globales: el local elegido (o todos). El resto: el local elegido si está habilitado (rotación), si no su local principal.
function sucActual() {
  const u = usuario(); if (!u) return null;
  if (global(u)) return ST.suc;
  return localesDe(u).includes(ST.suc) ? ST.suc : u.sucursal_id;
}
function sucNombre(id) { const s = ST.ini.sucursales.find(s => s.id === id); return s ? s.nombre : ''; }
const U = () => ({ p_usuario: ST.uid });
const hoy = () => ST.ini.hoy;
const inicioMes = () => ST.ini.hoy.slice(0, 8) + '01';

function avisar(msg, error) { ST.aviso = { msg, error }; }
function ir(hash) { if (location.hash === hash) render(); else location.hash = hash; }

// Número escrito a mano: "12.500", "12.500,50", "$ 12500"
function numero(x) {
  x = String(x ?? '').replace(/\$/g, '').replace(/\s/g, '');
  if (x.includes(',')) x = x.replace(/\./g, '').replace(',', '.');
  else if ((x.match(/\./g) || []).length > 1 || /^\d{1,3}\.\d{3}$/.test(x)) x = x.replace(/\./g, '');
  const n = parseFloat(x);
  return isNaN(n) ? 0 : n;
}

// Búsqueda: código, nombre, marca o modelo. Atajos de iPhone: ip, ip13, ip15p, ip17pm.
function filtrar(lista, q) {
  const palabras = q.trim().split(/\s+/).filter(Boolean);
  const res = lista.filter(p => palabras.every(w => {
    const m = /^ip(?:hone)?(\d+)?(pm|p|plus|\+|mini)?$/i.exec(w);
    if (m) {
      if (p.marca !== 'iPhone') return false;
      if (!m[1]) return true;
      const suf = { pm: ' Pro Max', p: ' Pro', plus: ' Plus', '+': ' Plus', mini: ' mini' }[(m[2] || '').toLowerCase()] || '';
      const t = (m[1] + suf).toLowerCase();
      return (p.modelo || '').toLowerCase().startsWith(t) || (p.descripcion || '').toLowerCase().includes(t);
    }
    return tieneCodigo(p, w) || `${p.descripcion} ${p.marca} ${p.modelo}`.toLowerCase().includes(w.toLowerCase());
  }));
  return res.sort((a, b) => (tieneCodigo(a, q.trim()) ? 0 : 1) - (tieneCodigo(b, q.trim()) ? 0 : 1) || a.descripcion.localeCompare(b.descripcion));
}
// El código principal o cualquiera de los otros del producto (027)
const tieneCodigo = (p, c) => !!c && [p.codigo, ...(p.codigos || [])].some(x => x && x.toLowerCase() === c.toLowerCase());

function descargar(nombre, texto, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], { type: tipo }));

  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const celdaCsv = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

async function exportarVentas(desde, hasta, suc) {
  try {
    const filas = await rpc('tp_exportar', { ...U(), p_desde: desde, p_hasta: hasta, p_suc: suc || null });
    const enc = ['Venta', 'Fecha', 'Sucursal', 'Vendedor', 'Medio de pago', 'Tipo', 'Producto', 'Categoría', 'Marca', 'Modelo', 'Cantidad', 'Precio unitario', 'Subtotal',
                 'Original/Genérico', 'Teléfono', 'Cliente', 'Observaciones'];

}

// ---------------------------------------------------------------- arranque
async function iniciar() {
  try {
    if (!window.supabase) throw new Error(navigator.onLine ? 'No cargó la librería de datos.' : 'Sin conexión a internet.');

  ST.ini = await rpc('tp_inicial');

function vEntrar() {
  const primera = ST.ini.primera_vez;
  return `<form class="acceso panel" onsubmit="event.preventDefault();entrar(this)">

}
// Vendedores (pedido del dueño, 25/10/2026): pueden quedarse con el PIN que les dieron (por ejemplo 1234), no se los obliga a cambiarlo.
// El resto de los roles, la primera vez que entra con una clave que le puso otro, tiene que poner una propia.

    ${debeCambiar() ? `<div class="aviso">Entraste con un PIN que te dieron. Antes de seguir, poné uno propio.</div>` : ''}

async function cambiarMiClave(f) {

// Poner la clave de otro (dueño y superadmin; al dueño y a los superadmin, sólo un superadmin)

async function render() {
  document.body.classList.remove('imprime-ticket');
  if ($('tip')) $('tip').hidden = true;
  const n = ++ST.pintadas; ST.html = null;                                  // corta cualquier actualización automática en curso
  const [ruta, arg] = (location.hash.slice(1) || 'inicio').split('/');
  const r = RUTAS[ruta] || RUTAS.inicio;
  pintarBarra(ruta);
  if (!usuario()) { document.title = `Entrar · TechPoint ${VERSION}`; $('app').innerHTML = vEntrar(); return; }
  if (debeCambiar() && ruta !== 'clave') return ir('#clave');               // primero, una clave propia (salvo vendedores)
  if (r.rol && !es(r.rol)) { avisar('No tenés permiso para entrar ahí.', true); return ir('#inicio'); }
  if (Date.now() - (ST.ping || 0) > 5 * 60 * 1000) {                        // mantener viva la sesión mientras se usa
    ST.ping = Date.now();
    sb.rpc('tp_ping').then(({ data }) => { if (data && !data.ok) { ST.ini = { ...ST.ini, yo: null }; ST.uid = null; render(); } });
  }
  document.title = `${r.t} · TechPoint ${VERSION}`;
  const aviso = ST.aviso; ST.aviso = null;
  try {
    const html = await r.f(arg);
    if (n !== ST.pintadas) { window.__despues = null; return; }             // mientras cargaba se pidió otra pantalla
    pintar(r, html, aviso ? `<div class="aviso ${aviso.error ? 'error' : ''}">${esc(aviso.msg)}</div>` : '');
  } catch (e) {
    $('app').innerHTML = `<div class="aviso error">${esc(e.message)}</div>`;
  }
}
const despues = f => { window.__despues = f; };
function pintar(r, html, aviso) {
  ST.html = html; ST.avisoHtml = aviso;
  $('app').innerHTML = aviso + html;
  if (r.despues) r.despues();
  if (window.__despues) { const f = window.__despues; window.__despues = null; f(); }
}

// ---------------------------------------------------------------- se actualiza sola
// Las pantallas de consulta se vuelven a pedir cada 30 s (y al volver a la pestaña), así se ve lo que vende otro local.
// Sólo se repinta si algo cambió y nunca mientras alguien está escribiendo o eligiendo algo en la pantalla.
// No renueva la sesión (eso lo hace tp_ping al usar la pantalla), así que una PC olvidada igual vence a las 12 h.
const SE_ACTUALIZAN = ['inicio', 'ventas', 'caja', 'reportes', 'historial', 'compras'];   // ninguna usa despues() (en compras, salvo cargar y config)
const CADA = 30 * 1000;
function editando() {
  const app = $('app'), a = document.activeElement;
  if (a && app.contains(a) && a.matches('input, select, textarea')) return true;
  const sel = window.getSelection && window.getSelection();
  if (sel && !sel.isCollapsed && app.contains(sel.anchorNode)) return true;      // está marcando texto para copiar
  return [...app.querySelectorAll('input, select, textarea')].some(el => {
    if (el.tagName === 'SELECT') { const def = [...el.options].findIndex(o => o.defaultSelected); return el.selectedIndex !== (def < 0 ? 0 : def); }
    if (el.type === 'checkbox' || el.type === 'radio') return el.checked !== el.defaultChecked;
    return el.value !== el.defaultValue;
  });
}
async function actualizarSola() {
  if (document.hidden || !usuario() || debeCambiar() || ST.html == null) return;
  const hash = location.hash, [ruta, arg] = (hash.slice(1) || 'inicio').split('/');
  const r = RUTAS[ruta];
  if (!SE_ACTUALIZAN.includes(ruta) || !r || (r.rol && !es(r.rol)) || editando()) return;
  if (ruta === 'compras' && /^(cargar|config)/.test(arg || '')) return;
  const n = ST.pintadas;
  let html;
  try { html = await r.f(arg); } catch (e) { return; }                     // sin internet: se reintenta en la próxima vuelta
  if (n !== ST.pintadas || location.hash !== hash || html === ST.html || editando()) return;
  const scroll = [...$('app').querySelectorAll('.tabla-scroll')].map(t => t.scrollLeft);
  ST.html = html;
  $('app').innerHTML = ST.avisoHtml + html;
  $('app').querySelectorAll('.tabla-scroll').forEach((t, i) => { t.scrollLeft = scroll[i] || 0; });
}

const productosCarrito = () => V.carrito.filter(i => !i.es_credito);

  return `<h1>Cargar productos de la venta rápida #${v.id}</h1>
  <div class="venta">
    ${columnaProductos()}
    <div class="panel">
      <h2>Lo que se cobró</h2>
      <p class="suave">${fc(v.fecha)} · vendió <b>${esc(v.vendedor || '—')}</b></p>
      <table>${v.pagos.map(p => `<tr><td>${esc(p.medio)}</td><td class="n">${fmt(p.monto)}</td></tr>`).join('')}
        <tr class="total"><td>Cobrado</td><td class="n">${fmt(v.total)}</td></tr></table>
      ${V.det.efectivo && +ST.ini.descuento ? `<p class="suave" style="font-size:13px">Se cobró en efectivo: los productos van con el ${+ST.ini.descuento}% de descuento (el chip, no).</p>` : ''}
      <p id="desc" class="suave" style="text-align:right;margin:12px 0 0"></p>
      <p class="suave" style="text-align:right;margin:0">Total de los productos</p>
      <div class="total-grande" id="total">$ 0</div>
      <p id="dif"></p>
      ${es('encargado') && !V.det.varios ? `<div id="ajustar-l" hidden><label style="display:flex;flex-direction:row;gap:8px;align-items:flex-start;margin-bottom:12px">
        <input type="checkbox" id="ajustar"> <span>Corregir lo cobrado: la venta pasa a ser el total de los productos (el monto de la venta rápida estaba mal)</span></label></div>` : ''}
      <button id="cobrar" onclick="guardarDetalle()">Guardar productos</button>
      <p id="estado" class="suave"></p>
    </div>
  </div>`;
}
function pintarDiferencia(t) {
  const r = t - V.det.total, hay = productosCarrito().length > 0, ok = hay && Math.abs(r) < 1;
  $('dif').innerHTML = !hay ? '<span class="suave">Buscá y agregá lo que se llevó el cliente.</span>'
    : ok ? '<span class="ok">✓ Coincide con lo cobrado.</span>'
    : `<span class="mal">${r > 0 ? `Los productos dan ${fmt(r)} más que lo cobrado.` : `Faltan ${fmt(-r)} en productos para llegar a lo cobrado.`}</span>
       <span class="suave">${es('encargado') ? (V.det.varios ? 'Ajustá los precios.' : 'Ajustá los precios o marcá «Corregir lo cobrado».') : 'Revisá lo cargado; si está bien, lo corrige un encargado.'}</span>`;
  if ($('ajustar-l')) $('ajustar-l').hidden = !hay || ok;
  if (ok) $('estado').textContent = '';
}
async function guardarDetalle() {
  if (!productosCarrito().length) { $('estado').innerHTML = '<span class="mal">Agregá lo que se llevó el cliente.</span>'; return; }
  if (!revisarCarrito()) return;
  const ajustar = !!($('ajustar') && $('ajustar').checked && !$('ajustar-l').hidden);
  if (Math.abs(totalFinal() - V.det.total) >= 1 && !ajustar) {
    $('estado').innerHTML = '<span class="mal">Los productos tienen que sumar lo cobrado.</span>'; return;
  }
  $('cobrar').disabled = true; $('estado').textContent = 'Guardando…';
  try {
    const r = await rpc('tp_venta_detallar', { ...U(), p_id: V.det.id, p_datos: { items: V.carrito, ajustar_total: ajustar } });
    avisar(`Venta #${V.det.id}: productos cargados (${fmt(r.total)}).`);
    V.det = null;
    ir(ST.volver && !ST.volver.startsWith('#detallar') ? ST.volver : '#ventas');
  } catch (e) {
    $('estado').innerHTML = `<span class="mal">${esc(e.message)}</span>`; $('cobrar').disabled = false;
  }
}

const F = { desde: null, hasta: null, suc: '' };     // filtros de ventas y reportes (se recuerdan mientras la página está abierta)

function filtroPeriodo(conSucursal, extra, campos) {

    ${conSucursal && global() ? `<label>Sucursal<select name="suc"><option value="">Todas</option>

    ${campos || ''}
    <button>Ver</button> ${extra || ''}
  </form>`;
}
const sucFiltro = () => global() ? (F.suc ? +F.suc : null) : sucActual();

async function vVentas() {

      conVendedor ? `<label>Vendedor<select name="vend" onchange="this.form.requestSubmit()"><option value="">Todos</option>
        ${vendedores.map(([id, n]) => `<option value="${id}" ${F.vend === id ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>` : '')}
    <div class="panel tabla-scroll">
      <p><b>${validas.filter(v => v.tipo === 'venta').length}</b> ventas${F.vend ? ` de <b>${esc((vendedores.find(([id]) => id === F.vend) || [])[1] || '')}</b>` : ''} · total <b>${fmt(total)}</b> <span class="suave">(ya descontados cambios y devoluciones)</span>
        ${validas.some(v => v.sin_detalle) ? ` · <span class="etiqueta sin-stock">⚠ ${validas.filter(v => v.sin_detalle).length} sin detallar</span>` : ''}</p>
      <table>
        <tr><th>#</th><th>Fecha</th><th>Sucursal</th><th>Vendedor</th><th>Detalle</th><th>Pago</th><th class="n">Total</th><th></th></tr>
        ${ventas.map(v => `<tr class="${v.anulada ? 'anulada' : ''}">
          <td>${v.id}</td><td>${fc(v.fecha)}</td><td>${esc(v.sucursal)}</td>
          <td id="vend-${v.id}">${esc(v.vendedor || '')}${!v.anulada && es('encargado') && v.sucursal_id ? ` <button class="sec chico" title="Cambiar el vendedor" aria-label="Cambiar el vendedor"
            onclick="elegirVendedor(${v.id},${v.sucursal_id},${v.vendedor_id || 'null'})">✎</button>` : ''}</td>
          <td>${v.tipo !== 'venta' ? `<span class="etiqueta rosa">${v.tipo === 'cambio' ? 'Cambio' : 'Devolución'} de #${v.venta_origen_id}</span> ` : ''}${esc(v.detalle || '')}
            ${v.sin_detalle && !v.anulada ? `<span class="etiqueta sin-stock">⚠ Venta rápida: falta detallar</span> <a class="boton chico" href="#detallar/${v.id}" onclick="recordarVuelta()">Detallar</a>` : ''}
            <span id="fac-${v.id}">${v.quiere_factura ? '<span class="etiqueta azul">🧾 Pidió factura</span>' : v.quiere_factura === false && es('encargado') ? '<span class="suave">Sin factura</span>' : ''}${!v.anulada && v.tipo === 'venta' && es('encargado')
              ? ` <button class="sec chico" title="Cambiar si lleva factura" aria-label="Cambiar si lleva factura" onclick="editarFactura(${v.id},${v.quiere_factura})">🧾 ✎</button>` : ''}</span>
            ${v.credito ? `<br><span class="etiqueta sin-stock" title="${esc(v.observaciones || '')}">Dif. por devolución</span> <span class="suave">${esc(v.observaciones || '')}</span>` : ''}
            ${v.cliente_id ? `<br><a class="suave" href="#cliente/${v.cliente_id}">${esc(v.cliente || 'Cliente')} · ${esc(telVisible(v.telefono))}</a>` : v.cliente ? `<br><span class="suave">${esc(v.cliente)}</span>` : ''}</td>
          <td id="pago-${v.id}">${v.medio_pago === 'Mixto' ? v.pagos.map(p => `${esc(p.medio)} ${fmt(p.monto)}`).join('<br>') : esc(v.medio_pago)}
            ${!v.anulada && es('encargado') ? ` <button class="sec chico" title="Corregir el medio de pago" aria-label="Corregir el medio de pago" onclick="editarPagos(${v.id})">✎</button>` : ''}
            ${+v.descuento ? `<br><span class="suave">desc. ${fmt(v.descuento)}</span>` : ''}</td>
          <td class="n">${fmt(v.total)}</td>
          <td class="acciones">
            <a class="boton sec chico" href="#ticket/${v.id}">Ticket</a>

// Cambiar si la venta lleva factura (022): encargado (su local), supervisor, dueño y superadmin. Queda en el historial.
function editarFactura(id, actual) {
  const op = [['', 'Sin marcar', null], ['si', 'Con factura', true], ['no', 'Sin factura', false]];
  $('fac-' + id).innerHTML = `<select id="fsel-${id}" aria-label="¿Lleva factura?">${op.map(([v, t, b]) => `<option value="${v}" ${b === actual ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <button class="chico" onclick="cambiarFactura(${id})">Guardar</button> <button class="sec chico" onclick="render()">✕</button>`;
  $('fsel-' + id).focus();
}
async function cambiarFactura(id) {
  const v = $('fsel-' + id).value;
  try { await rpc('tp_venta_factura', { ...U(), p_id: id, p_factura: v === '' ? null : v === 'si' }); avisar(`Venta #${id}: ${v === 'si' ? 'con factura' : v === 'no' ? 'sin factura' : 'sin marcar'}.`); }
  catch (e) { avisar(e.message, true); }
  render();
}
function elegirVendedor(id, suc, actual) {
  const lista = vendedoresDe(suc, true);
  if (actual && !lista.some(x => x.id === actual)) lista.unshift({ id: actual, nombre: (ST.ini.usuarios.find(x => x.id === actual) || {}).nombre || '(otro)' });
  $('vend-' + id).innerHTML = `<select id="vsel-${id}" aria-label="Vendedor">${lista.map(x => `<option value="${x.id}" ${x.id === actual ? 'selected' : ''}>${esc(x.nombre)}</option>`).join('')}</select>
    <button class="chico" onclick="cambiarVendedor(${id})">Guardar</button> <button class="sec chico" onclick="render()">✕</button>`;
  $('vsel-' + id).focus();
}
async function cambiarVendedor(id) {
  try { const r = await rpc('tp_venta_vendedor', { ...U(), p_id: id, p_vendedor: +$('vsel-' + id).value }); avisar(`Venta #${id}: ahora figura ${r.vendedor || 'el mismo vendedor'}.`); }
  catch (e) { avisar(e.message, true); }

}

// Corregir los medios de pago de una venta ya hecha (016): encargado (su local), supervisor, dueño y superadmin.
// El total no cambia: un medio, o varios que sumen el total.
const EP = {};
function editarPagos(id) {
  const v = (ST.ventasVista || []).find(x => x.id === id);
  if (!v) return;
  const pagos = v.pagos && v.pagos.length ? v.pagos : [{ medio: v.medio_pago, monto: v.total }];
  EP[id] = { total: +v.total, pagos: pagos.map(p => ({ medio: p.medio, monto: +p.monto })) };
  pintarEditorPagos(id);
}
function pintarEditorPagos(id) {
  const e = EP[id], varios = e.pagos.length > 1;
  $('pago-' + id).innerHTML = e.pagos.map((p, k) => `<div class="fila" style="gap:4px;margin-bottom:4px;flex-wrap:nowrap">
      <select aria-label="Medio de pago" onchange="EP[${id}].pagos[${k}].medio=this.value">${[...new Set([p.medio, ...MEDIOS_PAGO])].map(m => `<option ${m === p.medio ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select>
      ${varios ? `<input type="number" min="1" step="1" value="${p.monto || ''}" placeholder="$" style="width:95px" aria-label="Monto"
          oninput="EP[${id}].pagos[${k}].monto=+this.value||0;$('ep-falta-${id}').textContent=faltaPagos(${id})">
        <button class="sec chico" aria-label="Quitar este medio" onclick="EP[${id}].pagos.splice(${k},1);pintarEditorPagos(${id})">✕</button>` : ''}</div>`).join('')
    + `<div class="fila" style="gap:4px"><button class="sec chico" onclick="EP[${id}].pagos.push({medio:'Efectivo',monto:0});pintarEditorPagos(${id})">+ Medio</button>
       <button class="chico" onclick="guardarPagos(${id})">Guardar</button> <button class="sec chico" onclick="delete EP[${id}];render()">Cancelar</button></div>
       <small class="suave" id="ep-falta-${id}">${faltaPagos(id)}</small>`;
  $('pago-' + id).querySelector('select').focus();
}
function faltaPagos(id) {
  const e = EP[id];
  if (e.pagos.length < 2) return `Total ${fmt(e.total)}`;
  const r = e.total - e.pagos.reduce((s, p) => s + (+p.monto || 0), 0);
  return Math.abs(r) < 1 ? 'Cuadra con el total' : `${r > 0 ? 'Faltan' : 'Sobran'} ${fmt(Math.abs(r))} para el total de ${fmt(e.total)}`;
}
async function guardarPagos(id) {
  const e = EP[id];
  try {
    const r = await rpc('tp_venta_pagos', { ...U(), p_id: id, p_pagos: e.pagos.map(p => ({ medio: p.medio, monto: e.pagos.length > 1 ? p.monto : null })) });
    avisar(`Venta #${id}: medio de pago corregido (${r.medio_pago}).` +
           (r.caja_cerrada ? ' Ojo: la caja de esa venta ya estaba cerrada, así que su cierre ahora muestra los montos corregidos.' : ''));
    delete EP[id];
  } catch (err) { return alert(err.message); }
  render();
}

  render();
}

function buscarDev() {

}
function agregarDev(i) {
  const p = D.resultados[i];
  const ya = D.nuevos.find(x => x.producto_id === p.id);
  if (ya) ya.cantidad++; else D.nuevos.push({ producto_id: p.id, descripcion: p.descripcion, cantidad: 1, precio: +p.precio });
  $('buscar').value = ''; D.resultados = []; $('resultados').innerHTML = ''; pintarDev();
}
function pintarDev() {
  $('nuevos').innerHTML = D.nuevos.map((i, k) => `<tr><td>${esc(i.descripcion)}</td>
    <td class="n"><input type="number" min="1" value="${i.cantidad}" onchange="D.nuevos[${k}].cantidad=Math.max(1,+this.value||1);pintarDev()"></td>
    <td class="n">${fmt(i.cantidad * i.precio)}</td><td><button class="sec chico" onclick="D.nuevos.splice(${k},1);pintarDev()">✕</button></td></tr>`).join('');
  const devuelve = [...document.querySelectorAll('[data-item]')].reduce((s, el) => s + (+el.value || 0) * +el.dataset.precio, 0);
  const lleva = D.nuevos.reduce((s, i) => s + i.cantidad * i.precio, 0), dif = lleva - devuelve;
  $('t-devuelve').textContent = '−' + fmt(devuelve); $('t-lleva').textContent = fmt(lleva); $('total').textContent = fmt(dif);
  $('sentido').textContent = dif > 0 ? 'El cliente paga la diferencia' : dif < 0 ? 'Se le devuelve al cliente' : 'Sin diferencia';
}
async function confirmarDev() {
  const devolver = [...document.querySelectorAll('[data-item]')].map(el => ({ item_id: +el.dataset.item, cantidad: +el.value || 0 })).filter(d => d.cantidad > 0);
  $('confirmar').disabled = true;
  try {
    const d = await rpc('tp_devolucion', { ...U(), p_id: D.venta.venta.id, p_devolver: devolver, p_nuevos: D.nuevos, p_medio: $('medio').value });
    $('estado').innerHTML = `<span class="ok">Registrado como #${d.venta_id} (${fmt(d.total)}).</span><br><a href="#ticket/${d.venta_id}">Ver comprobante</a> · <a href="#ventas">Volver a ventas</a>`;
    document.querySelectorAll('[data-item]').forEach(el => el.disabled = true); $('confirmar').hidden = true;
  } catch (e) {
    $('estado').innerHTML = `<span class="mal">${esc(e.message)}</span>`; $('confirmar').disabled = false;

}

// Abrir la caja (023): con la cuenta del local hay que elegir qué vendedor la abre. «despues» = adónde ir al abrir.

// Pantalla que aparece al entrar con la cuenta del local y la caja cerrada (023)
async function vAbrirCaja() {
  const suc = sucActual();
  if (!suc) return '<div class="aviso">Elegí la sucursal arriba a la derecha.</div>';
  const d = await rpc('tp_caja', { ...U(), p_suc: suc });
  if (d.caja) return `<div class="aviso">La caja de ${esc(sucNombre(suc))} ya está abierta.</div><p><a class="boton" href="#inicio">Ir al inicio</a></p>`;
  return `<h1>Abrir la caja de ${esc(sucNombre(suc))}</h1>${formAbrirCaja(suc, '#inicio')}`;
}
// Control con el cierre Z de la fiscal (018): ventas sin efectivo contra el total Z que escribe el vendedor
const sinEfectivo = x => (x.medios || []).filter(m => m.medio !== 'Efectivo').reduce((s, m) => s + +m.total, 0);
// Lo que tiene que dar el Z (022): sin efectivo, menos transferencias y ventas con factura. Sin el SQL 022, como antes.
const paraZ = x => x.para_z == null ? sinEfectivo(x) : +x.para_z;
function difZ(z, sinEf) {
  if (z == null || z === '') return '<span class="suave">—</span>';
  const d = +z - sinEf;
  return Math.abs(d) < 1 ? `<span class="ok">${fmt(0)} ✓</span>` : `<span class="mal">${d > 0 ? '+' : '−'}${fmt(Math.abs(d))}</span>`;
}
function pintarZ(sinEf) {
  const v = $('cierre-z').value;
  $('z-dif').innerHTML = difZ(v === '' ? null : v, sinEf);
  $('z-estado').textContent = 'Sin guardar…';
}
async function guardarZ(el) {
  try {
    await rpc('tp_caja_z', { ...U(), p_suc: sucActual(), p_z: el.value === '' ? null : +el.value });
    el.defaultValue = el.value;                       // así la pantalla se puede volver a actualizar sola
    $('z-estado').innerHTML = '<span class="ok">Guardado ✓</span>';
  } catch (e) { $('z-estado').innerHTML = `<span class="mal">${esc(e.message)}</span>`; }
}
// Cuadro de la caja (016): ventas e importe por vendedor y cuántos hydrogel vendió cada uno en el turno
function tablaVendedoresCaja(lista) {
  if (!lista) return '<p class="suave">Falta actualizar la base (SQL 016).</p>';
  if (!lista.length) return '<p class="suave">Sin ventas todavía.</p>';
  const t = lista.reduce((a, v) => ({ ventas: a.ventas + +v.ventas, total: a.total + +v.total, hydros: a.hydros + +v.hydros }), { ventas: 0, total: 0, hydros: 0 });
  return `<table><tr><th>Vendedor</th><th class="n">Ventas</th><th class="n">Importe</th><th class="n">Hydrogel</th></tr>
    ${lista.map(v => `<tr><td>${esc(v.vendedor)}</td><td class="n">${v.ventas}</td><td class="n">${fmt(v.total)}</td><td class="n"><b>${v.hydros}</b></td></tr>`).join('')}
    ${lista.length > 1 ? `<tr class="total"><td>Total</td><td class="n">${t.ventas}</td><td class="n">${fmt(t.total)}</td><td class="n">${t.hydros}</td></tr>` : ''}
  </table>`;
}
// Corregir la apertura (021): encargado, supervisor, dueño o superadmin. Queda en el historial.
function editarApertura(actual) {

async function accionCaja(fn, args, ok) {
  try { await rpc(fn, { ...U(), p_suc: sucActual(), ...args }); if (ok) avisar(ok); }
  catch (e) { avisar(e.message, true); }

}
// Antes de cerrar (v22): resumen para confirmar (efectivo esperado y contado, cierre Z). Si el Z quedó sin guardar, se guarda primero.
async function confirmarCierre(f, esperado, sinEf) {
  const z = $('cierre-z');
  if (z && z.value !== z.defaultValue) await guardarZ(z);
  const contado = numero(f.contado.value), dif = contado - esperado;
  const lineaZ = !z || z.value === '' ? '⚠ Todavía no cargaste el total del cierre Z.'
    : `Tiene que dar el Z ${fmt(sinEf)} · cierre Z ${fmt(+z.value)} · diferencia ${fmt(+z.value - sinEf)}`;
  if (!confirm(`¿Seguro que querés cerrar la caja de ${sucNombre(sucActual())}?\n\n` +
               `Efectivo que debería haber: ${fmt(esperado)}\nEfectivo contado: ${fmt(contado)}\n` +
               `Diferencia: ${Math.abs(dif) < 1 ? fmt(0) + ' (cuadra)' : (dif > 0 ? 'sobran ' : 'faltan ') + fmt(Math.abs(dif))}\n\n${lineaZ}`)) return;
  cerrarCaja(contado, f.obs.value);
}
// Al cerrar la caja se manda el respaldo del día por mail (si está configurado en Config)
async function cerrarCaja(contado, obs) {
  try {
    const r = await rpc('tp_caja_cerrar', { ...U(), p_suc: sucActual(), p_contado: contado, p_obs: obs });
    avisar('Caja cerrada. ' + (ST.ini.respaldo ? await enviarRespaldo(r.caja_id) : 'El respaldo por mail no está configurado (Config).'));
  } catch (e) { avisar(e.message, true); }
  render();
}
async function enviarRespaldo(cajaId) {
  try {
    const r = await rpc('tp_respaldo_caja', { ...U(), p_caja: cajaId });
    if (!r.url) return 'El respaldo por mail no está configurado (Config).';
    const c = r.caja, x = r.detalle, k = x.clases;
    const resumen = [`TechPoint · ${r.sucursal} · cierre de caja del ${c.fecha}`,
      `Abrió ${c.abierta_por || '—'} (${c.abierta_en}) · cerró ${c.cerrada_por || '—'} (${c.cerrada_en || '—'})`, '',
      `Ventas del turno: ${fmt(x.total_ventas)}`, ...x.medios.map(m => `  ${m.medio}: ${fmt(m.total)} (${m.n})`), '',
      ...(x.vendedores && x.vendedores.length ? ['Por vendedor:', ...x.vendedores.map(v => `  ${v.vendedor}: ${v.ventas} ventas · ${fmt(v.total)} · ${v.hydros} hydrogel`), ''] : []),
      `Apertura ${fmt(c.apertura)} + efectivo ${fmt(x.efectivo)} + ingresos ${fmt(x.ingresos)} − egresos ${fmt(x.egresos)}`,
      `Esperado ${fmt(x.esperado)} · contado ${fmt(c.cierre_contado)} · diferencia ${fmt(x.diferencia)}`,
      `Ventas sin efectivo ${fmt(sinEfectivo(x))}` + (x.para_z == null ? '' : ` − transferencias ${fmt(x.transferencias)} − con factura ${fmt(x.con_factura)} = tiene que dar el Z ${fmt(paraZ(x))}`),
      `Cierre Z ${c.cierre_z == null ? 'no cargado' : fmt(c.cierre_z) + ' · diferencia ' + fmt(+c.cierre_z - paraZ(x))}`,
      `Originales: ${k.original.unidades} u. (${fmt(k.original.importe)}) · Genéricos: ${k.generico.unidades} u. (${fmt(k.generico.importe)})` +
        (k.sin_definir.unidades ? ` · Sin definir: ${k.sin_definir.unidades} u.` : ''),
      ...(c.observaciones ? ['', 'Observaciones: ' + c.observaciones] : [])].join('\n');
    const enc = ['Venta', 'Fecha', 'Vendedor', 'Tipo', 'Medio de pago', 'Producto', 'Cantidad', 'Precio unitario', 'Subtotal', 'Estado', 'Teléfono', 'Observaciones'];
    const csv = '﻿' + [enc, ...r.ventas].map(f => f.map(celdaCsv).join(';')).join('\r\n');
    await fetch(r.url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ clave: r.clave, asunto: `TechPoint · ${r.sucursal} · cierre ${c.fecha}`, resumen, csv,
                             archivo: `caja_${r.sucursal.replace(/\W+/g, '-')}_${c.fecha}.csv` }) });
    return 'Respaldo enviado por mail.';
  } catch (e) { return 'No se pudo enviar el respaldo por mail: ' + e.message + '. Probá con "Reenviar respaldo".'; }
}
// Tabla de originales / genéricos (unidades, importe y % sobre lo clasificado)
function tablaClases(k) {
  if (!k) return '';
  const tu = k.original.unidades + k.generico.unidades, ti = +k.original.importe + +k.generico.importe;
  const fila = (t, c) => `<tr><td>${t}</td><td class="n">${c.unidades} u.</td><td class="n">${tu ? pct(c.unidades / tu * 100) : '—'}</td><td class="n">${fmt(c.importe)}</td><td class="n">${ti ? pct(c.importe / ti * 100) : '—'}</td></tr>`;
  return `<table class="clases"><tr><th></th><th class="n">Unid.</th><th class="n">%</th><th class="n">Importe</th><th class="n">%</th></tr>
    ${fila('Originales', k.original)}${fila('Genéricos', k.generico)}
    ${k.sin_definir.unidades ? `<tr><td class="alerta">Sin definir</td><td class="n">${k.sin_definir.unidades} u.</td><td></td><td class="n">${fmt(k.sin_definir.importe)}</td><td></td></tr>` : ''}</table>`;
}
const pctOriginales = k => { const tu = k ? k.original.unidades + k.generico.unidades : 0; return tu ? pct(k.original.unidades / tu * 100) : '—'; };

// ---------------------------------------------------------------- clientes

// Precio masivo: por porcentaje o monto fijo, a los productos marcados (igual cuenta que la base)
async function cambiarPrecios(f) {
  if (!P.marcados.size) return alert('Marcá al menos un producto.');
  const modo = f.modo.value, paso = +f.redondeo.value, valor = +f.sentido.value * Math.abs(numero(f.valor.value));
  if (!valor) return alert('Poné cuánto querés subir o bajar.');
  if (modo === 'porcentaje' && valor <= -100) return alert('No se puede bajar 100 % o más.');
  const nuevo = p => Math.max(0, Math.round((modo === 'porcentaje' ? +p.precio * (1 + valor / 100) : +p.precio + valor) / paso) * paso);
  const elegidos = P.filas.filter(p => P.marcados.has(p.id) && p.codigo !== COD_DIFERENCIA);
  if (!elegidos.length) return alert('«Diferencia por devolución» no tiene precio fijo: marcá otros productos.');
  const cuanto = modo === 'porcentaje' ? `${Math.abs(valor)} %` : fmt(Math.abs(valor));
  const ej = elegidos.slice(0, 3).map(p => `• ${p.descripcion}: ${fmt(p.precio)} → ${fmt(nuevo(p))}`).join('\n');
  if (!confirm(`Vas a ${valor > 0 ? 'SUBIR' : 'BAJAR'} ${cuanto} el precio de ${elegidos.length} productos.\n\nPor ejemplo:\n${ej}\n\n¿Seguir?`)) return;
  try {
    const r = await rpc('tp_productos_precio', { ...U(), p_ids: elegidos.map(p => p.id), p_modo: modo, p_valor: valor, p_redondeo: paso });
    avisar(`Precio actualizado en ${r.n} productos (${valor > 0 ? '+' : '−'}${cuanto}).`);
  } catch (e) { avisar(e.message, true); }
  render();
}

  catch (e) { avisar(e.message, true); }
  render();
}

// La pistola lectora escribe el código y manda Enter: abre el producto, o lo crea con ese código
async function buscarPorCodigo(cod) {
  if (!cod) return;
  const cat = await rpc('tp_catalogo', { p_suc: null });
  const p = cat.find(x => tieneCodigo(x, cod));
  if (p) return ir('#producto/' + p.id);
  if (!es('dueno')) { avisar(`No hay ningún producto con el código ${cod}.`, true); return render(); }
  ST.codigoNuevo = cod; avisar(`El código ${cod} no está cargado: completá los datos para crearlo.`); ir('#producto/nuevo');
}

function leerCsv(texto) {
  const delim = (texto.match(/;/g) || []).length >= (texto.match(/,/g) || []).length ? ';' : ',';
  const filas = []; let fila = [], celda = '', comillas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (comillas) { if (c === '"' && texto[i + 1] === '"') { celda += '"'; i++; } else if (c === '"') comillas = false; else celda += c; }
    else if (c === '"') comillas = true;
    else if (c === delim) { fila.push(celda); celda = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && texto[i + 1] === '\n') i++; fila.push(celda); filas.push(fila); fila = []; celda = ''; }
    else celda += c;
  }
  if (celda || fila.length) { fila.push(celda); filas.push(fila); }
  const enc = (filas.shift() || []).map(h => h.trim().toLowerCase());
  return filas.map(f => Object.fromEntries(enc.map((h, i) => [h, (f[i] || '').trim()])));
}
async function importarCsv(archivo) {
  if (!archivo) return;
  const texto = (await archivo.text()).replace(/^﻿/, '');
  const claseDe = f => {
    const c = (f.clase || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    if (c.startsWith('orig')) return 'original';
    if (c.startsWith('gen')) return 'generico';
    const o = (f.original || '').toLowerCase();
    return ['1', 'si', 'sí', 'x'].includes(o) ? 'original' : ['0', 'no'].includes(o) ? 'generico' : null;
  };
  const filas = leerCsv(texto).filter(f => f.descripcion).map(f => ({
    codigo: f.codigo || null, descripcion: f.descripcion, categoria: f.categoria || 'Otro', marca: f.marca || 'Universal',
    modelo: f.modelo || '', precio: numero(f.precio), costo: numero(f.costo), clase: claseDe(f) }));
  try { const r = await rpc('tp_productos_importar', { ...U(), p_filas: filas }); avisar(`${r.n} productos importados.`); }
  catch (e) { avisar(e.message, true); }
  render();
}

        <span class="suave" style="font-size:12px;font-weight:500">Otros códigos de barras del mismo producto (los originales suelen traer varios en la caja)</span>
        ${duenio ? `<div class="fila" style="align-items:center;margin-top:5px">
          <input id="cod-extra" autocomplete="off" placeholder="Escaneá otro código acá" aria-label="Otro código de barras" style="min-width:240px">
          <button type="button" class="sec" onclick="sumarCodigo()">Agregar</button></div>` : ''}

        <p id="codigo-aviso" class="suave" style="margin:6px 0 0;font-size:13px"></p>

// Medios de pago: total con %, Mercado Pago abierto en QR / cuotas y, con todos los locales, cada medio por local
const ORDEN_MEDIOS = ['Efectivo', 'Débito', ...OPCIONES_CREDITO.map(o => 'Crédito ' + o), 'Crédito', 'Transferencia', ...OPCIONES_MP.map(o => 'Mercado Pago ' + o), 'Mercado Pago'];
const ordenMedio = m => (ORDEN_MEDIOS.indexOf(m) + 1) || 99;
function panelMedios(r, sid) {
  const medios = [...r.medios].sort((a, b) => ordenMedio(a.medio) - ordenMedio(b.medio));
  const total = medios.reduce((s, m) => s + +m.total, 0);
  const pctDe = x => total ? `${Math.round(x / total * 100)} %` : '—';
  // Crédito (1, 2, 3, 6 pagos) y Mercado Pago (QR, 3, 6 cuotas): un renglón con el total y abajo cada opción
  const grupoDe = m => ['Crédito', 'Mercado Pago'].find(g => m === g || m.startsWith(g + ' '));
  const fila = (m, sub) => `<tr><td>${sub ? `<span class="suave">↳</span> ${esc(m.medio.replace(sub, '').trim() || 'sin detalle (ventas anteriores)')}` : esc(m.medio)}</td>
    <td class="n">${m.ventas}</td><td class="n">${fmt(m.total)}</td><td class="n">${pctDe(+m.total)}</td></tr>`;
  const filas = [];
  medios.forEach(m => {
    const g = grupoDe(m.medio);
    if (!g) return filas.push(fila(m));
    const del = medios.filter(x => grupoDe(x.medio) === g);
    if (m === del[0]) {
      const t = del.reduce((s, x) => s + +x.total, 0), n = del.reduce((s, x) => s + +x.ventas, 0);
      filas.push(`<tr><td><b>${g}</b></td><td class="n">${n}</td><td class="n"><b>${fmt(t)}</b></td><td class="n"><b>${pctDe(t)}</b></td></tr>`);
    }
    filas.push(fila(m, g));
  });
  // Por local: una columna por medio que tuvo movimiento
  const porSuc = !sid && r.medios_suc ? r.medios_suc : [];
  const cols = medios.map(m => m.medio);
  const locales = [...new Set(porSuc.map(x => x.sucursal))];
  const celda = (s, m) => porSuc.find(x => x.sucursal === s && x.medio === m);
  return `<div class="panel tabla-scroll"><h2>Medios de pago <span class="suave">· ${fmt(total)}</span></h2>
    <p class="suave">Lo cobrado por cada medio (en un pago dividido, cada parte cuenta en su medio).</p>
    <table><tr><th>Medio</th><th class="n">Ventas</th><th class="n">Importe</th><th class="n">% del total</th></tr>
      ${filas.join('') || '<tr><td colspan="4" class="suave">Sin ventas en el período.</td></tr>'}
      ${medios.length ? `<tr><td><b>Total</b></td><td></td><td class="n"><b>${fmt(total)}</b></td><td class="n">100 %</td></tr>` : ''}
    </table>
    ${locales.length > 1 ? `<h3 style="margin-top:18px">Por local</h3>
    <table><tr><th>Local</th>${cols.map(c => `<th class="n">${esc(c)}</th>`).join('')}<th class="n">Total</th></tr>
      ${locales.map(s => `<tr><td>${esc(s)}</td>${cols.map(c => `<td class="n">${celda(s, c) ? fmt(celda(s, c).total) : '—'}</td>`).join('')}
        <td class="n"><b>${fmt(porSuc.filter(x => x.sucursal === s).reduce((t, x) => t + +x.total, 0))}</b></td></tr>`).join('')}
    </table>` : ''}

}
// Atajos de período y secciones que se pueden ocultar (se recuerda en este navegador)
const DIAS_SEM = ['', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const iso = d => d.toISOString().slice(0, 10);
const sumarDias = (s, n) => { const d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const ddmm = s => `${s.slice(8, 10)}/${s.slice(5, 7)}`;
function rangoAtajo(k) {
  const h = hoy(), d = new Date(h + 'T12:00:00Z'), m1 = h.slice(0, 8) + '01';
  const dow = (d.getUTCDay() + 6) % 7;                                    // 0 = lunes

  return { hoy: [h, h], ayer: [sumarDias(h, -1), sumarDias(h, -1)], semana: [sumarDias(h, -dow), h], '7': [sumarDias(h, -6), h],
           mes: [m1, h], pasado: [finMesPasado.slice(0, 8) + '01', finMesPasado], '30': [sumarDias(h, -29), h], anio: [h.slice(0, 5) + '01-01', h] }[k];

const barra = (v, max, titulo) => `<div class="barra-dato" title="${esc(titulo)}"><i style="width:${max > 0 && v > 0 ? Math.max(2, v / max * 100) : 0}%"></i></div>`;

function variacion(ahora, antes) {
  ahora = +ahora; antes = +antes;
  if (!antes) return '<span class="var suave">sin datos del período anterior</span>';
