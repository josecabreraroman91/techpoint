<style>
/* TechPoint — estética basada en el logo: fondo negro, guion rosa, punto azul cuadrado. (Mismo estilo que el sistema Flask.) */
:root {
  --negro: #000; --fondo: #050507; --panel: #0e0e13; --panel-2: #16161d; --borde: #23232c; --borde-2: #33333f;
  --texto: #f3f3f6; --suave: #8c8c9a;
  --rosa: #ff1a8c; --rosa-2: rgba(255, 26, 140, .14);
  --azul: #2b3fe0; --azul-claro: #7c8aff; --azul-2: rgba(43, 63, 224, .18);
  --ok: #2bd88f; --mal: #ff5a63; --alerta: #ffb84d;
  --radio: 6px; --radio-chico: 3px;
  --display: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cuerpo: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--fondo); }
body { margin: 0; font: 15px/1.5 var(--cuerpo); background: var(--fondo); color: var(--texto); -webkit-font-smoothing: antialiased; }
a { color: var(--azul-claro); text-decoration: none; }
a:hover { color: #fff; }
::selection { background: var(--rosa); color: #fff; }

h1, h2, h3 { font-family: var(--display); font-weight: 500; letter-spacing: -.01em; }
h1 { font-size: 26px; margin: 0 0 20px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h1::before { content: ""; width: 18px; height: 4px; background: var(--rosa); flex: none; align-self: flex-end; margin-bottom: 7px; }
h2 { font-size: 16px; margin: 0 0 14px; }
h3 { font-size: 12px; margin: 18px 0 8px; color: var(--suave); text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }
h3::before { content: "_"; color: var(--rosa); margin-right: 4px; }

.marca, .marca-acceso { font-family: var(--display); font-weight: 400; color: #fff; letter-spacing: -.01em; white-space: nowrap; line-height: 1.2; }
.marca { font-size: 21px; display: inline-block; }
.marca:hover { color: #fff; }
.marca i, .marca-acceso i { display: inline-block; font-style: normal; vertical-align: baseline; }

.marca .punto, .marca-acceso .punto { width: .2em; height: .2em; background: var(--azul); margin-left: .12em; }
.marca span, .marca-acceso span { font-family: var(--cuerpo); font-size: 11px; font-weight: 600; color: var(--suave); text-transform: uppercase; letter-spacing: .14em; display: inline-block; vertical-align: .35em; margin-left: 10px; border-left: 1px solid var(--borde-2); padding-left: 10px; line-height: 1.3; }

.barra { display: flex; align-items: center; gap: 22px; padding: 12px 24px; background: rgba(0, 0, 0, .88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--borde); }
.barra nav { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; }
.barra nav a { color: #a9a9b6; padding: 7px 11px; border-radius: var(--radio-chico); font-size: 14px; font-weight: 500; position: relative; }
.barra nav a:hover { background: var(--panel-2); color: #fff; }
.barra nav a.activo { color: #fff; background: transparent; }
.barra nav a.activo::after { content: ""; position: absolute; left: 11px; right: 11px; bottom: 1px; height: 3px; background: var(--rosa); }
.sesion { display: flex; gap: 8px; align-items: center; }
.sesion select { background: var(--panel-2); color: #fff; border: 1px solid var(--borde-2); font-size: 14px; }

main { max-width: 1250px; margin: 0 auto; padding: 30px 24px 70px; }
.aviso { background: var(--azul-2); border: 1px solid rgba(124, 138, 255, .35); border-left: 3px solid var(--azul); padding: 11px 15px; border-radius: var(--radio); margin-bottom: 16px; }
.aviso.error { background: rgba(255, 90, 99, .1); border-color: rgba(255, 90, 99, .4); border-left-color: var(--mal); }
.panel { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio); padding: 20px; margin-bottom: 20px; }
.grilla { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); margin-bottom: 20px; }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--borde); vertical-align: top; }

input, select, textarea, button { font: inherit; padding: 8px 11px; border: 1px solid var(--borde-2); border-radius: var(--radio); background: var(--fondo); color: var(--texto); }
input::placeholder, textarea::placeholder { color: #5f5f6c; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--azul); outline-offset: -1px; border-color: var(--azul); }
input[type=checkbox], input[type=radio] { accent-color: var(--rosa); }
button, .boton { background: var(--rosa); color: #fff; border: 1px solid var(--rosa); cursor: pointer; padding: 8px 16px; border-radius: var(--radio); display: inline-block; font-weight: 600; transition: background .15s, border-color .15s, transform .05s; }
button:hover, .boton:hover { background: #ff3d9e; color: #fff; }
button:active, .boton:active { transform: translateY(1px); }
button:focus-visible, .boton:focus-visible { outline: 2px solid var(--azul-claro); outline-offset: 2px; }

button.sec, .boton.sec { background: transparent; color: var(--texto); border-color: var(--borde-2); }
button.sec:hover, .boton.sec:hover { background: var(--panel-2); border-color: #4a4a58; }
button.peligro { background: transparent; color: var(--mal); border-color: rgba(255, 90, 99, .5); }
button.peligro:hover { background: var(--mal); color: #fff; }

.fila { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }

.suave { color: var(--suave); }
.ok { color: var(--ok); } .mal { color: var(--mal); } .alerta { color: var(--alerta); }
.etiqueta { font-size: 11px; padding: 2px 7px; border-radius: var(--radio-chico); background: var(--panel-2); border: 1px solid var(--borde-2); color: #b9b9c6; white-space: nowrap; font-weight: 500; }
.etiqueta.rosa { background: var(--rosa-2); border-color: rgba(255, 26, 140, .4); color: #ff7ab9; }
.etiqueta.sin-stock { background: rgba(255, 184, 77, .12); border-color: rgba(255, 184, 77, .45); color: var(--alerta); }
.etiqueta.azul { background: var(--azul-2); border-color: rgba(124, 138, 255, .45); color: var(--azul-claro); }
.tilde { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 50%; background: var(--azul); color: #fff; font-size: 11px; font-weight: 700; margin-right: 6px; vertical-align: 1px; flex: none; }
.clase-btn { cursor: pointer; font: inherit; }
.clase-btn:hover { border-color: var(--azul-claro); }
.credito td { color: var(--alerta); }
.cliente-ok { font-size: 13px; color: var(--ok); margin: 4px 0 0; }
.locales { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.locales label { flex-direction: row !important; align-items: center; gap: 5px !important; color: var(--texto) !important; }
.clases td.n b { font-family: var(--display); }
.modelo-cel { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.modelo-cel select, .modelo-cel input { padding: 4px 6px; font-size: 13px; }
.modelo-cel input { flex: 1; min-width: 110px; }
.modelo-cel .falta, .precio.falta { border-color: var(--mal); }
td.acciones { white-space: nowrap; }
input[readonly] { opacity: .65; cursor: not-allowed; }
details summary { cursor: pointer; }
details.panel summary b { font-weight: 500; }

.barra-prog { height: 6px; background: var(--panel-2); overflow: hidden; min-width: 100px; }
.barra-prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--rosa), var(--azul)); }
.barra-prog i.ok { background: var(--ok); }

.venta { display: grid; grid-template-columns: 1fr 380px; gap: 20px; align-items: start; }
.venta > .panel { position: sticky; top: 76px; border-top: 3px solid var(--rosa); }
@media (max-width: 900px) { .venta { grid-template-columns: 1fr; } .venta > .panel { position: static; } }
#buscar { width: 100%; font-size: 17px; padding: 14px 16px; background: var(--fondo); }
.resultados { margin-top: 8px; max-height: 420px; overflow: auto; }
.resultado { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: var(--radio); cursor: pointer; border-left: 3px solid transparent; }
.resultado:hover { background: var(--panel-2); }
.resultado.sel { background: var(--rosa-2); border-left-color: var(--rosa); }
.carrito td input { width: 70px; padding: 4px 6px; }
.carrito td input.precio { width: 100px; }
.total-grande { font-family: var(--display); font-size: 40px; font-weight: 500; text-align: right; margin: 16px 0; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.total-grande::after { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--azul); margin-left: 5px; }
.medios { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0; }
.medios label { border: 1px solid var(--borde-2); border-radius: var(--radio); padding: 9px 6px; text-align: center; cursor: pointer; font-size: 14px; color: #c4c4cf; }
.medios label:hover { border-color: #4a4a58; color: #fff; }

.medios.mp label { padding: 6px; font-size: 13px; }
.medios label:has(input:checked) { background: var(--azul); color: #fff; border-color: var(--azul); }
#cobrar { width: 100%; font-size: 18px; padding: 14px; font-family: var(--display); font-weight: 500; }

.chip { background: var(--panel-2); border: 1px solid var(--borde-2); padding: 6px 11px; border-radius: var(--radio); font-size: 14px; }
.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.cats button { background: var(--panel-2); border: 1px solid var(--borde-2); color: var(--texto); padding: 6px 11px; font-size: 13px; font-weight: 500; }
.cats button.activa { background: var(--azul); border-color: var(--azul); color: #fff; }
.cats button span { opacity: .65; margin-left: 4px; }
tr.grupo td { background: var(--panel-2); font-family: var(--display); font-weight: 600; padding-top: 10px; }
select.cat-fila { padding: 3px 6px; font-size: 13px; max-width: 150px; }
.menu-usuario { position: relative; }
.menu-usuario summary { cursor: pointer; list-style: none; padding: 6px 11px; border-radius: var(--radio); background: var(--panel-2); border: 1px solid var(--borde-2); font-size: 14px; }
.menu-usuario summary:hover { border-color: #4a4a58; }
.menu-usuario summary::-webkit-details-marker { display: none; }
.menu-usuario summary small { color: var(--rosa); margin-left: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.menu-usuario > div { position: absolute; right: 0; top: 42px; background: var(--panel); color: var(--texto); border: 1px solid var(--borde-2); border-radius: var(--radio); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 240px; box-shadow: 0 16px 40px rgba(0, 0, 0, .6); }
.menu-usuario label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--suave); }

.acceso { max-width: 420px; margin: 9vh auto 40px; display: flex; flex-direction: column; gap: 14px; padding: 32px 28px; background: var(--panel); text-align: center; }
.marca-acceso { font-size: 40px; text-align: center; margin: 4px 0 14px; }
.marca-acceso span { display: block; border: 0; margin: 12px 0 0; padding: 0; }
.marca-acceso .guion { animation: cursor 1.1s steps(1) infinite; }
@keyframes cursor { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .marca-acceso .guion { animation: none; } }

@media (max-width: 700px) {
  .barra { gap: 10px; padding: 10px 14px; }
  .barra nav { flex: none; flex-wrap: nowrap; overflow-x: auto; margin: 0 -14px; padding: 0 8px; width: calc(100% + 28px); scrollbar-width: none; }
  .barra nav a { white-space: nowrap; }
  main { padding: 20px 14px 50px; }
  .sesion { width: 100%; justify-content: space-between; }
  h1 { font-size: 22px; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { padding: 12px 14px 14px; }
  .kpi b { font-size: 20px; }
  .total-grande { font-size: 34px; }
}

.sandbox { background: repeating-linear-gradient(-45deg, var(--azul), var(--azul) 12px, #2235c4 12px, #2235c4 24px); color: #fff; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 5px 10px; }

/* Ticket no fiscal para impresora térmica (58 u 80 mm) */
.tk-controles { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 0 0 14px; }
.tk-controles .wsp { background: #1f8f4e; border-color: #1f8f4e; }
.papel { --ancho: 72mm; width: var(--ancho); max-width: 100%; margin: 0 auto 30px; background: #fff; color: #000; padding: 4mm 3mm; box-shadow: 0 10px 30px rgba(0,0,0,.5); font: 12px/1.35 "Courier New", ui-monospace, monospace; }
.papel.t58 { --ancho: 48mm; }
.papel .centro { text-align: center; }
.papel .tk-marca { font: 400 20px "Lexend", system-ui, sans-serif; letter-spacing: -.01em; }
.papel .tk-marca i { display: inline-block; width: .78em; height: .14em; background: #000; vertical-align: -.16em; margin-right: .1em; }
.papel .tk-marca b { display: inline-block; width: .2em; height: .2em; background: #000; margin-left: .1em; }
.papel hr { border: 0; border-top: 1px dashed #000; margin: 6px 0; }
.papel table { font-variant-numeric: normal; }
.papel td { padding: 1px 0; border: 0; color: #000; }
.papel tr:hover td { background: none; }

@media print {
  :root { --fondo: #fff; --panel: #fff; --panel-2: #f2f2f2; --borde: #ccc; --borde-2: #bbb; --texto: #000; --suave: #555; color-scheme: light; }
  html, body { background: #fff; color: #000; }
  .barra, .sandbox, .no-imprimir, .tk-controles { display: none !important; }
  .panel, .kpi { border: 0; padding: 0; }
  .kpi::before { display: none; }

<body>
<div id="franja"></div>
<header class="barra" id="barra" hidden></header>
<main id="app"><div class="acceso panel"><div class="marca-acceso"><i class="guion"></i>techpoint<i class="punto"></i><span>sistema de ventas</span></div><p class="suave">Cargando…</p></div></main>

<script>
/* =====================================================================
   TechPoint · sistema de ventas en un solo archivo
   Datos: Supabase "orbe-clientes", esquema techpoint, sólo por funciones tp_*.
   Todo lo que mueve plata o stock lo hace la base (todo o nada).
   Por ahora sin pantalla de login: se elige "con qué usuario entrar" arriba a la derecha.
   ===================================================================== */
const VERSION = 'v11';
const NUBE = { url: 'https://oishkxlodwxfaskodafo.supabase.co', key: 'sb_publishable_apIt6AE-7gax1X6QWjdVZQ_QtAIoOhM' };
const MEDIOS = ['Efectivo', 'Débito', 'Crédito', 'Transferencia', 'Mercado Pago'];
// Mercado Pago se cobra con una de estas opciones (008): se guarda como "Mercado Pago QR", etc.
const OPCIONES_MP = ['QR', '3 cuotas', '6 cuotas'];
const MEDIOS_PAGO = [...MEDIOS.filter(m => m !== 'Mercado Pago'), ...OPCIONES_MP.map(o => 'Mercado Pago ' + o)];
const CATEGORIAS = ['Funda', 'Flip cover', 'Vidrio templado', 'Cargador', 'Cable', 'Auricular', 'Parlante', 'Soporte',
                    'Adaptador', 'Power bank', 'Memoria', 'Smartwatch', 'Tablet', 'Computación', 'Gamer', 'Otro'];
// Las de la lista fija más las que creó el dueño (texto libre), con "Otro" al final
const listaCategorias = filas => {
  const extra = [...new Set(filas.map(p => p.categoria))].filter(c => !CATEGORIAS.includes(c)).sort((a, b) => a.localeCompare(b));
  return [...CATEGORIAS.slice(0, -1), ...extra, 'Otro'];
};
const opcionesCategoria = (actual, cats = ST.cats || CATEGORIAS) =>
  cats.map(c => `<option ${actual === c ? 'selected' : ''}>${esc(c)}</option>`).join('') + '<option value="__nueva">+ Nueva categoría…</option>';
// Si eligió "+ Nueva categoría…", pide el nombre; devuelve la categoría elegida o null si canceló
function elegirCategoria(sel) {
  if (sel.value !== '__nueva') return sel.value;
  const nueva = (prompt('Nombre de la categoría nueva (por ejemplo: Accesorios auto)') || '').trim().slice(0, 40);
  if (!nueva) { sel.value = sel.dataset.antes || ''; return null; }
  if (![...sel.options].some(o => o.value === nueva)) sel.add(new Option(nueva, nueva), sel.options.length - 1);
  sel.value = nueva; return nueva;
}
const MARCAS = ['Samsung', 'iPhone', 'Motorola', 'Xiaomi', 'Otra', 'Universal'];
const MARCAS_PRINCIPALES = ['Samsung', 'iPhone', 'Motorola'];
const NOMBRE_ROL = { vendedor: 'Vendedor', encargado: 'Encargado', supervisor: 'Supervisor', dueno: 'Dueño', superadmin: 'Superadministrador' };
// Escalera: superadmin (5) > dueño (4) > supervisor (3, encargado en todos los locales) > encargado (2) > vendedor (1).
// Dueño y superadmin manejan usuarios y permisos; al dueño y a los superadmin sólo los maneja un superadmin.
const NIVEL = { vendedor: 1, encargado: 2, supervisor: 3, dueno: 4, superadmin: 5 };
const CLASES = { original: 'Original', generico: 'Genérico' };
// Tilde azul delante de los productos originales
const tilde = clase => clase === 'original' ? '<span class="tilde" title="Original" aria-label="Original">✓</span>' : '';
// Producto «Diferencia por devolución» (006): el vendedor escribe el monto y se suma a la venta (sin descuento en efectivo)
const COD_DIFERENCIA = 'DIF-DEV';
// Fundas, flip covers y protectores (vidrio / hydrogel): al vender se carga la marca y el modelo del celular
const PIDE_MODELO = ['Funda', 'Flip cover', 'Vidrio templado'];
const MARCAS_CEL = ['Samsung', 'iPhone', 'Motorola', 'Xiaomi', 'Otra'];
const MESES = ['', 'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

let sb = null;
const ST = { ini: null, uid: null, suc: null, aviso: null };

// ---------------------------------------------------------------- utilidades
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => ((+n || 0) < 0 ? '-$ ' : '$ ') + Math.round(Math.abs(+n || 0)).toLocaleString('es-AR');
const pct = n => n == null ? '—' : Math.round(n) + '%';
const fc = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)} ${s.slice(11, 16)}` : '';
const guardar = (k, v) => { try { localStorage.setItem('tp-' + k, JSON.stringify(v)); } catch (e) {} };
const leer = (k, def) => { try { const v = localStorage.getItem('tp-' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } };

async function rpc(nombre, args) {
  const { data, error } = await sb.rpc(nombre, args || {});
  if (error) {
    const m = error.message || '';
    if (m.startsWith('SESION:')) {                       // la base no reconoce la sesión: volver a la pantalla de entrada
      ST.ini = { ...ST.ini, yo: null }; ST.uid = null;
      setTimeout(render, 0);
      throw new Error(m.slice(7).trim());
    }
    throw new Error(navigator.onLine ? (m || 'No se pudo guardar.') : 'Sin conexión: revisá internet e intentá de nuevo.');
  }
  return data;
}

function usuario() { return ST.ini && ST.ini.yo ? (ST.ini.usuarios || []).find(u => u.id === ST.uid) || null : null; }
function es(rol) { const u = usuario(); return !!u && NIVEL[u.rol] >= NIVEL[rol]; }
const global = (u = usuario()) => !!u && NIVEL[u.rol] >= 3;          // trabaja en todos los locales
const localesDe = u => u ? (global(u) ? ST.ini.sucursales.map(s => s.id) : (u.locales || [u.sucursal_id]).filter(Boolean)) : [];
// Roles globales: el local elegido (o todos). El resto: el local elegido si está habilitado (rotación), si no su local principal.

// Número escrito a mano: "12.500", "12.500,50", "$ 12500"
function numero(x) {
  x = String(x ?? '').replace(/\$/g, '').replace(/\s/g, '');
  if (x.includes(',')) x = x.replace(/\./g, '').replace(',', '.');
  else if ((x.match(/\./g) || []).length > 1 || /^\d{1,3}\.\d{3}$/.test(x)) x = x.replace(/\./g, '');
  const n = parseFloat(x);
  return isNaN(n) ? 0 : n;
}

// Búsqueda: código, nombre, marca o modelo. Atajos de iPhone: ip, ip13, ip15p, ip17pm.
function filtrar(lista, q) {
  const palabras = q.trim().split(/\s+/).filter(Boolean);
  const res = lista.filter(p => palabras.every(w => {
    const m = /^ip(?:hone)?(\d+)?(pm|p|plus|\+|mini)?$/i.exec(w);
    if (m) {
      if (p.marca !== 'iPhone') return false;
      if (!m[1]) return true;
      const suf = { pm: ' Pro Max', p: ' Pro', plus: ' Plus', '+': ' Plus', mini: ' mini' }[(m[2] || '').toLowerCase()] || '';
      const t = (m[1] + suf).toLowerCase();
      return (p.modelo || '').toLowerCase().startsWith(t) || (p.descripcion || '').toLowerCase().includes(t);
    }
    return p.codigo === w || `${p.descripcion} ${p.marca} ${p.modelo}`.toLowerCase().includes(w.toLowerCase());
  }));
  return res.sort((a, b) => (a.codigo === q.trim() ? 0 : 1) - (b.codigo === q.trim() ? 0 : 1) || a.descripcion.localeCompare(b.descripcion));
}

function descargar(nombre, texto, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], { type: tipo }));
  a.download = nombre; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const celdaCsv = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

async function exportarVentas(desde, hasta, suc) {
  try {

    const enc = ['Venta', 'Fecha', 'Sucursal', 'Vendedor', 'Medio de pago', 'Tipo', 'Producto', 'Categoría', 'Marca', 'Modelo', 'Cantidad', 'Precio unitario', 'Subtotal',
                 'Original/Genérico', 'Teléfono', 'Cliente', 'Observaciones'];
    const csv = [enc, ...filas].map(f => f.map(celdaCsv).join(';')).join('\r\n');
    descargar(`ventas_${desde}_${hasta}.csv`, '﻿' + csv, 'text/csv');
  } catch (e) { alert(e.message); }
}

async function iniciar() {

    if (!window.supabase) throw new Error(navigator.onLine ? 'No cargó la librería de datos.' : 'Sin conexión a internet.');
    sb = supabase.createClient(NUBE.url, NUBE.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'techpoint-auth' } });
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { const r = await sb.auth.signInAnonymously(); if (r.error) throw r.error; }
    await cargarInicial();
    window.addEventListener('hashchange', render);

      <div class="aviso error">No se pudo conectar: ${esc(e.message)}</div><button onclick="location.reload()">Reintentar</button></div>`;
  }
}

async function render() {
  document.body.classList.remove('imprime-ticket');
  const [ruta, arg] = (location.hash.slice(1) || 'inicio').split('/');
  const r = RUTAS[ruta] || RUTAS.inicio;
  pintarBarra(ruta);
  if (!usuario()) { document.title = `Entrar · TechPoint ${VERSION}`; $('app').innerHTML = vEntrar(); return; }
  if (ST.ini.yo.debe_cambiar && ruta !== 'clave') return ir('#clave');      // primero, una clave propia
  if (r.rol && !es(r.rol)) { avisar('No tenés permiso para entrar ahí.', true); return ir('#inicio'); }
  if (Date.now() - (ST.ping || 0) > 5 * 60 * 1000) {                        // mantener viva la sesión mientras se usa
    ST.ping = Date.now();
    sb.rpc('tp_ping').then(({ data }) => { if (data && !data.ok) { ST.ini = { ...ST.ini, yo: null }; ST.uid = null; render(); } });
  }
  document.title = `${r.t} · TechPoint ${VERSION}`;
  const aviso = ST.aviso; ST.aviso = null;
  try {
    const html = await r.f(arg);
    $('app').innerHTML = (aviso ? `<div class="aviso ${aviso.error ? 'error' : ''}">${esc(aviso.msg)}</div>` : '') + html;
    if (r.despues) r.despues();
    if (window.__despues) { const f = window.__despues; window.__despues = null; f(); }
  } catch (e) {
    $('app').innerHTML = `<div class="aviso error">${esc(e.message)}</div>`;
  }
}

function buscarVenta() {
  const q = $('buscar').value.trim();
  V.resultados = q ? filtrar(V.catalogo, q).slice(0, 25) : [];
  V.sel = 0; pintarResultados(); $('no-encontrado').innerHTML = '';
}
// Enter en el buscador. La pistola lectora escribe el código y manda Enter: si coincide exacto, se agrega directo.
function enterBuscar() {
  const q = $('buscar').value.trim();
  if (!q) return;
  const exacto = V.catalogo.find(p => p.codigo && p.codigo.toLowerCase() === q.toLowerCase());
  if (exacto) { V.resultados = [exacto]; agregar(0); pitido(); return; }
  buscarVenta();
  if (V.resultados[V.sel]) { agregar(V.sel); return; }
  if (pareceCodigo(q)) {
    $('no-encontrado').innerHTML = `<div class="aviso error" style="margin-top:8px">No hay ningún producto con el código <b>${esc(q)}</b>.
      ${es('dueno') ? `<a href="#producto/nuevo" onclick="ST.codigoNuevo='${esc(q).replace(/'/g, '')}'">Cargarlo ahora</a>` : 'Avisale al encargado para que lo cargue.'}</div>`;
    $('buscar').select();
  }
}
const pareceCodigo = q => /^[0-9A-Za-z._-]{4,}$/.test(q) && /\d/.test(q);
function pitido() {
  try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
        o.frequency.value = 1400; g.gain.value = .05; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .07); } catch (e) {}
}
function pintarResultados() {
  $('resultados').innerHTML = V.resultados.map((p, i) => `
    <div class="resultado ${i === V.sel ? 'sel' : ''}" onclick="agregar(${i})">
      <span>${tilde(p.clase)}${esc(p.descripcion)} <span class="etiqueta">${esc(p.marca)}${p.modelo ? ' ' + esc(p.modelo) : ''}</span>${p.clase ? ` <span class="etiqueta ${p.clase === 'original' ? 'azul' : ''}">${CLASES[p.clase]}</span>` : ''} <span class="suave">${esc(p.codigo || '')}</span></span>
      <span style="white-space:nowrap"><b>${fmt(p.precio)}</b></span>
    </div>`).join('') || ($('buscar').value.trim() ? '<p class="suave">Sin resultados.</p>' : '');
}
function agregar(i) {
  const p = V.resultados[i];
  if (p.codigo === COD_DIFERENCIA) return agregarDiferencia(p);
  const modelo = PIDE_MODELO.includes(p.categoria);
  // Las fundas y protectores van en una línea cada uno: cada uno puede ser para otro celular
  const ya = !modelo && V.carrito.find(x => x.producto_id === p.id);
  if (ya) ya.cantidad++;
  else V.carrito.push({ producto_id: p.id, descripcion: p.descripcion, cantidad: 1, precio: +p.precio, pide_modelo: modelo, clase: p.clase,
                        marca_cel: MARCAS_CEL.includes(p.marca) ? p.marca : '', modelo_cel: p.modelo || '' });
  $('buscar').value = ''; V.resultados = []; pintarResultados(); pintarCarrito();
  // Si pide modelo, el cursor va al primer dato que falta; si no, vuelve al buscador
  const k = V.carrito.length - 1, l = V.carrito[k];
  if (modelo && !ya) (l.marca_cel ? $('mo-' + k) : $('ma-' + k)).focus(); else $('buscar').focus();
}
const faltaModelo = i => i.pide_modelo && (!i.marca_cel || !i.modelo_cel.trim());
function agregarLibre() {
  const d = $('libre-desc').value.trim(), pr = parseFloat($('libre-precio').value);
  if (!d || !(pr >= 0)) return;
  V.carrito.push({ producto_id: null, descripcion: d, cantidad: 1, precio: pr });
  $('libre-desc').value = ''; $('libre-precio').value = ''; pintarCarrito();
}
// Diferencia por devolución: una línea más de la venta con el monto que pone el vendedor
function agregarDiferencia(p) {
  V.carrito.push({ producto_id: p.id, descripcion: p.descripcion, cantidad: 1, precio: +p.precio > 0 ? +p.precio : 0, libre: true });
  $('buscar').value = ''; V.resultados = []; pintarResultados(); pintarCarrito();
  $('pr-' + (V.carrito.length - 1)).focus();
}
const faltaValor = i => i.libre && !(i.precio > 0);
const hayCredito = () => V.carrito.some(i => i.es_credito);
function pintarCarrito() {
  const puede = es('encargado');
  $('carrito').innerHTML = !V.carrito.length ? '<tr><td colspan="5" class="suave">Buscá un producto (o escaneá el código) y tocá Enter para agregarlo.</td></tr>'
    : V.carrito.map((i, k) => i.es_credito ? `<tr class="credito">

      <td class="n"><input id="cr-${k}" class="precio ${i.precio > 0 ? '' : 'falta'}" type="number" min="1" step="1" value="${i.precio || ''}" placeholder="Valor" aria-label="Valor de lo que trae el cliente"
        oninput="V.carrito[${k}].precio=Math.max(0,Math.round(+this.value||0));this.classList.toggle('falta',!(V.carrito[${k}].precio>0));$('crt-${k}').textContent=fmt(-V.carrito[${k}].precio);pintarTotal()"

      <td>${tilde(i.clase)}${esc(i.descripcion)}${i.pide_modelo ? `<div class="modelo-cel">
        <select id="ma-${k}" class="${i.marca_cel ? '' : 'falta'}" aria-label="Marca del celular" onchange="V.carrito[${k}].marca_cel=this.value;this.classList.toggle('falta',!this.value);$('mo-${k}').focus()">
          <option value="">Marca del celular…</option>${MARCAS_CEL.map(m => `<option ${i.marca_cel === m ? 'selected' : ''}>${m}</option>`).join('')}</select>
        <input id="mo-${k}" class="${i.modelo_cel.trim() ? '' : 'falta'}" value="${esc(i.modelo_cel)}" placeholder="Modelo (A15, 13 Pro…)" aria-label="Modelo del celular" autocomplete="off"
          oninput="V.carrito[${k}].modelo_cel=this.value;this.classList.toggle('falta',!this.value.trim())"
          onkeydown="if(event.key==='Enter'){event.preventDefault();$('buscar').focus()}">
      </div>` : ''}</td>
      <td class="n"><input type="number" min="1" value="${i.cantidad}" onchange="V.carrito[${k}].cantidad=Math.max(1,+this.value||1);pintarCarrito()"></td>
      <td class="n"><input id="pr-${k}" class="precio ${faltaValor(i) ? 'falta' : ''}" type="number" min="0" value="${i.libre && !i.precio ? '' : i.precio}" ${i.libre ? 'placeholder="Monto" aria-label="Monto de la diferencia"' : ''} ${puede || i.libre ? '' : 'readonly title="Sólo el encargado o el dueño cambian precios"'} onchange="V.carrito[${k}].precio=Math.max(0,Math.round(+this.value||0));pintarCarrito()"></td>
      <td class="n">${fmt(i.cantidad * i.precio)}</td>
      <td><button class="sec chico" onclick="V.carrito.splice(${k},1);pintarCarrito()" aria-label="Quitar">✕</button></td></tr>`).join('');
  $('obs-caja').hidden = !hayCredito();
  pintarTotal();
}
const productosCarrito = () => V.carrito.filter(i => !i.es_credito);
const creditos = () => V.carrito.filter(i => i.es_credito).reduce((s, i) => s + i.precio, 0);
const subtotal = () => productosCarrito().reduce((s, i) => s + i.cantidad * i.precio, 0) - creditos();
const medioUnico = () => {
  const m = document.querySelector('input[name=medio]:checked').value;
  return m === 'Mercado Pago' ? 'Mercado Pago ' + document.querySelector('input[name=mp]:checked').value : m;
};
const conDescuento = () => !V.pagos && medioUnico() === 'Efectivo' && +ST.ini.descuento > 0;
// El 10 % en efectivo se aplica sólo a lo que se lleva, no a la diferencia por devolución (igual que la base)
const totalFinal = () => conDescuento()
  ? productosCarrito().reduce((s, i) => s + i.cantidad * (i.libre ? i.precio : Math.floor(i.precio * (1 - ST.ini.descuento / 100) + 0.5)), 0) - creditos()
  : subtotal();
function pintarTotal() {
  const t = totalFinal();
  $('total').textContent = fmt(t);
  $('desc').textContent = conDescuento() && V.carrito.length ? `Subtotal ${fmt(subtotal())} · descuento efectivo ${+ST.ini.descuento}%: −${fmt(subtotal() - t)}` : '';
  if (V.pagos) {
    const falta = t - V.pagos.reduce((s, p) => s + (+p.monto || 0), 0);
    $('falta').innerHTML = Math.abs(falta) < 1 ? '<span class="ok">Cubierto</span>' : falta > 0 ? `Falta <b>${fmt(falta)}</b>` : `<span class="mal">Sobra ${fmt(-falta)}</span>`;
  }
}
function dividir(e) {
  if (e) e.preventDefault();
  if (V.pagos) { V.pagos = null; $('mixto').hidden = true; $('medios').hidden = false; $('mp-opciones').hidden = !medioUnico().startsWith('Mercado Pago'); $('dividir').textContent = 'Dividir el pago en varios medios'; pintarTotal(); return; }
  V.pagos = [{ medio: 'Efectivo', monto: '' }, { medio: 'Débito', monto: '' }];
  $('mixto').hidden = false; $('medios').hidden = true; $('mp-opciones').hidden = true; $('dividir').textContent = 'Volver a un solo medio';
  pintarPagos();
}
function otroPago() { V.pagos.push({ medio: MEDIOS_PAGO.find(m => !V.pagos.some(p => p.medio === m)) || MEDIOS_PAGO[0], monto: '' }); pintarPagos(); }
function pintarPagos() {
  $('pagos').innerHTML = V.pagos.map((p, k) => `<tr>
    <td><select onchange="V.pagos[${k}].medio=this.value">${MEDIOS_PAGO.map(m => `<option ${m === p.medio ? 'selected' : ''}>${m}</option>`).join('')}</select></td>
    <td class="n"><input type="number" min="0" step="1" value="${p.monto}" placeholder="$" style="width:110px" oninput="V.pagos[${k}].monto=this.value;pintarTotal()"></td>
    <td>${V.pagos.length > 2 ? `<button type="button" class="sec chico" onclick="V.pagos.splice(${k},1);pintarPagos()">✕</button>` : ''}</td></tr>`).join('');

// Cliente por teléfono: si ya compró, se muestra quién es y cuántas compras tiene
async function buscarClienteTel() {
  const dig = $('tel').value.replace(/\D/g, '');
  if (dig.length < 6) { $('cliente-info').innerHTML = ''; return; }
  try {
    const r = await rpc('tp_clientes_buscar', { ...U(), p_q: dig });
    const c = r.find(x => x.telefono.endsWith(dig.slice(-8))) || null;
    if (c && !$('cliente').value && c.nombre) $('cliente').value = c.nombre;
    $('cliente-info').innerHTML = c ? `<p class="cliente-ok">Cliente conocido: ${esc(c.nombre || 'sin nombre')} · ${c.compras} compra${c.compras === 1 ? '' : 's'} · <a href="#cliente/${c.id}" target="_blank">ver</a></p>`
      : '<p class="suave" style="font-size:13px;margin:4px 0 0">Cliente nuevo: queda guardado con esta venta.</p>';
  } catch (e) { $('cliente-info').innerHTML = ''; }
}
async function cobrar() {
  if (!V.carrito.length) return;
  if (!productosCarrito().length) { $('estado').innerHTML = '<span class="mal">Agregá lo que se lleva el cliente.</span>'; return; }
  const sinModelo = V.carrito.findIndex(faltaModelo);
  if (sinModelo >= 0) {
    $('estado').innerHTML = `<span class="mal">Completá la marca y el modelo del celular en «${esc(V.carrito[sinModelo].descripcion)}».</span>`;
    (V.carrito[sinModelo].marca_cel ? $('mo-' + sinModelo) : $('ma-' + sinModelo)).focus(); return;
  }
  const sinValor = V.carrito.findIndex(faltaValor);
  if (sinValor >= 0) { $('estado').innerHTML = '<span class="mal">Escribí el monto en «Diferencia por devolución».</span>'; $('pr-' + sinValor).focus(); return; }
  if (hayCredito() && $('obs').value.trim().length < 10) {
    $('estado').innerHTML = '<span class="mal">Explicá en Observaciones por qué hay una diferencia por devolución (mínimo 10 letras).</span>'; $('obs').focus(); return;
  }
  if (totalFinal() < 0) { $('estado').innerHTML = '<span class="mal">La diferencia por devolución es mayor que lo que se lleva el cliente.</span>'; return; }
  $('cobrar').disabled = true; $('estado').textContent = 'Guardando…';
  try {
    const suc = sucActual();
    const d = await rpc('tp_venta_registrar', { ...U(), p_suc: suc, p_datos: {
      items: V.carrito, con_modelo: true, vendedor_id: $('vendedor').value || null, cliente: $('cliente').value, telefono: $('tel').value,
      observaciones: hayCredito() ? $('obs').value : '',
      medio_pago: medioUnico(), pagos: V.pagos ? V.pagos.map(p => ({ medio: p.medio, monto: +p.monto || 0 })) : null } });
    $('estado').innerHTML = `<span class="ok">Venta #${d.venta_id} registrada: ${fmt(d.total)}</span> · <a href="#ticket/${d.venta_id}">Ticket / enviar comprobante</a>`;
    V.carrito = []; $('cliente').value = ''; $('tel').value = ''; $('obs').value = ''; $('cliente-info').innerHTML = '';
    if (V.pagos) dividir();
    pintarCarrito(); $('buscar').focus();
  } catch (e) {
    $('estado').innerHTML = `<span class="mal">${esc(e.message)}</span>`;
  } finally { $('cobrar').disabled = false; }
}

const D = { venta: null, nuevos: [], resultados: [], catalogo: [], timer: null };

async function vDevolucion(id) {

    $('buscar').addEventListener('input', () => { clearTimeout(D.timer); D.timer = setTimeout(buscarDev, 120); });
    $('buscar').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); buscarDev(); if (D.resultados[0]) agregarDev(0); } });
    pintarDev();
  });

      </div>
      <div class="panel">
        <h2>Lo que se lleva <span class="suave" style="font-size:13px">(sólo si es un cambio)</span></h2>

      <h2>Diferencia</h2>
      <table><tr><td>Devuelve</td><td class="n" id="t-devuelve">$ 0</td></tr><tr><td>Se lleva</td><td class="n" id="t-lleva">$ 0</td></tr></table>

      <select id="medio" style="width:100%">${MEDIOS_PAGO.map(m => `<option>${m}</option>`).join('')}</select>
      <p><button id="confirmar" style="width:100%;padding:13px" onclick="confirmarDev()">Registrar</button></p>
      <p id="estado" class="suave"></p>
      <p><a href="#ventas">Volver a ventas</a></p>
    </div>
  </div>`;
}
function buscarDev() {
  const q = $('buscar').value.trim();
  D.resultados = q ? filtrar(D.catalogo, q).slice(0, 25) : [];
  $('resultados').innerHTML = D.resultados.map((p, i) => `<div class="resultado" onclick="agregarDev(${i})"><span>${esc(p.descripcion)} <span class="etiqueta">${esc(p.marca)} ${esc(p.modelo || '')}</span></span><span><b>${fmt(p.precio)}</b></span></div>`).join('');
}
function agregarDev(i) {
  const p = D.resultados[i];
  const ya = D.nuevos.find(x => x.producto_id === p.id);
  if (ya) ya.cantidad++; else D.nuevos.push({ producto_id: p.id, descripcion: p.descripcion, cantidad: 1, precio: +p.precio });
  $('buscar').value = ''; D.resultados = []; $('resultados').innerHTML = ''; pintarDev();
}
function pintarDev() {
  $('nuevos').innerHTML = D.nuevos.map((i, k) => `<tr><td>${esc(i.descripcion)}</td>
    <td class="n"><input type="number" min="1" value="${i.cantidad}" onchange="D.nuevos[${k}].cantidad=Math.max(1,+this.value||1);pintarDev()"></td>
    <td class="n">${fmt(i.cantidad * i.precio)}</td><td><button class="sec chico" onclick="D.nuevos.splice(${k},1);pintarDev()">✕</button></td></tr>`).join('');
  const devuelve = [...document.querySelectorAll('[data-item]')].reduce((s, el) => s + (+el.value || 0) * +el.dataset.precio, 0);
  const lleva = D.nuevos.reduce((s, i) => s + i.cantidad * i.precio, 0), dif = lleva - devuelve;
  $('t-devuelve').textContent = '−' + fmt(devuelve); $('t-lleva').textContent = fmt(lleva); $('total').textContent = fmt(dif);
  $('sentido').textContent = dif > 0 ? 'El cliente paga la diferencia' : dif < 0 ? 'Se le devuelve al cliente' : 'Sin diferencia';
}
async function confirmarDev() {
  const devolver = [...document.querySelectorAll('[data-item]')].map(el => ({ item_id: +el.dataset.item, cantidad: +el.value || 0 })).filter(d => d.cantidad > 0);
  $('confirmar').disabled = true;
  try {
    const d = await rpc('tp_devolucion', { ...U(), p_id: D.venta.venta.id, p_devolver: devolver, p_nuevos: D.nuevos, p_medio: $('medio').value });
    $('estado').innerHTML = `<span class="ok">Registrado como #${d.venta_id} (${fmt(d.total)}).</span><br><a href="#ticket/${d.venta_id}">Ver comprobante</a> · <a href="#ventas">Volver a ventas</a>`;
    document.querySelectorAll('[data-item]').forEach(el => el.disabled = true); $('confirmar').hidden = true;
  } catch (e) {
    $('estado').innerHTML = `<span class="mal">${esc(e.message)}</span>`; $('confirmar').disabled = false;
  }
}

async function enviarRespaldo(cajaId) {
  try {
    const r = await rpc('tp_respaldo_caja', { ...U(), p_caja: cajaId });
    if (!r.url) return 'El respaldo por mail no está configurado (Config).';
    const c = r.caja, x = r.detalle, k = x.clases;
    const resumen = [`TechPoint · ${r.sucursal} · cierre de caja del ${c.fecha}`,
      `Abrió ${c.abierta_por || '—'} (${c.abierta_en}) · cerró ${c.cerrada_por || '—'} (${c.cerrada_en || '—'})`, '',
      `Ventas del turno: ${fmt(x.total_ventas)}`, ...x.medios.map(m => `  ${m.medio}: ${fmt(m.total)} (${m.n})`), '',
      `Apertura ${fmt(c.apertura)} + efectivo ${fmt(x.efectivo)} + ingresos ${fmt(x.ingresos)} − egresos ${fmt(x.egresos)}`,
      `Esperado ${fmt(x.esperado)} · contado ${fmt(c.cierre_contado)} · diferencia ${fmt(x.diferencia)}`,
      `Originales: ${k.original.unidades} u. (${fmt(k.original.importe)}) · Genéricos: ${k.generico.unidades} u. (${fmt(k.generico.importe)})` +
        (k.sin_definir.unidades ? ` · Sin definir: ${k.sin_definir.unidades} u.` : ''),
      ...(c.observaciones ? ['', 'Observaciones: ' + c.observaciones] : [])].join('\n');
    const enc = ['Venta', 'Fecha', 'Vendedor', 'Tipo', 'Medio de pago', 'Producto', 'Cantidad', 'Precio unitario', 'Subtotal', 'Estado', 'Teléfono', 'Observaciones'];
    const csv = '﻿' + [enc, ...r.ventas].map(f => f.map(celdaCsv).join(';')).join('\r\n');
    await fetch(r.url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ clave: r.clave, asunto: `TechPoint · ${r.sucursal} · cierre ${c.fecha}`, resumen, csv,
                             archivo: `caja_${r.sucursal.replace(/\W+/g, '-')}_${c.fecha}.csv` }) });
    return 'Respaldo enviado por mail.';
  } catch (e) { return 'No se pudo enviar el respaldo por mail: ' + e.message + '. Probá con "Reenviar respaldo".'; }
}
// Tabla de originales / genéricos (unidades, importe y % sobre lo clasificado)
function tablaClases(k) {
  if (!k) return '';
  const tu = k.original.unidades + k.generico.unidades, ti = +k.original.importe + +k.generico.importe;
  const fila = (t, c) => `<tr><td>${t}</td><td class="n">${c.unidades} u.</td><td class="n">${tu ? pct(c.unidades / tu * 100) : '—'}</td><td class="n">${fmt(c.importe)}</td><td class="n">${ti ? pct(c.importe / ti * 100) : '—'}</td></tr>`;
  return `<table class="clases"><tr><th></th><th class="n">Unid.</th><th class="n">%</th><th class="n">Importe</th><th class="n">%</th></tr>
    ${fila('Originales', k.original)}${fila('Genéricos', k.generico)}
    ${k.sin_definir.unidades ? `<tr><td class="alerta">Sin definir</td><td class="n">${k.sin_definir.unidades} u.</td><td></td><td class="n">${fmt(k.sin_definir.importe)}</td><td></td></tr>` : ''}</table>`;
}

async function cambiarPrecios(f) {
  if (!P.marcados.size) return alert('Marcá al menos un producto.');
  const modo = f.modo.value, paso = +f.redondeo.value, valor = +f.sentido.value * Math.abs(numero(f.valor.value));
  if (!valor) return alert('Poné cuánto querés subir o bajar.');
  if (modo === 'porcentaje' && valor <= -100) return alert('No se puede bajar 100 % o más.');
  const nuevo = p => Math.max(0, Math.round((modo === 'porcentaje' ? +p.precio * (1 + valor / 100) : +p.precio + valor) / paso) * paso);
  const elegidos = P.filas.filter(p => P.marcados.has(p.id) && p.codigo !== COD_DIFERENCIA);
  if (!elegidos.length) return alert('«Diferencia por devolución» no tiene precio fijo: marcá otros productos.');
  const cuanto = modo === 'porcentaje' ? `${Math.abs(valor)} %` : fmt(Math.abs(valor));
  const ej = elegidos.slice(0, 3).map(p => `• ${p.descripcion}: ${fmt(p.precio)} → ${fmt(nuevo(p))}`).join('\n');
  if (!confirm(`Vas a ${valor > 0 ? 'SUBIR' : 'BAJAR'} ${cuanto} el precio de ${elegidos.length} productos.\n\nPor ejemplo:\n${ej}\n\n¿Seguir?`)) return;
  try {
    const r = await rpc('tp_productos_precio', { ...U(), p_ids: elegidos.map(p => p.id), p_modo: modo, p_valor: valor, p_redondeo: paso });
    avisar(`Precio actualizado en ${r.n} productos (${valor > 0 ? '+' : '−'}${cuanto}).`);
  } catch (e) { avisar(e.message, true); }
  render();
}

function leerCsv(texto) {
  const delim = (texto.match(/;/g) || []).length >= (texto.match(/,/g) || []).length ? ';' : ',';
  const filas = []; let fila = [], celda = '', comillas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (comillas) { if (c === '"' && texto[i + 1] === '"') { celda += '"'; i++; } else if (c === '"') comillas = false; else celda += c; }
    else if (c === '"') comillas = true;
    else if (c === delim) { fila.push(celda); celda = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && texto[i + 1] === '\n') i++; fila.push(celda); filas.push(fila); fila = []; celda = ''; }
    else celda += c;
  }
  if (celda || fila.length) { fila.push(celda); filas.push(fila); }
  const enc = (filas.shift() || []).map(h => h.trim().toLowerCase());
  return filas.map(f => Object.fromEntries(enc.map((h, i) => [h, (f[i] || '').trim()])));
}
async function importarCsv(archivo) {
  if (!archivo) return;
  const texto = (await archivo.text()).replace(/^﻿/, '');
  const claseDe = f => {
    const c = (f.clase || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    if (c.startsWith('orig')) return 'original';
    if (c.startsWith('gen')) return 'generico';
    const o = (f.original || '').toLowerCase();
    return ['1', 'si', 'sí', 'x'].includes(o) ? 'original' : ['0', 'no'].includes(o) ? 'generico' : null;
  };
  const filas = leerCsv(texto).filter(f => f.descripcion).map(f => ({
    codigo: f.codigo || null, descripcion: f.descripcion, categoria: f.categoria || 'Otro', marca: f.marca || 'Universal',
    modelo: f.modelo || '', precio: numero(f.precio), costo: numero(f.costo), clase: claseDe(f) }));
  try { const r = await rpc('tp_productos_importar', { ...U(), p_filas: filas }); avisar(`${r.n} productos importados.`); }
  catch (e) { avisar(e.message, true); }
  render();
}

// Medios de pago: total con %, Mercado Pago abierto en QR / cuotas y, con todos los locales, cada medio por local
const ORDEN_MEDIOS = ['Efectivo', 'Débito', 'Crédito', 'Transferencia', ...OPCIONES_MP.map(o => 'Mercado Pago ' + o), 'Mercado Pago'];
const ordenMedio = m => (ORDEN_MEDIOS.indexOf(m) + 1) || 99;
const esMP = m => m.startsWith('Mercado Pago');
function panelMedios(r, sid) {
  const medios = [...r.medios].sort((a, b) => ordenMedio(a.medio) - ordenMedio(b.medio));
  const total = medios.reduce((s, m) => s + +m.total, 0);
  const pctDe = x => total ? `${Math.round(x / total * 100)} %` : '—';
  const mp = medios.filter(m => esMP(m.medio));
  const mpTotal = mp.reduce((s, m) => s + +m.total, 0), mpVentas = mp.reduce((s, m) => s + +m.ventas, 0);
  const fila = (m, sub) => `<tr><td>${sub ? `<span class="suave">↳</span> ${esc(m.medio.replace('Mercado Pago', '').trim() || 'sin detalle (ventas anteriores)')}` : esc(m.medio)}</td>
    <td class="n">${m.ventas}</td><td class="n">${fmt(m.total)}</td><td class="n">${pctDe(+m.total)}</td></tr>`;
  const filas = [];
  medios.forEach(m => {
    if (!esMP(m.medio)) return filas.push(fila(m));
    if (m === mp[0]) filas.push(`<tr><td><b>Mercado Pago</b></td><td class="n">${mpVentas}</td><td class="n"><b>${fmt(mpTotal)}</b></td><td class="n"><b>${pctDe(mpTotal)}</b></td></tr>`);
    filas.push(fila(m, true));
  });
  // Por local: una columna por medio que tuvo movimiento
  const porSuc = !sid && r.medios_suc ? r.medios_suc : [];
  const cols = medios.map(m => m.medio);
  const locales = [...new Set(porSuc.map(x => x.sucursal))];
  const celda = (s, m) => porSuc.find(x => x.sucursal === s && x.medio === m);
  return `<div class="panel tabla-scroll"><h2>Medios de pago <span class="suave">· ${fmt(total)}</span></h2>
    <p class="suave">Lo cobrado por cada medio (en un pago dividido, cada parte cuenta en su medio).</p>
    <table><tr><th>Medio</th><th class="n">Ventas</th><th class="n">Importe</th><th class="n">% del total</th></tr>
      ${filas.join('') || '<tr><td colspan="4" class="suave">Sin ventas en el período.</td></tr>'}
      ${medios.length ? `<tr><td><b>Total</b></td><td></td><td class="n"><b>${fmt(total)}</b></td><td class="n">100 %</td></tr>` : ''}
    </table>
    ${locales.length > 1 ? `<h3 style="margin-top:18px">Por local</h3>
    <table><tr><th>Local</th>${cols.map(c => `<th class="n">${esc(c)}</th>`).join('')}<th class="n">Total</th></tr>
      ${locales.map(s => `<tr><td>${esc(s)}</td>${cols.map(c => `<td class="n">${celda(s, c) ? fmt(celda(s, c).total) : '—'}</td>`).join('')}
        <td class="n"><b>${fmt(porSuc.filter(x => x.sucursal === s).reduce((t, x) => t + +x.total, 0))}</b></td></tr>`).join('')}
    </table>` : ''}
  </div>`;
}

  const filaClase = (nombre, k, b) => { const tu = k.original.unidades + k.generico.unidades, ti = +k.original.importe + +k.generico.importe;
    return `<tr class="${b ? 'total' : ''}"><td>${nombre}</td><td class="n">${k.original.unidades}</td><td class="n">${fmt(k.original.importe)}</td>
      <td class="n">${k.generico.unidades}</td><td class="n">${fmt(k.generico.importe)}</td>
      <td class="n"><b>${tu ? pct(k.original.unidades / tu * 100) : '—'}</b> / ${tu ? pct(k.generico.unidades / tu * 100) : '—'}</td>
      <td class="n">${ti ? pct(k.original.importe / ti * 100) : '—'} / ${ti ? pct(k.generico.importe / ti * 100) : '—'}</td>
      <td class="n ${k.sin_definir.unidades ? 'alerta' : 'suave'}">${k.sin_definir.unidades || '—'}</td></tr>`; };
  return `<h1>Reportes</h1>
  ${filtroPeriodo(true, `<button type="button" class="sec" onclick="print()">Imprimir</button> <button type="button" class="sec" onclick="exportarVentas(F.desde,F.hasta,sucFiltro())">Descargar detalle (CSV)</button>`)}
  <div class="kpis">
    <div class="kpi"><small>Total vendido</small><b>${fmt(r.res.total)}</b></div>
    <div class="kpi"><small>Ventas</small><b>${r.res.ventas}</b></div>
    <div class="kpi"><small>Unidades</small><b>${r.res.unidades}</b></div>
    <div class="kpi"><small>Ticket promedio</small><b>${fmt(r.res.ticket)}</b></div>
    <div class="kpi"><small>% originales (unid.)</small><b>${pctOriginales(total)}</b></div>
  </div>
  <div class="panel"><h2>Objetivos de ${mes}</h2>${tablaObjetivos(r.avance, false)}</div>
  <div class="panel tabla-scroll"><h2>Originales y genéricos por local</h2>
    <p class="suave">Del período elegido. El % es sobre lo clasificado; "sin definir" son productos que todavía no se marcaron como original o genérico (se arreglan en Productos). Por caja: pantalla Caja.</p>
    <table class="clases"><tr><th>Local</th><th class="n">Originales (u.)</th><th class="n">Importe</th><th class="n">Genéricos (u.)</th><th class="n">Importe</th><th class="n">% unid. orig. / gen.</th><th class="n">% importe orig. / gen.</th><th class="n">Sin definir</th></tr>
      ${r.clases.map(s => filaClase(esc(s.sucursal), s.clases)).join('')}
      ${r.clases.length > 1 ? filaClase('Total', total, true) : ''}
    </table></div>
  <div class="panel tabla-scroll"><h2>Proyección de ${MESES[r.mes.mes]} por vendedor</h2>
    <p class="suave">Lo vendido en el mes (${r.mes.pasados} de ${r.mes.dias} días) y a cuánto llegaría cada uno al ritmo actual.${sid ? '' : ' "% del local" es su parte en la proyección de su local.'}</p>
    <table><tr><th>Vendedor</th>${!sid ? '<th>Local</th>' : ''}<th class="n">Vendido en el mes</th><th class="n">Proyección a fin de mes</th><th class="n">% del local</th></tr>
      ${r.proy_vendedores.map(v => `<tr><td>${esc(v.vendedor)}</td>${!sid ? `<td>${esc(v.sucursal)}</td>` : ''}<td class="n">${fmt(v.vendido)}</td><td class="n"><b>${fmt(v.proyeccion)}</b></td><td class="n">${pct(v.pct_local)}</td></tr>`).join('')
        || '<tr><td colspan="5" class="suave">Sin ventas en el mes.</td></tr>'}
    </table></div>
  <div class="grilla">
    <div class="panel tabla-scroll"><h2>Ventas por vendedor</h2>
      <table><tr><th>Vendedor</th>${!sid ? '<th>Sucursal</th>' : ''}<th class="n">Ventas</th><th class="n">Unid.</th><th class="n">Total</th></tr>
        ${r.vendedores.map(v => `<tr><td>${esc(v.vendedor)}</td>${!sid ? `<td>${esc(v.sucursal)}</td>` : ''}<td class="n">${v.ventas}</td><td class="n">${v.unidades}</td><td class="n">${fmt(v.total)}</td></tr>`).join('') || '<tr><td class="suave">Sin datos.</td></tr>'}
      </table></div>
    <div class="panel">
      ${r.sucursales.length ? `<h2>Por sucursal</h2><table>${r.sucursales.map(s => `<tr><td>${esc(s.sucursal)}</td><td class="n">${s.ventas}</td><td class="n">${fmt(s.total)}</td></tr>`).join('')}</table>`
        : '<h2>Por sucursal</h2><p class="suave">Elegí "Todas las sucursales" para comparar los locales.</p>'}
    </div>
  </div>
  ${panelMedios(r, sid)}
  <div class="panel tabla-scroll"><h2>Top 10 productos (unidades)</h2>
    <table><tr><th>#</th><th>Producto</th><th class="n">Unidades</th><th class="n">Importe</th><th>Vendedores (unidades)</th></tr>
      ${r.top.map((t, i) => `<tr><td>${i + 1}</td><td>${esc(t.descripcion)}</td><td class="n"><b>${t.unidades}</b></td><td class="n">${fmt(t.importe)}</td>
        <td>${t.vendedores.map(v => `${esc(v.vendedor)}: ${v.unidades}`).join(' · ')}</td></tr>`).join('') || '<tr><td colspan="5" class="suave">Sin datos.</td></tr>'}
    </table></div>
  <div class="panel tabla-scroll"><h2>Fundas por marca y modelo del celular <span class="suave">(incluye flip covers) · total ${totalFundas}</span></h2>
    <p class="suave">Según la marca y el modelo que carga el vendedor en cada venta.</p>
    ${fundas.map(g => `<h3>${g.marca} · ${g.total} unidades</h3>
      <table><tr><th>Modelo</th>${g.marca === 'Otras marcas' ? '<th>Marca</th>' : ''}<th class="n">Fundas</th><th class="n">Flip cover</th><th class="n">Total</th></tr>
        ${g.modelos.map(m => `<tr><td>${esc(m.modelo || '(sin modelo)')}</td>${g.marca === 'Otras marcas' ? `<td>${esc(m.marca)}</td>` : ''}<td class="n">${m.fundas}</td><td class="n">${m.flip}</td><td class="n"><b>${m.total}</b></td></tr>`).join('')}
      </table>`).join('') || '<p class="suave">No se vendieron fundas en el período.</p>'}
  </div>
  ${r.vidrios ? `<div class="panel tabla-scroll"><h2>Protectores de pantalla por marca y modelo <span class="suave">(vidrio templado e hydrogel) · total ${r.vidrios.reduce((s, x) => s + +x.total, 0)}</span></h2>
    <table><tr><th>Marca</th><th>Modelo</th><th class="n">Unidades</th></tr>
      ${r.vidrios.map(x => `<tr><td>${esc(x.marca)}</td><td>${esc(x.modelo || '(sin modelo)')}</td><td class="n"><b>${x.total}</b></td></tr>`).join('') || '<tr><td colspan="3" class="suave">No se vendieron protectores en el período.</td></tr>'}
    </table></div>` : ''}
  <div class="panel tabla-scroll"><h2>Diferencias por devolución <span class="suave">· ${r.creditos.length}</span></h2>
    <p class="suave">Ventas donde se descontó algo que trajo el cliente sin venta previa en el sistema, con el motivo que escribió el vendedor.</p>
    <table><tr><th>Venta</th><th>Fecha</th>${!sid ? '<th>Local</th>' : ''}<th>Vendedor</th><th class="n">Descontado</th><th>Motivo</th></tr>
      ${r.creditos.map(c => `<tr><td><a href="#ticket/${c.venta}">#${c.venta}</a></td><td>${fc(c.fecha)}</td>${!sid ? `<td>${esc(c.sucursal)}</td>` : ''}<td>${esc(c.vendedor)}</td><td class="n">${fmt(c.monto)}</td><td>${esc(c.observaciones)}</td></tr>`).join('')
        || '<tr><td colspan="6" class="suave">Ninguna en el período.</td></tr>'}
    </table></div>
  <div class="panel tabla-scroll"><h2>Productos originales vendidos</h2>
    <table>${r.originales.map(o => `<tr><td>${esc(o.descripcion)}</td><td class="n">${o.unidades} u.</td><td class="n">${fmt(o.importe)}</td></tr>`).join('') || '<tr><td class="suave">Ninguno (marcá los productos como "Original" en Productos).</td></tr>'}</table>
  </div>`;
}

// ---------------------------------------------------------------- configuración (sólo dueño y superadmin)
const C = { anio: null, mes: null, editar: null };
async function vConfig() {
  C.anio = C.anio || +hoy().slice(0, 4); C.mes = C.mes || +hoy().slice(5, 7);
  const d = await rpc('tp_config', { ...U(), p_anio: C.anio, p_mes: C.mes });
  const res = es('dueno') ? await rpc('tp_borrar_resumen', U()).catch(() => null) : null;
  const opcSuc = sel => `<option value="">—</option>${ST.ini.sucursales.map(s => `<option value="${s.id}" ${sel === s.id ? 'selected' : ''}>${esc(s.nombre)}</option>`).join('')}`;
  const opcRol = sel => Object.entries(NOMBRE_ROL).map(([r, n]) => `<option value="${r}" ${sel === r ? 'selected' : ''}>${n}</option>`).join('');
  const checks = (locales) => `<div class="locales">${ST.ini.sucursales.map(s => `<label><input type="checkbox" data-local="${s.id}" ${locales.includes(s.id) ? 'checked' : ''}> ${esc(s.nombre)}</label>`).join('')}</div>`;
  const localesTxt = u => NIVEL[u.rol] >= 3 ? 'Todos' : (u.locales || []).filter(id => id !== u.sucursal_id).map(sucNombre).join(', ');
  return `<h1>Configuración</h1>
  <div class="panel tabla-scroll">
    <h2>Usuarios y permisos</h2>
    <p class="suave"><b>Vendedor</b>: vende, abre y cierra la caja del local donde está trabajando y ve sus ventas.
      <b>Encargado</b>: además anula ventas, hace cambios y devoluciones y ve productos y reportes de su local.
      <b>Supervisor</b>: lo mismo que el encargado, en todos los locales.
      <b>Dueño</b>: todo; crea usuarios, define roles, permisos y claves, y cambia productos y precios.
      <b>Superadministrador</b>: un escalón arriba del dueño; además es el único que maneja al dueño y a otros superadministradores.</p>
    <p class="suave"><b>Rotación:</b> marcá en "Otros locales" dónde más puede trabajar cada uno. Al entrar, elige el local arriba a la derecha.</p>
    <p class="suave"><b>Claves:</b> cada uno entra con su usuario y su clave (un PIN de 4 números, para todos los roles).
      Las claves las ponen sólo el dueño y los superadministradores; al dueño y a los superadministradores, sólo un superadministrador.
      La primera vez que alguien entra con la clave que le pusieron, el sistema le pide que ponga una propia.</p>
    <table><tr><th>Nombre</th><th>Entra como</th><th>Rol</th><th>Local principal</th><th>Otros locales</th><th></th></tr>
      ${d.usuarios.map(u => C.editar === u.id ? `<tr><td colspan="6">
          <form class="fila" onsubmit="event.preventDefault();guardarConfig('usuario',datosUsuario(this,${u.id}))">
            <label>Nombre<input name="nombre" value="${esc(u.nombre)}" required></label>
            <label>Usuario para entrar<input name="usuario" value="${esc(u.usuario || '')}" autocapitalize="none" pattern="[A-Za-z0-9._\\-]{3,30}" required></label>
            <label>Rol<select name="rol">${opcRol(u.rol)}</select></label>
            <label>Local principal<select name="suc">${opcSuc(u.sucursal_id)}</select></label>
            <label style="flex-basis:100%">Otros locales donde puede trabajar (no hace falta para supervisor, dueño y superadmin)${checks(u.locales || [])}</label>
            <button>Guardar</button> <button type="button" class="sec" onclick="C.editar=null;render()">Cancelar</button>
          </form></td></tr>`
        : `<tr><td>${esc(u.nombre)}</td><td>${u.usuario ? esc(u.usuario) : '<span class="alerta">sin usuario</span>'}</td><td>${NOMBRE_ROL[u.rol]}</td>
          <td>${esc(u.sucursal || 'Todos')}</td><td>${esc(localesTxt(u) || '—')}</td>
          <td class="n acciones">${puedeManejar(u) ? `<button class="sec chico" onclick="C.editar=${u.id};render()">Editar</button>
            <button class="sec chico" onclick="claveDe(${u.id},'${esc(u.nombre).replace(/'/g, '')}','${u.rol}')">PIN</button>
            ${u.id !== ST.uid ? `<button class="sec chico" onclick="if(confirm('¿Dar de baja a ${esc(u.nombre).replace(/'/g, '')}? Ya no va a poder entrar.'))guardarConfig('baja_usuario',{id:${u.id}})">Baja</button>` : ''}` : ''}</td></tr>`).join('')}
    </table>
    <h3>Agregar usuario</h3>
    <form class="fila" onsubmit="event.preventDefault();guardarConfig('usuario',datosUsuario(this,null))">
      <label>Nombre<input name="nombre" required></label>
      <label>Usuario para entrar<input name="usuario" placeholder="ej: lucas.belgrano" autocapitalize="none" pattern="[A-Za-z0-9._\\-]{3,30}" required></label>
      <label>PIN inicial (4 números)<input name="clave" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" required></label>
      <label>Rol<select name="rol">${opcRol('vendedor')}</select></label>
      <label>Local principal<select name="suc">${opcSuc(null)}</select></label>
      <label style="flex-basis:100%">Otros locales donde puede trabajar${checks([])}</label>
      <button>Agregar</button>
    </form>
  </div>
  ${d.sin_clase ? `<div class="aviso">Hay <b>${d.sin_clase}</b> productos sin definir como original o genérico. <a href="#productos" onclick="P.clase='sin'">Clasificarlos</a></div>` : ''}
  <div class="grilla">
    <div class="panel">
      <h2>Objetivos mensuales</h2>
      <form class="fila" style="margin-bottom:10px" onsubmit="event.preventDefault();C.mes=+this.mes.value;C.anio=+this.anio.value;render()">
        <label>Mes<select name="mes">${MESES.slice(1).map((m, i) => `<option value="${i + 1}" ${i + 1 === C.mes ? 'selected' : ''}>${m}</option>`).join('')}</select></label>
        <label>Año<input type="number" name="anio" value="${C.anio}" style="width:90px"></label>
        <button class="sec">Cambiar</button>
      </form>
      <form id="form-objetivos" onsubmit="event.preventDefault();guardarConfig('objetivo',{anio:C.anio,mes:C.mes,montos:[...this.querySelectorAll('input[data-suc]')].map(i=>({sucursal_id:+i.dataset.suc,monto:i.value.trim()?numero(i.value):''}))})">
        <table>${d.objetivos.map(o => `<tr><td>${esc(o.nombre)}</td><td class="n"><input data-suc="${o.id}" value="${o.monto ? Math.round(o.monto) : ''}" placeholder="$" style="width:150px"></td></tr>`).join('')}</table>
        <p><button>Guardar objetivos de ${MESES[C.mes]}</button></p>
      </form>
    </div>
    <div class="panel">
      <h2>Respaldo por mail al cerrar la caja</h2>
      <p class="suave">Cada cierre de caja manda un mail con el resumen y el detalle en Excel. Se hace con un script de Google en tu cuenta de Gmail:
        las instrucciones están en la carpeta <code>respaldo/</code> del proyecto. Pegá acá el link que te da Google y la misma clave que pusiste en el script.</p>
      <form onsubmit="event.preventDefault();guardarConfig('respaldo',{url:this.url.value,clave:this.clave.value})">
        <label class="suave" style="display:flex;flex-direction:column;gap:4px">Link del script (termina en /exec)<input name="url" value="${esc(d.respaldo_url)}" placeholder="https://script.google.com/macros/s/…/exec"></label>
        <label class="suave" style="display:flex;flex-direction:column;gap:4px;margin-top:8px">Clave<input name="clave" value="${esc(d.respaldo_clave)}" autocomplete="off"></label>
        <p><button>Guardar</button> ${d.respaldo_url ? '<span class="ok">Activo</span>' : '<span class="alerta">Sin configurar</span>'}</p>
      </form>
    </div>
    <div class="panel">
      <h2>Descuento por pago en efectivo</h2>
      <p class="suave">Se aplica solo cuando la venta se paga <b>toda</b> en efectivo (no en pagos divididos), y no sobre la diferencia por devolución. 0 = sin descuento.</p>
      <form class="fila" onsubmit="event.preventDefault();guardarConfig('descuento',{descuento:numero(this.descuento.value)})">
        <label>Descuento (%)<input type="number" name="descuento" min="0" max="50" step="0.5" value="${+ST.ini.descuento}" style="width:100px"></label>
        <button>Guardar</button>
      </form>
    </div>
    <div class="panel">
      <h2>Sucursales</h2>
      <form onsubmit="event.preventDefault();guardarConfig('sucursal',{sucursales:[...this.querySelectorAll('input[data-suc]')].map(i=>({id:+i.dataset.suc,nombre:i.value})),nueva:this.nueva.value})">
        <table>${ST.ini.sucursales.map(s => `<tr><td><input data-suc="${s.id}" value="${esc(s.nombre)}"></td></tr>`).join('')}
          <tr><td><input name="nueva" placeholder="Nueva sucursal"></td></tr></table>
        <p><button>Guardar</button></p>
      </form>
    </div>
    ${res ? `<div class="panel">
      <h2>Borrar datos de prueba</h2>
      <p class="suave">Elegí qué borrar. <b>Nunca se borran</b> los productos activos (${res.productos_activos}), los locales, los usuarios ni la configuración. No se puede deshacer.</p>
      <form onsubmit="event.preventDefault();borrarDatos(this)">
        <div class="locales" style="flex-direction:column;align-items:flex-start">
          <label><input type="checkbox" name="borrar" value="ventas" checked> Ventas, cambios y devoluciones (${res.ventas}${res.primera ? `, del ${fd(res.primera)} al ${fd(res.ultima)}` : ''})</label>
          <label><input type="checkbox" name="borrar" value="cajas" checked> Cajas con sus ingresos y egresos (${res.cajas})</label>
          <label><input type="checkbox" name="borrar" value="clientes" checked> Clientes (${res.clientes})</label>
          <label><input type="checkbox" name="borrar" value="objetivos"> Objetivos de venta (${res.objetivos})</label>
          <label><input type="checkbox" name="borrar" value="productos_baja"> Productos dados de baja: los viejos que ya no están en la lista (${res.productos_baja})</label>
        </div>
        <label style="margin-top:10px">Hasta el día (inclusive; vacío = todo)<input type="date" name="hasta" style="width:180px"></label>
        <p class="suave" style="margin:6px 0 0">Las cajas y los clientes se borran sólo si no les quedan ventas.</p>
        <p><button class="peligro">Borrar lo elegido</button></p>
      </form>
    </div>` : ''}
  </div>`;
}
const fd = d => d.split('-').reverse().join('/');
// Borrar datos de prueba (009): pide escribir BORRAR para confirmar
async function borrarDatos(f) {
  const que = [...f.querySelectorAll('[name=borrar]:checked')].map(c => c.value);
  if (!que.length) return alert('Marcá qué querés borrar.');
  const nombres = [...f.querySelectorAll('[name=borrar]:checked')].map(c => '• ' + c.parentElement.textContent.trim()).join('\n');
  const hasta = f.hasta.value;
  if ((prompt(`Vas a borrar${hasta ? ` (hasta el ${fd(hasta)})` : ''}:\n${nombres}\n\nNo se puede deshacer. Para seguir escribí BORRAR`) || '').trim().toUpperCase() !== 'BORRAR') return;
  try {
    const r = await rpc('tp_borrar_datos', { ...U(), p_que: { borrar: que, hasta: hasta || null } });
    avisar(`Borrado: ${r.ventas} ventas, ${r.cajas} cajas, ${r.clientes} clientes, ${r.objetivos} objetivos, ${r.productos} productos dados de baja.`);
    await cargarInicial();
  } catch (e) { avisar(e.message, true); }
  render();
}
const datosUsuario = (f, id) => ({ id, nombre: f.nombre.value, usuario: f.usuario.value, clave: f.clave ? f.clave.value : null,
                                   rol: f.rol.value, sucursal_id: f.suc.value,
                                   locales: [...f.querySelectorAll('[data-local]:checked')].map(c => +c.dataset.local) });
// Al dueño y a los superadministradores sólo los maneja un superadministrador
const puedeManejar = x => usuario().rol === 'superadmin' || !['dueno', 'superadmin'].includes(x.rol) || x.id === ST.uid;
async function guardarConfig(accion, datos) {
  try {
    await rpc('tp_config_guardar', { ...U(), p_accion: accion, p_datos: datos });
    C.editar = null; await cargarInicial(); avisar('Guardado.');
  } catch (e) { avisar(e.message, true); }
  render();
}

iniciar();
</script>
